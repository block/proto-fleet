version: 2
enable-beta-ecosystems: true

multi-ecosystem-groups:
  server:
    schedule:
      interval: monthly
  client:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    # github-actions and docker ecosystems do not track semver, so only
    # default-days is supported on their cooldown blocks.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /client
    multi-ecosystem-group: client
    patterns:
      - "*"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    groups:
      node-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "swagger-typescript-api"

  - package-ecosystem: docker
    directory: /deployment-files/client
    multi-ecosystem-group: client
    patterns:
      - "*"
    cooldown:
      default-days: 7
    ignore:
      # Image upgrades past a patch release are manual; see
      # docs/development/dependencies.md.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: gomod
    directories:
      - /server
      - /server/fake-antminer
      - /server/fake-ct1
      - /server/fake-proto-rig
      - /plugin/proto
      - /plugin/antminer
      - /plugin/virtual
      - /sdk/mdk
      - /tests/plugin-contract
    multi-ecosystem-group: server
    patterns:
      - "*"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    groups:
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # v0.8.0 and later link connect-go v2 into fleetd; lift this once the
      # server moves to connectrpc.com/connect/v2.
      - dependency-name: "connectrpc.com/validate"
        versions: [">= 0.8.0"]

  - package-ecosystem: cargo
    directories:
      - /sdk/rust/proto-fleet-plugin
      - /plugin/asicrs
    multi-ecosystem-group: server
    patterns:
      - "*"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /deployment-files/server
      - /plugin/example-python
      - /server
      - /server/devtools/modbussim
      - /server/devtools/mqttsim
      - /server/fake-antminer
      - /server/fake-ct1
      - /server/fake-proto-rig
      - /server/timescaledb
    multi-ecosystem-group: server
    patterns:
      - "*"
    cooldown:
      default-days: 7
    ignore:
      # Image upgrades past a patch release are manual; see
      # docs/development/dependencies.md.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # golang images move with the Hermit Go toolchain and go.work.
      - dependency-name: "golang"

  - package-ecosystem: docker-compose
    directories:
      - /deployment-files
      - /deployment-files/ha
      - /server
    multi-ecosystem-group: server
    patterns:
      - "*"
    cooldown:
      default-days: 7
    ignore:
      # Image upgrades past a patch release are manual; see
      # docs/development/dependencies.md.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "proto-fleet-*"
      # Dependabot reads single-architecture tags such as 0.150.1-386 as newer
      # patch releases of the multi-architecture tag.
      - dependency-name: "otel/opentelemetry-collector-contrib"

  # Patroni requirements feed the HA release compatibility fingerprint, so
  # they update quarterly instead of with the monthly server group.
  - package-ecosystem: pip
    directory: /deployment-files/ha
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    groups:
      ha-python:
        applies-to: version-updates
        patterns:
          - "*"
      ha-python-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
