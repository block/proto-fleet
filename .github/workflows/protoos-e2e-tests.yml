name: ProtoOS E2E Tests

on:
  schedule:
    # Run daily at 6 AM UTC on main branch
    - cron: "0 6 * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # act expands matrix entries concurrently even with one requested job.
        # One local entry runs both projects below against a single simulator.
        project: ${{ fromJSON(github.event.act && '["local"]' || '["desktop","mobile"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ env.ACT != 'true' }}
          persist-credentials: false

      - name: Build fake-proto-rig simulator
        run: |
          simulator="${ACT:+${LOCAL_CI_COMPOSE_PROJECT_NAME}-}fake-proto-rig"
          echo "Building fake-proto-rig simulator..."
          docker build \
            -t "$simulator" \
            -f server/fake-proto-rig/Dockerfile \
            .

      - name: Start fake-proto-rig simulator
        run: |
          simulator="${ACT:+${LOCAL_CI_COMPOSE_PROJECT_NAME}-}fake-proto-rig"
          simulator_port="${LOCAL_CI_PROTOOS_SIMULATOR_PORT:-8080}"
          docker run -d \
            --name "$simulator" \
            -p "$simulator_port:8080" \
            "$simulator"

      - name: Cache Node modules
        if: ${{ env.ACT != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            client/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install client dependencies
        if: ${{ env.ACT != 'true' }}
        working-directory: client
        run: npm ci

      - name: Build ProtoOS frontend
        working-directory: client
        run: npm run build:protoOS

      - name: Start ProtoOS frontend
        working-directory: client
        run: |
          frontend_port="${LOCAL_CI_PROTOOS_FRONTEND_PORT:-3000}"
          proxy_url="${LOCAL_CI_PROTOOS_PROXY_URL:-http://localhost:8080}"
          nohup env PROXY_URL="$proxy_url" npm run preview:protoOS -- \
            --port "$frontend_port" --host 0.0.0.0 --strictPort \
            > /tmp/vite-preview.log 2>&1 < /dev/null &

      - name: Install Playwright browsers
        working-directory: client/e2eTests/protoOS
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (${{ matrix.project }})
        working-directory: client/e2eTests/protoOS
        run: |
          projects=("$MATRIX_PROJECT")
          if [[ -n "${ACT:-}" ]]; then
            projects=(desktop mobile)
          fi

          status=0
          for project in "${projects[@]}"; do
            if [[ -n "${ACT:-}" && "$project" != "${projects[0]}" ]]; then
              simulator="${LOCAL_CI_COMPOSE_PROJECT_NAME}-fake-proto-rig"
              simulator_port="${LOCAL_CI_PROTOOS_SIMULATOR_PORT:-8080}"
              echo "Resetting simulator before local ${project} tests..."
              docker rm -f "$simulator"
              docker run -d --name "$simulator" -p "$simulator_port:8080" "$simulator"
            fi
            npx playwright test --project="$project" || status=1
          done
          exit "$status"
        env:
          CI: true
          E2E_BASE_URL: ${{ env.LOCAL_CI_PROTOOS_BASE_URL }}
          MATRIX_PROJECT: ${{ matrix.project }}

      - name: Upload Playwright report
        id: playwright-report-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && env.ACT != 'true' }}
        with:
          name: playwright-report-protoos-${{ matrix.project }}
          path: client/e2eTests/protoOS/playwright-report/
          retention-days: 30

      - name: Note report availability
        if: ${{ !cancelled() && env.ACT != 'true' }}
        env:
          PLAYWRIGHT_REPORT_ARTIFACT_URL: ${{ steps.playwright-report-artifact.outputs.artifact-url }}
        run: |
          echo "## ProtoOS E2E Report (${{ matrix.project }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${PLAYWRIGHT_REPORT_ARTIFACT_URL}" ]]; then
            echo "📦 **[Download Playwright report artifact](${PLAYWRIGHT_REPORT_ARTIFACT_URL})**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📦 **Playwright report:** Available in the artifacts section as \`playwright-report-protoos-${{ matrix.project }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Testmo CLI
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          npm install -g @testmo/testmo-cli@1.0.0

      - name: Submit test results to Testmo
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        working-directory: client/e2eTests/protoOS
        env:
          TESTMO_TOKEN: ${{ secrets.TESTMO_TOKEN }}
        run: |
          # Add XML declaration if missing (Playwright sometimes omits it on CI)
          if ! head -n 1 test-results/results.xml | grep -q '<?xml'; then
            echo "XML declaration missing, adding it..."
            echo '<?xml version="1.0" encoding="UTF-8"?>' | cat - test-results/results.xml > test-results/results-fixed.xml
            mv test-results/results-fixed.xml test-results/results.xml
            echo "First 2 lines after fix:"
            head -n 2 test-results/results.xml
          else
            echo "XML declaration already present"
          fi

          testmo automation:run:submit \
            --instance https://proto.testmo.net \
            --project-id 2 \
            --name "Proto OS E2E Tests - ${{ matrix.project }} - $(date +'%Y-%m-%d %H:%M')" \
            --source "protoos-e2e-tests-${{ matrix.project }}" \
            --results test-results/*.xml

      - name: Upload test screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && env.ACT != 'true' }}
        with:
          name: playwright-screenshots-protoos-${{ matrix.project }}
          path: client/e2eTests/protoOS/test-results/
          retention-days: 7

      - name: Dump simulator logs on failure
        if: failure()
        run: |
          simulator="${ACT:+${LOCAL_CI_COMPOSE_PROJECT_NAME}-}fake-proto-rig"
          echo "=== fake-proto-rig Logs ==="
          docker logs "$simulator" 2>&1 || echo "No fake-proto-rig logs available"

      - name: Cleanup
        if: always()
        run: |
          simulator="${ACT:+${LOCAL_CI_COMPOSE_PROJECT_NAME}-}fake-proto-rig"
          docker rm -f "$simulator" || true
