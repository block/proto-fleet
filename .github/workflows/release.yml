name: Create ProtoFleet Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # vX.Y.Z with an optional SemVer 2.0 prerelease suffix (e.g. v1.2.3-alpha.4).
          # Identifiers use [0-9A-Za-z-] and are separated by dots. They cannot
          # be empty, numeric identifiers cannot have a leading zero, and build
          # metadata is not allowed. The CT1 Debian package version comes from
          # the tag, and a final hyphen would give an invalid Debian version.
          numeric='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver_re="^v${numeric}\.${numeric}\.${numeric}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "$TAG_NAME" =~ $semver_re ]] || [[ "$TAG_NAME" == *- ]]; then
            echo "::error::Tag '$TAG_NAME' does not match expected format (e.g., v1.2.3, v1.2.3-rc.1, or v1.2.3-<label>.1). The suffix must follow SemVer 2.0: dot-separated [0-9A-Za-z-] identifiers, no empty identifier, no leading zero in a numeric identifier, no '+' build metadata, and no final '-'."
            exit 1
          fi
          # Reserve RC naming: any RC-looking tag must be canonical vX.Y.Z-rc.N.
          # Matches the on-main gate below (which keys on "-rc." anywhere,
          # case-insensitively) so a near-miss can't slip past it as a test build.
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease="${TAG_NAME#*-}"
            first_token="${prerelease%%[.-]*}"
            first_token_lc=$(printf '%s' "$first_token" | tr 'A-Z' 'a-z')
            tag_lc=$(printf '%s' "$TAG_NAME" | tr 'A-Z' 'a-z')
            if { [[ "$first_token_lc" == rc* ]] || [[ "$tag_lc" == *-rc.* ]]; } && \
               [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              echo "::error::Tag '$TAG_NAME' looks like a release candidate but is malformed. RC tags must be exactly vX.Y.Z-rc.N (lowercase 'rc', dot before the number), e.g. v1.2.3-rc.1. For branch/test builds, use a suffix without 'rc' (e.g. v1.2.3-<label>.1)."
              exit 1
            fi
          fi
          echo "Tag '$TAG_NAME' is valid"

      # Releases and RCs must come from main; other prerelease suffixes stay
      # unrestricted so test builds can be cut off feature branches.
      - name: Require releases and release candidates to be on main
        if: ${{ !contains(github.ref_name, '-') || contains(github.ref_name, '-rc.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AHEAD_BY=$(gh api "repos/${{ github.repository }}/compare/main...${{ github.sha }}" --jq '.ahead_by')
          # String compare (not -ne): a non-numeric ahead_by like "null" would
          # coerce to 0 and pass. Fail closed on anything but "0".
          if [[ "$AHEAD_BY" != "0" ]]; then
            echo "::error::Versioned releases and -rc. tags must be cut from main. Tag '${{ github.ref_name }}' points to a commit not on main (compare ahead_by=${AHEAD_BY:-unknown}). For branch/test builds, use a different prerelease suffix (e.g. v1.2.3-<label>.1)."
            exit 1
          fi
          echo "Release/RC tag is on main — OK"

  build-artifacts:
    name: Build release artifacts
    needs: [validate-tag]
    uses: ./.github/workflows/proto-fleet-artifact-build.yml
    with:
      release_repository: ${{ github.repository }}
      version: ${{ github.ref_name }}
      retention_days: 1
      channel: release
      is_prerelease: ${{ contains(github.ref_name, '-') }}
    secrets: inherit

  publish-proto-fleet:
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download repository-specific installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-fleet-release-installers
          path: /tmp/release-assets/installers

      - name: Download deployment bundle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proto-fleet-deployment-bundle-*
          path: /tmp/release-assets/bundles
          merge-multiple: true

      - name: Download Windows installer artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-fleet-windows-installer
          path: /tmp/release-assets/windows

      - name: Download server artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proto-fleet-server-artifact-*
          path: /tmp/release-assets/server
          merge-multiple: true

      - name: Download Fleet Node artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fleetnode-linux-*
          path: /tmp/release-assets/fleetnode
          merge-multiple: true

      - name: Download client artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-fleet-client-artifact
          path: /tmp/release-assets/client

      - name: Download ProtoOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-os-artifact
          path: /tmp/release-assets/proto-os

      - name: List all release assets
        run: find /tmp/release-assets -type f | sort

      - name: Verify deployment bundle checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd /tmp/release-assets/bundles
          for arch in amd64 arm64; do
            bundle="proto-fleet-${VERSION}-${arch}.tar.gz"
            if [[ ! -f "$bundle" || ! -f "$bundle.sha256" ]]; then
              echo "::error::Missing deployment bundle or checksum for $arch"
              exit 1
            fi
            # Bind both the digest and filename; sha256sum -c trusts the
            # filename stored inside the sidecar.
            expected_sidecar="$RUNNER_TEMP/proto-fleet-${arch}.sha256"
            sha256sum "$bundle" > "$expected_sidecar"
            if ! cmp -s "$expected_sidecar" "$bundle.sha256"; then
              echo "::error::Deployment bundle checksum is not bound to $bundle"
              exit 1
            fi
          done

      - name: Verify Fleet Node checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd /tmp/release-assets/fleetnode
          for arch in amd64 arm64; do
            archive="fleetnode-${VERSION}-linux-${arch}.tar.gz"
            if [[ ! -f "$archive" || ! -f "$archive.sha256" ]]; then
              echo "::error::Missing Fleet Node archive or checksum for $arch"
              exit 1
            fi
            expected_sidecar="$RUNNER_TEMP/fleetnode-${arch}.sha256"
            sha256sum "$archive" > "$expected_sidecar"
            if ! cmp -s "$expected_sidecar" "$archive.sha256"; then
              echo "::error::Fleet Node checksum is not bound to $archive"
              exit 1
            fi
          done

      - name: Verify ProtoOS CT1 package
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          cd /tmp/release-assets/proto-os
          deb="proto-os_${VERSION}_all.deb"
          archive="proto-os-${VERSION}.tar.gz"
          if [[ ! -f "$deb" || ! -f "$deb.sha256" || ! -f "$archive" ]]; then
            echo "::error::Missing ProtoOS CT1 package, checksum, or archive"
            exit 1
          fi
          expected_sidecar="$RUNNER_TEMP/proto-os-deb.sha256"
          sha256sum "$deb" > "$expected_sidecar"
          if ! cmp -s "$expected_sidecar" "$deb.sha256"; then
            echo "::error::ProtoOS CT1 package checksum is not bound to $deb"
            exit 1
          fi
          python3 -I "$GITHUB_WORKSPACE/deployment-files/scripts/create-protoos-frigate-bundle.py" \
            --repository "$REPOSITORY" \
            --tag "$VERSION" \
            --commit "$COMMIT" \
            --archive "$archive" \
            --verify-deb "$deb"

      - name: Create or refresh draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          shopt -s failglob
          files=(
            /tmp/release-assets/bundles/proto-fleet-"$TAG_NAME"-*.tar.gz
            /tmp/release-assets/bundles/proto-fleet-"$TAG_NAME"-*.tar.gz.sha256
            /tmp/release-assets/windows/installer.exe
            /tmp/release-assets/windows/uninstall.exe
            /tmp/release-assets/server/proto-fleet-server-"$TAG_NAME"-*.tar.gz
            /tmp/release-assets/fleetnode/fleetnode-"$TAG_NAME"-linux-*.tar.gz
            /tmp/release-assets/fleetnode/fleetnode-"$TAG_NAME"-linux-*.tar.gz.sha256
            /tmp/release-assets/client/proto-fleet-client-"$TAG_NAME".tar.gz
            /tmp/release-assets/proto-os/proto-os-"$TAG_NAME".tar.gz
            /tmp/release-assets/proto-os/proto-os_"$TAG_NAME".ipk
            /tmp/release-assets/proto-os/proto-os_"$TAG_NAME"_all.deb
            /tmp/release-assets/proto-os/proto-os_"$TAG_NAME"_all.deb.sha256
            /tmp/release-assets/installers/install.sh
            /tmp/release-assets/installers/install-fleet-node.sh
            ./deployment-files/uninstall.sh
          )
          # Refuse to clobber a non-draft release — published assets are immutable from this workflow.
          existing_draft_state=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo "missing")
          case "$existing_draft_state" in
            true)
              echo "Draft release for $TAG_NAME exists; refreshing assets via upload --clobber."
              gh release upload "$TAG_NAME" --clobber "${files[@]}"
              ;;
            false)
              echo "::error::Release for $TAG_NAME is already published; refusing to overwrite. Delete it manually before re-running, or bump the tag."
              exit 1
              ;;
            *)
              echo "Creating new draft release for $TAG_NAME."
              extra_args=()
              if [[ "$IS_PRERELEASE" == 'true' ]]; then
                extra_args+=(--prerelease)
              fi
              gh release create "$TAG_NAME" \
                --draft \
                --generate-notes \
                "${extra_args[@]}" \
                "${files[@]}"
              ;;
          esac

  sign-protoos-release:
    name: Sign ProtoOS release statement
    # Frigate installs a proto-os package only when a statement describing it
    # verifies against a trusted ProtoOS release key, and Flotilla never offers
    # an unsigned release. This job signs the draft release's package before
    # the release is published, so a published release has its statement from
    # the start. Signing is optional until the key is provisioned: when the
    # repository variables below are unset the job warns, signs nothing, and
    # the release publishes unsigned (Frigate hosts keep their bundled ProtoOS).
    #
    # The `protoos-release-signing` environment is the OIDC boundary. Configure
    # it with required reviewers, and make the AWS role trust policy require
    # BOTH
    #   sub              = repo:btc-mining/proto-fleet-internal:environment:protoos-release-signing
    #   job_workflow_ref = btc-mining/proto-fleet-internal/.github/workflows/release.yml@refs/tags/v*
    # The KMS key must be ECC_NIST_P256 with SIGN_VERIFY usage, and must be a
    # different key from Frigate's release key: Frigate trusts the two in
    # separate key directories.
    #
    # Only commits on main are signed. Prerelease tags such as
    # vX.Y.Z-internal.N may be cut from any branch, and a tag runs its own copy
    # of this workflow and of the signing script, so the trust policy alone
    # cannot keep unreviewed branch code away from the key. The main check
    # below covers honest mistakes; the environment's required reviewers are
    # the boundary against a modified workflow. Branch builds publish
    # unsigned, so Flotilla never offers them to CT1 controllers.
    runs-on: ubuntu-latest
    needs: [publish-proto-fleet]
    environment: protoos-release-signing
    permissions:
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
      SIGNING_ROLE_ARN: ${{ vars.PROTOOS_RELEASE_SIGNING_ROLE_ARN }}
      KMS_KEY_ID: ${{ vars.PROTOOS_RELEASE_KMS_KEY_ID }}
      KMS_REGION: ${{ vars.PROTOOS_RELEASE_KMS_REGION }}
      # The sha256: key ID of the public key that Frigate ships. Signing with
      # any other KMS key fails the job.
      EXPECTED_KEY_ID: ${{ vars.PROTOOS_RELEASE_PUBLIC_KEY_ID }}
    steps:
      - name: Check signing configuration
        id: config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SIGNING_ROLE_ARN" ]] || missing+=(PROTOOS_RELEASE_SIGNING_ROLE_ARN)
          [[ -n "$KMS_KEY_ID" ]] || missing+=(PROTOOS_RELEASE_KMS_KEY_ID)
          [[ -n "$KMS_REGION" ]] || missing+=(PROTOOS_RELEASE_KMS_REGION)
          [[ -n "$EXPECTED_KEY_ID" ]] || missing+=(PROTOOS_RELEASE_PUBLIC_KEY_ID)
          # Skip only when no signing variable is set. A set key ID pin with
          # no other variable is a partial configuration, and it must fail.
          if (( ${#missing[@]} == 4 )); then
            echo "::warning::Skipping ProtoOS release signing; unset repository variables: ${missing[*]}. Flotilla will not offer this release to CT1 controllers."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::ProtoOS release signing is partly configured; unset repository variables: ${missing[*]}"
            exit 1
          fi
          # String compare: a non-numeric ahead_by such as "null" must not pass.
          ahead_by="$(gh api "repos/$GH_REPO/compare/main...$COMMIT" --jq '.ahead_by')"
          if [[ "$ahead_by" != "0" ]]; then
            echo "::warning::Skipping ProtoOS release signing; $TAG_NAME is not on main (ahead_by=${ahead_by:-unknown}). Flotilla will not offer this release to CT1 controllers."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # The publish job just uploaded the package with --clobber, so a
      # statement left on this draft by an earlier run may describe different
      # bytes. Delete them first, whether or not signing is enabled: a re-run
      # ends with either a fresh statement or none, never a mismatched one.
      - name: Remove stale statement assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Capture first: a failure inside a process substitution would not
          # stop the step, and the stale assets would survive.
          names="$(gh release view "$TAG_NAME" --json assets \
            --jq '.assets[].name | select(test("^proto-os_.*\\.deb\\.statement\\.(json|sig)$"))')"
          mapfile -t stale <<< "$names"
          for name in "${stale[@]}"; do
            [[ -n "$name" ]] || continue
            echo "Deleting stale asset $name"
            gh release delete-asset "$TAG_NAME" "$name" --yes
          done

      - name: Checkout code
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sign the package this run built, not bytes read back from the draft,
      # which anyone with write access could replace in the meantime.
      - name: Download ProtoOS artifacts
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-os-artifact
          path: ${{ runner.temp }}/protoos-signing

      - name: Configure AWS credentials
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.SIGNING_ROLE_ARN }}
          aws-region: ${{ env.KMS_REGION }}

      - name: Sign and verify the release statement
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/protoos-signing"
          args=(--dir "$dir" --tag "$TAG_NAME" --repository "$REPOSITORY"
            --commit "$COMMIT" --kms-key-id "$KMS_KEY_ID" --expected-key-id "$EXPECTED_KEY_ID")
          deployment-files/scripts/sign-protoos-release.sh "${args[@]}"
          # The draft must still carry exactly the package that was signed.
          mkdir -p "$RUNNER_TEMP/protoos-draft"
          gh release download "$TAG_NAME" --dir "$RUNNER_TEMP/protoos-draft" \
            --pattern "proto-os_${TAG_NAME}_all.deb"
          if ! cmp -s "$dir/proto-os_${TAG_NAME}_all.deb" "$RUNNER_TEMP/protoos-draft/proto-os_${TAG_NAME}_all.deb"; then
            echo "::error::The draft release package differs from the package this run built and signed"
            exit 1
          fi
          gh release upload "$TAG_NAME" --clobber \
            "$dir/proto-os_${TAG_NAME}_all.deb.statement.json" \
            "$dir/proto-os_${TAG_NAME}_all.deb.statement.sig"

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [publish-proto-fleet, sign-protoos-release]
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
