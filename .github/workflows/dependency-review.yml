name: Dependency Review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Skip on non-public repositories
        if: ${{ github.event.repository.private }}
        run: |
          echo "Dependency Review is only enforced for public repositories." >> "$GITHUB_STEP_SUMMARY"
          echo "This repository is currently internal/private, so the dependency review action is skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        if: ${{ !github.event.repository.private }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-scopes: runtime,unknown
          fail-on-severity: moderate
