name: Sign ProtoOS Release Statement

# release.yml calls this workflow after it uploads the draft release assets and
# before it publishes the release.
#
# Frigate installs a proto-os package only when a statement that describes the
# package verifies against a trusted ProtoOS release key, and Flotilla never
# offers an unsigned release. This workflow signs the package of the draft
# release, so a published release has its statement from the start. Signing is
# optional until the key is provisioned: when no signing variable is set, the
# workflow warns, signs nothing, and the release publishes unsigned (Frigate
# hosts keep their bundled ProtoOS).
#
# Trust boundary
#
# release.yml takes this file from main, not from the tag. A tag runs its own
# copy of release.yml, and a prerelease tag such as vX.Y.Z-internal.N can point
# to a commit on any branch. A branch can change its copy of release.yml, but
# it cannot change the jobs in this file. Make the AWS role trust policy
# require BOTH of these claims with StringEquals:
#   sub              = repo:btc-mining/proto-fleet-internal:environment:protoos-release-signing
#   job_workflow_ref = btc-mining/proto-fleet-internal/.github/workflows/sign-protoos-release.yml@refs/heads/main
# Then only the `sign` job of this file on main can use the key. A job in
# release.yml, or in a copy of this file on a tag or a branch, has a different
# job_workflow_ref, and AWS refuses it. Do not use a wildcard for the ref.
# GitHub takes `@main` from a tag named `main` before the branch, and the
# claim is then `@refs/tags/main`, which the exact value refuses.
#
# The caller is not trusted. This workflow has no inputs: it reads its
# configuration from repository variables, and it signs only a tag whose commit
# is on main. For a commit on main, the release.yml that built the package and
# the signing script that the `sign` job checks out are reviewed copies. A tag
# on a branch commit publishes unsigned, so Flotilla never offers it to CT1
# controllers.
#
# The `protoos-release-signing` environment is the second gate. Configure it
# with required reviewers and prevent self-review. Only the `sign` job uses the
# environment, so a release that signs nothing does not wait for approval.
#
# The KMS key must be ECC_NIST_P256 with SIGN_VERIFY usage, and must be a
# different key from Frigate's release key: Frigate trusts the two in separate
# key directories.

on:
  workflow_call:

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  TAG_NAME: ${{ github.ref_name }}
  SIGNING_ROLE_ARN: ${{ vars.PROTOOS_RELEASE_SIGNING_ROLE_ARN }}
  KMS_KEY_ID: ${{ vars.PROTOOS_RELEASE_KMS_KEY_ID }}
  KMS_REGION: ${{ vars.PROTOOS_RELEASE_KMS_REGION }}
  # The sha256: key ID of the public key that Frigate ships. Signing with any
  # other KMS key fails the job.
  EXPECTED_KEY_ID: ${{ vars.PROTOOS_RELEASE_PUBLIC_KEY_ID }}

jobs:
  prepare:
    name: Check signing configuration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: Check signing configuration
        id: config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SIGNING_ROLE_ARN" ]] || missing+=(PROTOOS_RELEASE_SIGNING_ROLE_ARN)
          [[ -n "$KMS_KEY_ID" ]] || missing+=(PROTOOS_RELEASE_KMS_KEY_ID)
          [[ -n "$KMS_REGION" ]] || missing+=(PROTOOS_RELEASE_KMS_REGION)
          [[ -n "$EXPECTED_KEY_ID" ]] || missing+=(PROTOOS_RELEASE_PUBLIC_KEY_ID)
          # Skip only when no signing variable is set. A set key ID pin with
          # no other variable is a partial configuration, and it must fail.
          if (( ${#missing[@]} == 4 )); then
            echo "::warning::Skipping ProtoOS release signing; unset repository variables: ${missing[*]}. Flotilla will not offer this release to CT1 controllers."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::ProtoOS release signing is partly configured; unset repository variables: ${missing[*]}"
            exit 1
          fi
          # String compare: a non-numeric ahead_by such as "null" must not pass.
          ahead_by="$(gh api "repos/$GH_REPO/compare/main...$COMMIT" --jq '.ahead_by')"
          if [[ "$ahead_by" != "0" ]]; then
            echo "::warning::Skipping ProtoOS release signing; $TAG_NAME is not on main (ahead_by=${ahead_by:-unknown}). Flotilla will not offer this release to CT1 controllers."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # The publish job just uploaded the package with --clobber, so a
      # statement left on this draft by an earlier run may describe different
      # bytes. Delete them first, whether or not signing is enabled: a re-run
      # ends with either a fresh statement or none, never a mismatched one.
      - name: Remove stale statement assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Capture first: a failure inside a process substitution would not
          # stop the step, and the stale assets would survive.
          names="$(gh release view "$TAG_NAME" --json assets \
            --jq '.assets[].name | select(test("^proto-os_.*\\.deb\\.statement\\.(json|sig)$"))')"
          mapfile -t stale <<< "$names"
          for name in "${stale[@]}"; do
            [[ -n "$name" ]] || continue
            echo "Deleting stale asset $name"
            gh release delete-asset "$TAG_NAME" "$name" --yes
          done

  sign:
    name: Sign the release statement
    needs: [prepare]
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: protoos-release-signing
    permissions:
      contents: write
      id-token: write
    steps:
      # This is the tag commit of the caller, not main. The prepare job made
      # sure that the commit is on main, so the signing script is a reviewed
      # copy that agrees with the package of the same commit.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sign the package this run built, not bytes read back from the draft,
      # which anyone with write access could replace in the meantime.
      - name: Download ProtoOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-os-artifact
          path: ${{ runner.temp }}/protoos-signing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.SIGNING_ROLE_ARN }}
          aws-region: ${{ env.KMS_REGION }}

      - name: Sign and verify the release statement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/protoos-signing"
          args=(--dir "$dir" --tag "$TAG_NAME" --repository "$REPOSITORY"
            --commit "$COMMIT" --kms-key-id "$KMS_KEY_ID" --expected-key-id "$EXPECTED_KEY_ID")
          deployment-files/scripts/sign-protoos-release.sh "${args[@]}"
          # The draft must still carry exactly the package that was signed.
          mkdir -p "$RUNNER_TEMP/protoos-draft"
          gh release download "$TAG_NAME" --dir "$RUNNER_TEMP/protoos-draft" \
            --pattern "proto-os_${TAG_NAME}_all.deb"
          if ! cmp -s "$dir/proto-os_${TAG_NAME}_all.deb" "$RUNNER_TEMP/protoos-draft/proto-os_${TAG_NAME}_all.deb"; then
            echo "::error::The draft release package differs from the package this run built and signed"
            exit 1
          fi
          gh release upload "$TAG_NAME" --clobber \
            "$dir/proto-os_${TAG_NAME}_all.deb.statement.json" \
            "$dir/proto-os_${TAG_NAME}_all.deb.statement.sig"
