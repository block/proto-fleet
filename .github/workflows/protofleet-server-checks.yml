name: Server Checks

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/protofleet-server-checks.yml"
      - ".github/actions/go-cache-setup/action.yml"
      - ".github/actions/hermit-setup/action.yml"
      - "bin/hermit.hcl"
      - "hermit-packages/**"
      - "go.work"
      - "go.work.sum"
      - "proto/**"
      - "server/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Lint and test shards run independently on separate runners.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hermit
        uses: ./.github/actions/hermit-setup

      - name: Configure Go cache
        uses: ./.github/actions/go-cache-setup

      - name: Check formatting
        run: golangci-lint fmt --diff -c .golangci.yaml

      - name: Lint
        run: just lint

  # fake-ct1 is a standalone Go module (its own go.mod, not in go.work) like
  # server/fake-proto-rig, so `just build`/`just test` above never compile it.
  # Build, vet, and test it directly with GOWORK=off in its own lightweight job.
  fake-ct1:
    name: Fake CT1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/fake-ct1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hermit
        uses: ./.github/actions/hermit-setup

      - name: Configure Go cache
        uses: ./.github/actions/go-cache-setup

      - name: Build
        run: GOWORK=off go build ./...

      - name: Vet
        run: GOWORK=off go vet ./...

      - name: Test
        run: GOWORK=off go test ./...

  test-shards:
    name: Test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [accounts, storage, domain-control, domain, other]
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Match the E2E runner cleanup: this Go/Docker job uses Hermit, not
      # the hosted mobile/.NET/Haskell SDKs. Keep room for Postgres and Go.
      - name: Free disk space for server tests
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Setup Hermit
        uses: ./.github/actions/hermit-setup

      - name: Configure Go cache
        uses: ./.github/actions/go-cache-setup
        with:
          build-cache-scope: server-test-${{ matrix.shard }}
          build-cache-restore-scope: ${{ startsWith(matrix.shard, 'domain') && 'server-test-domain' || 'workspace' }}
          # Cache entries are immutable. Save each revision so source-only
          # changes do not repeatedly compile against an old dependency cache.
          build-cache-revision: -${{ github.sha }}

      - name: Select test packages
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            accounts) go list ./internal/domain/hostedaccounts/... ;;
            storage) go list ./internal/domain/stores/... ./internal/infrastructure/timescaledb/... ;;
            domain-control) go list ./internal/domain/{command,devicewrite,miner,mininggroups,rollout}/... ;;
            domain) go list ./internal/domain/... | grep -Ev '/internal/domain/(command|devicewrite|hostedaccounts|miner|mininggroups|rollout|stores)(/|$)' ;;
            other) go list ./... | grep -Ev '/internal/(domain|infrastructure/timescaledb)(/|$)' ;;
          esac > "$RUNNER_TEMP/server-test-packages.txt"
          test -s "$RUNNER_TEMP/server-test-packages.txt"
          cat "$RUNNER_TEMP/server-test-packages.txt"

      # The timescaledb service is built from server/timescaledb/ and has no
      # `image:`, so a cold runner rebuilds it on every `just db-up` (~30s of
      # the step). Cache the built image (same approach as the E2E build job)
      # and load it first so `docker compose up` finds it and skips the build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Rotate the cache weekly (ISO year-week) so a cache hit still rebuilds
      # against fresh upstream base images and packages (ubuntu, PostgreSQL,
      # TimescaleDB, pgvector) within a week, not only when a file under
      # server/timescaledb/ changes.
      - name: Compute image cache week
        id: cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore TimescaleDB image cache
        id: tsdb-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images
          key: ${{ runner.os }}-server-timescaledb-${{ steps.cache-week.outputs.week }}-${{ hashFiles('server/timescaledb/**') }}

      - name: Build TimescaleDB image
        if: steps.tsdb-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          # `--pull` refreshes the upstream base images on a rebuild.
          docker compose build --pull timescaledb
          image="$(docker compose config --images timescaledb)"
          docker save "$image" | gzip > /tmp/docker-images/timescaledb.tar.gz

      - name: Save TimescaleDB image cache
        if: steps.tsdb-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images
          key: ${{ runner.os }}-server-timescaledb-${{ steps.cache-week.outputs.week }}-${{ hashFiles('server/timescaledb/**') }}

      - name: Load TimescaleDB image
        if: steps.tsdb-image-cache.outputs.cache-hit == 'true'
        run: gunzip < /tmp/docker-images/timescaledb.tar.gz | docker load

      # The archive has already been cached and loaded into Docker on both
      # cache-hit and build paths; tests need the image, not a second copy.
      - name: Remove saved TimescaleDB image archive
        run: rm -f /tmp/docker-images/timescaledb.tar.gz

      - name: Start database
        run: just db-up

      # Each shard owns its runner and PostgreSQL instance. Within a shard,
      # preserve the package isolation required by dispatch deadline tests.
      - name: Test
        shell: bash
        run: |
          DB_PASSWORD="${DB_PASSWORD:-fleet}" xargs go test -json -count=1 -p=1 \
            < "$RUNNER_TEMP/server-test-packages.txt" | tee "$RUNNER_TEMP/server-test-results.jsonl" | \
            python3 -u -c '
          import json
          import sys

          for line in sys.stdin:
              event = json.loads(line)
              action = event["Action"]
              package = event.get("Package", event.get("ImportPath", ""))
              if "Test" not in event and action in {"start", "pass", "skip", "fail"}:
                  print(event["Time"], action.upper(), package, "elapsed=", event.get("Elapsed", 0), "s")
              elif action in {"fail", "build-fail", "build-output"}:
                  print(action.upper(), package, event.get("Output", event.get("Test", "")))
          '

      - name: Summarize test timings
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          results = Path(os.environ["RUNNER_TEMP"]) / "server-test-results.jsonl"
          if not results.exists():
              raise SystemExit(0)
          events = [json.loads(line) for line in results.read_text().splitlines()]
          failed = {e.get("Package", e.get("ImportPath")) for e in events if e["Action"] in {"fail", "build-fail"}}
          for event in events:
              if event.get("Package", event.get("ImportPath")) in failed and "Output" in event:
                  print(event["Output"], end="")
          tests = sorted(
              (e for e in events if e["Action"] in {"pass", "fail"} and "Test" in e and "/" not in e["Test"]),
              key=lambda e: e.get("Elapsed", 0), reverse=True,
          )
          lines = [f"### Server tests: {os.environ['SHARD']}", "", "| Slowest tests | Seconds |", "| --- | ---: |"]
          lines += [f"| {e['Test']} | {e.get('Elapsed', 0):.2f} |" for e in tests[:20]]
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PY

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/server-test-results.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Show database diagnostics
        if: failure()
        run: |
          df -h /
          docker system df || true
          du -sh ~/.cache/go-build ~/go/pkg/mod /tmp/docker-images || true
          docker compose logs --no-color timescaledb || true
          docker compose exec -T timescaledb postgres --version || true
          docker compose exec -T timescaledb dpkg-query -W 'timescaledb-*' || true

  # Preserve the existing check name for branch rules and other consumers.
  test:
    name: Test
    runs-on: ubuntu-latest
    if: always()
    needs: test-shards
    steps:
      - name: Check all test shards
        env:
          RESULT: ${{ needs.test-shards.result }}
        run: test "$RESULT" = success
