name: Migration Hygiene

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  migration-hygiene:
    name: Migration Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge result
        if: ${{ github.event.pull_request != null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Checkout current ref
        if: ${{ github.event.pull_request == null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test migration policy checker
        run: python3 scripts/check-migration-history_test.py

      - name: Check immutable history and shared promotion
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          args=(--base-ref "origin/${BASE_REF}")
          if [[ "$GITHUB_REPOSITORY" == "btc-mining/proto-fleet-internal" ]]; then
            git fetch --no-tags https://github.com/block/proto-fleet.git refs/heads/main
            public_commit="$(git rev-parse FETCH_HEAD)"
            echo "Checking shared promotion against public commit ${public_commit}"
            args+=(--public-ref "$public_commit")
          else
            # Public CI reads only its own history and needs no private credentials.
            args+=(--public-only)
          fi
          python3 scripts/check-migration-history.py "${args[@]}"
