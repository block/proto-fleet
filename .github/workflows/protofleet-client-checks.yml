name: ProtoFleet Client Checks

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/protofleet-client-checks.yml"
      - ".github/actions/hermit-setup/action.yml"
      - "bin/hermit.hcl"
      - "hermit-packages/**"
      - "client/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Fast checks (lint, format, typecheck) run in a single job to reduce overhead
  quality:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hermit
        uses: ./.github/actions/hermit-setup

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # The runner executes the test files one at a time, so one job takes more
  # than 20 minutes. Each shard runs a quarter of the files on its own runner.
  test-shards:
    name: Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hermit
        uses: ./.github/actions/hermit-setup

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: npm test -- --run --reporter=verbose --shard="${SHARD}/4"

  # Preserve the existing check name for branch rules and other consumers.
  test:
    name: Test
    runs-on: ubuntu-latest
    if: always()
    needs: test-shards
    steps:
      - name: Check all test shards
        env:
          RESULT: ${{ needs.test-shards.result }}
        run: test "$RESULT" = success

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hermit
        uses: ./.github/actions/hermit-setup

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build ProtoOS
        run: npm run build:protoOS

      - name: Build ProtoFleet
        run: npm run build:protoFleet
