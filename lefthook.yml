# Lefthook git hooks — https://github.com/evilmartians/lefthook
# Install: just install-hooks
# Personal overrides: lefthook-local.yml

# Use doublestar so ** matches zero-or-more directories (gobwas requires one-or-more).
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    # `git commit` and `git merge` fire pre-commit. `git cherry-pick` and
    # `git revert` do not — they're covered by `prepare-commit-msg` below.
    block-protected-branches:
      run: scripts/lefthook-block-protected-branches.sh

    client-format:
      glob: "client/**/*.{ts,tsx,js,jsx,css,md}"
      stage_fixed: true
      run: scripts/lefthook-client-format.sh {staged_files}

    server-goimports:
      glob: "server/**/*.go"
      stage_fixed: true
      run: scripts/lefthook-goimports.sh {staged_files}

    plugin-goimports:
      glob: "plugin/**/*.go"
      stage_fixed: true
      run: scripts/lefthook-goimports.sh {staged_files}

    proto-buf-lint:
      glob: "{buf.yaml,buf.lock,proto/**/*.proto}"
      # Buf can lint specific paths, but this wrapper runs against the index snapshot
      # so unstaged proto edits do not make staged partial commits fail.
      run: scripts/lefthook-proto-buf-lint.sh {staged_files}

    python-ruff:
      glob: "**/*.py"
      stage_fixed: true
      run: scripts/lefthook-python-ruff.sh {staged_files}

prepare-commit-msg:
  commands:
    # Catches `git cherry-pick` and `git revert`, which create commits
    # without invoking `pre-commit`. Same script as the pre-commit guard.
    block-protected-branches:
      run: scripts/lefthook-block-protected-branches.sh

changed-checks:
  parallel: true
  files: |
    set -e
    base="${CHECK_CHANGED_BASE:-origin/main}"
    merge_base="$(git merge-base "$base" HEAD)"
    changed_paths() {
      git diff --no-renames --name-status "$@" |
        awk -F '\t' '
          $1 == "D" { deleted = 1 }
          { print substr($0, index($0, "\t") + 1) }
          END { if (deleted) print "justfile" }
        '
    }
    {
      changed_paths "$merge_base"...HEAD
      changed_paths
      changed_paths --cached
      git ls-files --others --exclude-standard
    } | sort -u
  commands:
    diff-whitespace:
      run: |
        set -e
        base="${CHECK_CHANGED_BASE:-origin/main}"
        merge_base="$(git merge-base "$base" HEAD)"
        git diff --check "$merge_base"...HEAD
        git diff --check
        git diff --cached --check

    protobuf-lint:
      glob:
        - ".github/actions/**"
        - ".github/workflows/**"
        - ".github/*.{yml,yaml}"
        - ".github/skills/**"
        - "bin/**"
        - "hermit-packages/**"
        - "just/**"
        - "justfile"
        - "scripts/**"
        - "deployment-files/docker-compose*.{yml,yaml}"
        - "deployment-files/*.sh"
        - "deployment-files/scripts/**"
        - "proto/**/*.proto"
        - "buf.yaml"
        - "buf.lock"
        - "buf.gen.yaml"
      run: just _lint-protos

    client-check:
      glob:
        - ".github/actions/**"
        - ".github/workflows/**"
        - ".github/*.{yml,yaml}"
        - ".github/skills/**"
        - "bin/**"
        - "hermit-packages/**"
        - "just/**"
        - "justfile"
        - "scripts/**"
        - "deployment-files/docker-compose*.{yml,yaml}"
        - "deployment-files/*.sh"
        - "deployment-files/scripts/**"
        - "client/**"
      run: just _check-client

    server-lint:
      glob:
        - ".github/actions/**"
        - ".github/workflows/**"
        - ".github/*.{yml,yaml}"
        - ".github/skills/**"
        - "bin/**"
        - "hermit-packages/**"
        - "just/**"
        - "justfile"
        - "scripts/**"
        - "deployment-files/docker-compose*.{yml,yaml}"
        - "deployment-files/*.sh"
        - "deployment-files/scripts/**"
        - "server/**"
        - "go.work"
        - "go.work.sum"
      run: just _lint-server

    plugin-proto-lint:
      glob:
        - ".github/actions/**"
        - ".github/workflows/**"
        - ".github/*.{yml,yaml}"
        - ".github/skills/**"
        - "bin/**"
        - "hermit-packages/**"
        - "just/**"
        - "justfile"
        - "scripts/**"
        - "deployment-files/docker-compose*.{yml,yaml}"
        - "deployment-files/*.sh"
        - "deployment-files/scripts/**"
        - "plugin/proto/**"
        - "server/go.mod"
        - "server/go.sum"
        - "server/sdk/**"
        - "go.work"
        - "go.work.sum"
      run: cd plugin/proto && golangci-lint run -c .golangci.yaml

    plugin-antminer-lint:
      glob:
        - ".github/actions/**"
        - ".github/workflows/**"
        - ".github/*.{yml,yaml}"
        - ".github/skills/**"
        - "bin/**"
        - "hermit-packages/**"
        - "just/**"
        - "justfile"
        - "scripts/**"
        - "deployment-files/docker-compose*.{yml,yaml}"
        - "deployment-files/*.sh"
        - "deployment-files/scripts/**"
        - "plugin/antminer/**"
        - "server/go.mod"
        - "server/go.sum"
        - "server/sdk/**"
        - "go.work"
        - "go.work.sum"
      run: cd plugin/antminer && golangci-lint run -c .golangci.yaml

    developer-workflow-tests:
      glob:
        - ".agents/**"
        - ".claude/**"
        - ".github/actions/hermit-setup/**"
        - ".github/path-filters.yml"
        - ".github/review-policy.json"
        - ".github/workflows/pr-gate.yml"
        - "**/AGENTS.md"
        - "CLAUDE.md"
        - "CONTRIBUTING.md"
        - "go.work"
        - "justfile"
        - "lefthook.yml"
        - "scripts/check-changed.sh"
        - "scripts/check-changed_test.sh"
      run: just test-developer-workflows

    plan-hygiene:
      glob:
        - "docs/plans/**"
        - "scripts/plan_index.py"
        - "scripts/plan_index_test.py"
        - ".agents/skills/plan/**"
        - ".agents/skills/plan-conventions/**"
        - "AGENTS.md"
        - "justfile"
      run: just check-plan-hygiene

pre-push:
  commands:
    changed-path-checks:
      run: just check-changed
