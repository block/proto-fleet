# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # SSL certificate configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL settings for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS - instruct browsers to always use HTTPS (1 hour for LAN/self-signed deployments)
    add_header Strict-Transport-Security "max-age=3600" always;

    # Runtime client config, regenerated from env at container start. Never cache
    # so operator changes take effect on restart.
    location = /config.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # React app root
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ControlStream is the only Fleet Node RPC that uses native gRPC. Strip the
    # public /api-proxy prefix and keep this long-lived HTTP/2 stream pinned to
    # the selected upstream; the node reconnect loop handles failures.
    location = /api-proxy/fleetnodegateway.v1.FleetNodeGatewayService/ControlStream {
        rewrite ^/api-proxy/(.*)$ /$1 break;
        client_body_timeout 24h;
        client_max_body_size 0;
        grpc_pass grpc://localhost:4000;
        grpc_set_header Host $host;
        grpc_read_timeout 24h;
        grpc_send_timeout 24h;
        grpc_next_upstream off;
    }

    # Pair is a unary RPC that can wait for multiple fleet-node batches before
    # sending response bytes. Keep the extended timeout scoped to this RPC so
    # idle server-streaming calls under /api-proxy/ keep the default proxy budget.
    location = /api-proxy/pairing.v1.PairingService/Pair {
        proxy_pass http://localhost:4000/pairing.v1.PairingService/Pair;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 75m;
        proxy_send_timeout 75m;
        client_max_body_size 64m;
    }

    # HA diagnostics are intentionally available only on the Fleet host.
    location ^~ /api-proxy/health/ha {
        return 404;
    }

    # For WebSocket/stream support
    location /api-proxy/ {
        proxy_pass http://localhost:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 64m;
    }
}
