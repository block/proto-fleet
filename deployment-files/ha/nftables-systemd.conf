[Service]
# The distro nftables unit can replace the ruleset on start or reload. Restore
# only Fleet's table afterward, leaving all other nftables configuration alone.
ExecStartPost=-/usr/sbin/nft delete table inet proto_fleet_ha
ExecStartPost=/bin/sh -c '/usr/sbin/nft -f /etc/proto-fleet/ha/firewall.nft || { /usr/bin/systemctl --no-block stop docker.service; exit 1; }'
ExecReload=-/usr/sbin/nft delete table inet proto_fleet_ha
ExecReload=/bin/sh -c '/usr/sbin/nft -f /etc/proto-fleet/ha/firewall.nft || { /usr/bin/systemctl --no-block stop docker.service; exit 1; }'
