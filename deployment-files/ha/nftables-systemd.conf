[Service]
# The distro nftables unit can replace the ruleset on start or reload. Restore
# only Fleet's table afterward, leaving all other nftables configuration alone.
ExecStartPost=/bin/sh -c 'if /usr/sbin/nft -c -f /etc/proto-fleet/ha/firewall.nft; then /usr/sbin/nft delete table inet proto_fleet_ha 2>/dev/null || true; /usr/sbin/nft -f /etc/proto-fleet/ha/firewall.nft && exit 0; fi; /usr/bin/systemctl stop docker.service; exit 1'
ExecReload=/bin/sh -c 'if /usr/sbin/nft -c -f /etc/proto-fleet/ha/firewall.nft; then /usr/sbin/nft delete table inet proto_fleet_ha 2>/dev/null || true; /usr/sbin/nft -f /etc/proto-fleet/ha/firewall.nft && exit 0; fi; /usr/bin/systemctl stop docker.service; exit 1'
