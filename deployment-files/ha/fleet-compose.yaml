services:
  fleet-api:
    # Restart process failures, but let systemd reapply the HA start gate after Docker restarts.
    restart: on-failure
    # HA manages the shared VIP on the host; Fleet only needs raw sockets for nmap discovery.
    cap_add: !override
      - NET_RAW
    # Patroni provides PostgreSQL in HA deployments, so remove the base dependency.
    depends_on: !reset []
    # The 15s delay exceeds the 10s lease, giving the passive peer first chance after a restart.
    command: ["/bin/sh", "-c", "sleep 15; exec /app/fleetd"]
    environment:
      # External traffic reaches Fleet through local nginx and the shared VIP.
      HTTP_LISTEN_ADDRESS: "127.0.0.1:4000"
      # HA does not support the update checker or its UI; do not interpolate a parent value.
      UPDATES_ENABLED: "false"
      FLEET_HA_ENABLED: "true"
      FLEET_HA_ETCD_ENDPOINTS: "https://${HA_DB_A_IP}:2379,https://${HA_DB_B_IP}:2379,https://${HA_DCS_C_IP}:2379"
      FLEET_HA_ENDPOINT_IP: "${HA_VIRTUAL_IP}"
      FLEET_HA_ENDPOINT_INTERFACE: "${HA_NETWORK_INTERFACE}"
      FLEET_PUBLIC_URL: "https://${HA_VIRTUAL_IP}"
    volumes:
      - "${HA_SECRETS_DIR}/service-ca.crt:/etc/proto-fleet/ha/service-ca.crt:ro"
      - "${HA_SECRETS_DIR}/fleet-etcd-password:/etc/proto-fleet/ha/fleet-etcd-password:ro"
      - "${HA_SECRETS_DIR}/node.env:/etc/proto-fleet/ha/node.env:ro"
      - "/run/proto-fleet-ha:/run/proto-fleet-ha:ro"
  fleet-client:
    restart: on-failure
    # Replace the base TLS mount with this host's certificate for the shared VIP.
    volumes: !override
      - "${HA_SECRETS_DIR}/fleet-client.crt:/etc/nginx/ssl/cert.pem:ro"
      - "${HA_SECRETS_DIR}/fleet-client.key:/etc/nginx/ssl/key.pem:ro"
      - "${HA_SECRETS_DIR}/service-ca.crt:/usr/share/nginx/html/proto-fleet-ha-service-ca.crt:ro"
