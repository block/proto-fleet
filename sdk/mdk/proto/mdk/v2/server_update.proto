syntax = "proto3";

package mdk.v2;

import "google/protobuf/timestamp.proto";
import "mdk/v2/options.proto";

option go_package = "github.com/btc-mining/frigate/gen/mdk/v2;mdkv2";

// ServerUpdateService stages one verified Proto container firmware package on an exact host and,
// for self-coordinated updates, starts and tracks one site-wide rollout.
//
// The staging methods and GetServerUpdateSupport are instance-scoped: they are
// the only ServerUpdateService methods that may be dispatched to a specific
// instance over a warm-standby tunnel.
//
// StartServerUpdate is routed ControlLeader: it executes on the HA primary, and
// a standby's MDK peer router forwards it there. It is never executed on, or
// dispatched over a tunnel to, a warm standby. GetServerUpdateStatus,
// RetryServerUpdate and CancelServerUpdate operate on shared rollout state
// (routed SharedState) and are not instance-scoped. None of the four new
// methods is on the Flotilla tunnel registry yet, so no Flotilla destination can
// call them; MDK clients call the Proto container firmware API directly.
//
// StartServerUpdate, GetServerUpdateStatus, RetryServerUpdate and
// CancelServerUpdate are a published contract only: current servers return
// UNIMPLEMENTED for them, and GetServerUpdateSupportResponse
// .self_coordination_supported reports false until a server implements them.
service ServerUpdateService {
  rpc GetServerUpdateSupport(GetServerUpdateSupportRequest) returns (GetServerUpdateSupportResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_READ;
  }

  rpc StageServerUpdate(stream StageServerUpdateRequest) returns (StageServerUpdateResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_MUTATE;
  }

  // The additive unary staging surface is instance-scoped over the tunnel and
  // lets Flotilla resume an acknowledged partial package after reconnecting.
  rpc BeginServerUpdateStage(BeginServerUpdateStageRequest) returns (BeginServerUpdateStageResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_MUTATE;
  }
  rpc AppendServerUpdateStage(AppendServerUpdateStageRequest) returns (AppendServerUpdateStageResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_MUTATE;
  }
  rpc CommitServerUpdateStage(CommitServerUpdateStageRequest) returns (CommitServerUpdateStageResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_MUTATE;
  }
  rpc AbortServerUpdateStage(AbortServerUpdateStageRequest) returns (AbortServerUpdateStageResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_MUTATE;
  }

  // StartServerUpdate begins a self-coordinated rollout of a package that is
  // already staged on every expected instance. The caller must have staged each
  // instance with a manifest whose coordination is SERVER_UPDATE_COORDINATION_SELF
  // and that carries the signed release statement. The rollout id is job_id.
  // Routed to the HA primary (ControlLeader). Refusals carry a
  // google.rpc.ErrorInfo in domain mdk.v2.frigate with one of the UPDATE_*
  // reasons documented on ServerUpdateRollout.error_code.
  rpc StartServerUpdate(StartServerUpdateRequest) returns (StartServerUpdateResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_MUTATE;
  }

  // GetServerUpdateStatus returns the shared rollout state. While Proto container firmware is
  // stopped for an update the response may be served by the maintenance
  // service, which sets served_by_maintenance.
  rpc GetServerUpdateStatus(GetServerUpdateStatusRequest) returns (GetServerUpdateStatusResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_READ;
  }

  // RetryServerUpdate asks the rollout driver to resume a rollout that failed
  // after the instances were stopped. It is refused unless the rollout is
  // retryable.
  rpc RetryServerUpdate(RetryServerUpdateRequest) returns (RetryServerUpdateResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_MUTATE;
  }

  // CancelServerUpdate abandons a rollout that has not yet stopped any
  // instance. It is refused once the rollout is past the point of no return;
  // use RetryServerUpdate or the on-host abandon command instead.
  rpc CancelServerUpdate(CancelServerUpdateRequest) returns (CancelServerUpdateResponse) {
    option (mdk.v2.product) = PRODUCT_CT1;
    option (mdk.v2.tunnel_access) = TUNNEL_ACCESS_MUTATE;
  }
}

// FrigateUpdateMaintenanceService keeps a package installer reachable while
// the main Proto container firmware process and its regular tunnel are stopped.
service FrigateUpdateMaintenanceService {
  // Preserve the established maintenance transport message names.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Exchange(FrigateUpdateAgentStatus) returns (FrigateUpdateAgentCommand);
}

enum ServerInstallationType {
  SERVER_INSTALLATION_TYPE_UNSPECIFIED = 0;
  SERVER_INSTALLATION_TYPE_DEBIAN_PACKAGE = 1;
  SERVER_INSTALLATION_TYPE_DIRECT_BINARY = 2;
}

enum FrigateUpdateAgentPhase {
  FRIGATE_UPDATE_AGENT_PHASE_UNSPECIFIED = 0;
  FRIGATE_UPDATE_AGENT_PHASE_CONNECTING = 1;
  FRIGATE_UPDATE_AGENT_PHASE_STAGED = 2;
  FRIGATE_UPDATE_AGENT_PHASE_STOPPED = 3;
  FRIGATE_UPDATE_AGENT_PHASE_INSTALLED = 4;
  FRIGATE_UPDATE_AGENT_PHASE_MIGRATED = 5;
  FRIGATE_UPDATE_AGENT_PHASE_STARTED = 6;
  FRIGATE_UPDATE_AGENT_PHASE_FAILED = 7;
}

enum FrigateUpdateAgentAction {
  FRIGATE_UPDATE_AGENT_ACTION_UNSPECIFIED = 0;
  FRIGATE_UPDATE_AGENT_ACTION_WAIT = 1;
  FRIGATE_UPDATE_AGENT_ACTION_STOP = 2;
  FRIGATE_UPDATE_AGENT_ACTION_INSTALL = 3;
  FRIGATE_UPDATE_AGENT_ACTION_MIGRATE = 4;
  FRIGATE_UPDATE_AGENT_ACTION_START = 5;
  FRIGATE_UPDATE_AGENT_ACTION_EXIT = 6;
}

// ServerUpdateCoordination selects who coordinates the stop, install, migrate
// and start barriers between the HA instances.
enum ServerUpdateCoordination {
  // The legacy path: each instance's root helper dials the Flotilla
  // FrigateUpdateMaintenanceService.Exchange endpoint named in the manifest.
  SERVER_UPDATE_COORDINATION_UNSPECIFIED = 0;
  // The root helpers coordinate through the shared etcd cluster. The manifest
  // must carry a signed release statement and no Flotilla connection fields.
  SERVER_UPDATE_COORDINATION_SELF = 1;
}

// ServerUpdateRolloutPhase is the site-wide phase of a self-coordinated rollout.
enum ServerUpdateRolloutPhase {
  SERVER_UPDATE_ROLLOUT_PHASE_UNSPECIFIED = 0;
  // The rollout record is written and the helpers are verifying the signed
  // release statement and package, then reporting STAGED.
  SERVER_UPDATE_ROLLOUT_PHASE_VERIFYING = 1;
  SERVER_UPDATE_ROLLOUT_PHASE_STOPPING = 2;
  SERVER_UPDATE_ROLLOUT_PHASE_INSTALLING = 3;
  SERVER_UPDATE_ROLLOUT_PHASE_MIGRATING = 4;
  SERVER_UPDATE_ROLLOUT_PHASE_STARTING = 5;
  SERVER_UPDATE_ROLLOUT_PHASE_SUCCEEDED = 6;
  // A failure after the instances were stopped. Both stay stopped; see
  // ServerUpdateRollout.retryable.
  SERVER_UPDATE_ROLLOUT_PHASE_FAILED = 7;
  // The rollout exited before any instance was stopped: cancelled by a caller,
  // rejected during pre-stop verification, or expired.
  SERVER_UPDATE_ROLLOUT_PHASE_CANCELLED = 8;
  // A stage_only rollout completed verification on every instance. Nothing was
  // stopped.
  SERVER_UPDATE_ROLLOUT_PHASE_VERIFIED = 9;
  // An operator ran the on-host abandon command. The rollout is terminal, but
  // if ServerUpdateRollout.disruption_started is true Proto container firmware may still be held
  // stopped on one or both instances until the operator restores service.
  SERVER_UPDATE_ROLLOUT_PHASE_ABANDONED = 10;
}

message GetServerUpdateSupportRequest {}

message GetServerUpdateSupportResponse {
  string instance_id = 1;
  string peer_instance_id = 2;
  string running_version = 3;
  string architecture = 4;
  ServerInstallationType installation_type = 5;
  bool helper_available = 6;
  string support_message = 7;
  // cluster_id identifies the HA cluster whose etcd holds rollout state.
  string cluster_id = 8;
  // active_job_id is the job id of the rollout currently in progress, if any.
  string active_job_id = 9;
  // spool_free_bytes is the free space available for staging a package.
  int64 spool_free_bytes = 10;
  uint32 etcd_members_total = 11;
  uint32 etcd_members_healthy = 12;
  // trusted_release_key_ids lists the release-signing keys this instance
  // trusts, each as "sha256:" followed by the lowercase hex SHA-256 of the
  // DER SubjectPublicKeyInfo.
  repeated string trusted_release_key_ids = 13;
  // self_coordination_supported is true only when this server implements
  // SERVER_UPDATE_COORDINATION_SELF end to end. Callers must not stage a SELF
  // manifest or call StartServerUpdate unless it is true.
  bool self_coordination_supported = 14;
  // remote_trigger_allowed reports whether the site allows StartServerUpdate
  // (the update.allow_remote_trigger setting).
  bool remote_trigger_allowed = 15;
  // proto_os_package_supported is true only when the root update helper can
  // install a static proto-os package without stopping Proto container firmware. Callers must
  // not stage a SERVER_UPDATE_PACKAGE_PROTO_OS manifest unless it is true.
  bool proto_os_package_supported = 16;
  // proto_os_installed_version is the dpkg version of the installed proto-os
  // package. It is empty when the package is not installed.
  string proto_os_installed_version = 17;
  // proto_os_served describes the ProtoOS bundle this instance serves now.
  ProtoOSBundleStatus proto_os_served = 18;
  // proto_os_job is the most recent proto-os package job on this instance.
  ProtoOSPackageJob proto_os_job = 19;
  // proto_os_support_message explains why proto_os_package_supported is
  // false, for example a disabled browser UI. It is empty when supported.
  string proto_os_support_message = 20;
  // proto_os_signed_packages is true when this instance requires every
  // SERVER_UPDATE_PACKAGE_PROTO_OS manifest to carry a release_statement and
  // release_signature, and its root helper verifies them against the
  // separately shipped ProtoOS release keys before dpkg runs. Callers must not
  // stage a PROTO_OS manifest on an instance that reports false: older
  // instances install unsigned packages.
  bool proto_os_signed_packages = 21;
  // proto_os_release_repositories lists the GitHub repositories whose signed
  // proto-os release statements this instance accepts. Callers must not stage
  // a PROTO_OS manifest whose statement names a repository missing here. An
  // instance that omits the field accepts only btc-mining/proto-fleet-internal.
  repeated string proto_os_release_repositories = 22;
}

// ServerUpdatePackage selects the Debian package that a staged manifest
// installs.
enum ServerUpdatePackage {
  // UNSPECIFIED is the frigate package. Legacy manifests use it.
  SERVER_UPDATE_PACKAGE_UNSPECIFIED = 0;
  // PROTO_OS is the arch-independent, static proto-os web UI package. The root
  // helper installs it on one instance without stopping Proto container firmware or holding
  // HA peers at barriers.
  SERVER_UPDATE_PACKAGE_PROTO_OS = 1;
}

// ProtoOSBundleSource identifies where the served ProtoOS bundle comes from.
enum ProtoOSBundleSource {
  PROTO_OS_BUNDLE_SOURCE_UNSPECIFIED = 0;
  // NONE means no valid bundle is served; the API runs headless.
  PROTO_OS_BUNDLE_SOURCE_NONE = 1;
  // PACKAGE is the separately installed proto-os package under web_root.
  PROTO_OS_BUNDLE_SOURCE_PACKAGE = 2;
  // BUNDLED is the fallback copy embedded in the frigate package.
  PROTO_OS_BUNDLE_SOURCE_BUNDLED = 3;
}

message ProtoOSBundleStatus {
  ProtoOSBundleSource source = 1;
  // release_tag is the ProtoOS release tag recorded in the bundle manifest.
  string release_tag = 2;
  // release_commit is the ProtoOS commit recorded in the bundle manifest.
  string release_commit = 3;
  // generation is the manifest generation digest of the served bundle.
  string generation = 4;
  google.protobuf.Timestamp loaded_at = 5;
}

enum ProtoOSPackageJobState {
  PROTO_OS_PACKAGE_JOB_STATE_UNSPECIFIED = 0;
  PROTO_OS_PACKAGE_JOB_STATE_QUEUED = 1;
  PROTO_OS_PACKAGE_JOB_STATE_INSTALLING = 2;
  PROTO_OS_PACKAGE_JOB_STATE_SUCCEEDED = 3;
  PROTO_OS_PACKAGE_JOB_STATE_FAILED = 4;
}

message ProtoOSPackageJob {
  string job_id = 1;
  string release_tag = 2;
  // target_version is the Debian version of the staged proto-os package.
  string target_version = 3;
  ProtoOSPackageJobState state = 4;
  // message is a bounded, operator-readable outcome. It never holds secrets.
  string message = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ServerUpdateManifest {
  string job_id = 1;
  string site_id = 2;
  string container_id = 3;
  string instance_id = 4;
  repeated string expected_instance_ids = 5;
  string release_tag = 6;
  string target_version = 7;
  int64 asset_id = 8;
  string asset_name = 9;
  string sha256 = 10;
  int64 size_bytes = 11;
  string actor = 12;
  string maintenance_token = 13;
  string flotilla_address = 14;
  string tls_server_name = 15;
  string root_ca_file = 16;
  string client_certificate_file = 17;
  string client_key_file = 18;
  string site_token = 19;
  // coordination selects the barrier coordinator. UNSPECIFIED is the legacy
  // Flotilla-coordinated path and must be used by existing callers.
  ServerUpdateCoordination coordination = 20;
  // release_statement holds the exact signed bytes of the release statement
  // (frigate-release-statement/v1 JSON). Required when coordination is SELF
  // or package is PROTO_OS; forbidden otherwise.
  bytes release_statement = 21;
  // release_signature holds the DER ECDSA P-256 signature over
  // release_statement. Required when coordination is SELF or package is
  // PROTO_OS; forbidden otherwise. A PROTO_OS signature must verify against
  // the ProtoOS release keys, never the Proto container firmware release keys.
  bytes release_signature = 22;
  // package selects the Debian package this manifest installs. UNSPECIFIED is
  // frigate. PROTO_OS requires proto_os_package_supported and
  // proto_os_signed_packages, coordination UNSPECIFIED, an asset named
  // proto-os_<release_tag>_all.deb, the Debian version of that package in
  // target_version, and a release statement and signature for exactly that
  // package.
  ServerUpdatePackage package = 23;
}

message StartServerUpdateRequest {
  // job_id is the staged job id shared by every instance's manifest. It
  // becomes the rollout id.
  string job_id = 1;
  // target_version must equal the staged manifests and the release statement.
  string target_version = 2;
  // expected_instance_ids must equal the staged manifests' expected_instance_ids.
  repeated string expected_instance_ids = 3;
  // stage_only verifies the package as root on every instance and then exits
  // before any instance is stopped. The rollout ends VERIFIED.
  bool stage_only = 4;
  // idempotency_key makes a repeated identical request return the existing
  // rollout instead of failing with UPDATE_ACTIVE_JOB. The same key with a
  // different request fails with UPDATE_IDEMPOTENCY_CONFLICT.
  string idempotency_key = 5;
  // expected_manifest_sha256 optionally maps each instance id to the
  // lowercase-hex manifest fingerprint the caller staged on it (the
  // manifest_sha256 returned when staging). When present, every entry must
  // match that instance's staged manifest, or Start fails with
  // UPDATE_STAGE_MISMATCH.
  map<string, string> expected_manifest_sha256 = 6;
}

message StartServerUpdateResponse {
  ServerUpdateRollout rollout = 1;
}

message GetServerUpdateStatusRequest {
  // job_id selects a rollout. Empty selects the active rollout, otherwise the
  // most recent terminal rollout, otherwise NOT_FOUND (UPDATE_NOT_FOUND).
  // Terminal rollouts stay readable for at least 30 days, and the 20 most
  // recent are always kept.
  string job_id = 1;
}

message GetServerUpdateStatusResponse {
  ServerUpdateRollout rollout = 1;
  // served_by_maintenance is true when the answering process is the
  // maintenance service rather than the regular Proto container firmware daemon.
  bool served_by_maintenance = 2;
}

message RetryServerUpdateRequest {
  string job_id = 1;
  string idempotency_key = 2;
}

message RetryServerUpdateResponse {
  ServerUpdateRollout rollout = 1;
}

message CancelServerUpdateRequest {
  string job_id = 1;
  string idempotency_key = 2;
}

message CancelServerUpdateResponse {
  ServerUpdateRollout rollout = 1;
}

// ServerUpdateRollout is the site-wide state of one self-coordinated update.
message ServerUpdateRollout {
  string job_id = 1;
  string target_version = 2;
  ServerUpdateRolloutPhase phase = 3;
  repeated ServerUpdateInstanceProgress instances = 4;
  // driver_instance_id is the instance whose helper currently drives the
  // barrier.
  string driver_instance_id = 5;
  // migration_executor_instance_id is the instance that runs the database
  // migration (the Patroni leader).
  string migration_executor_instance_id = 6;
  // error_code is empty when there is no error. It is an open set: new codes
  // may be added, and clients must treat any code they do not recognize as a
  // generic failure (and show error_message). The same set is used by
  // ServerUpdateInstanceProgress.error_code. Known codes:
  //
  // Refusals, also returned as google.rpc.ErrorInfo reasons in domain
  // mdk.v2.frigate when an RPC is refused: UPDATE_REMOTE_TRIGGER_DISABLED,
  // UPDATE_ACTIVE_JOB, UPDATE_NOT_STAGED, UPDATE_STAGE_MISMATCH,
  // UPDATE_SIGNATURE_INVALID, UPDATE_NO_TRUSTED_KEYS, UPDATE_ETCD_UNHEALTHY,
  // UPDATE_INSUFFICIENT_SPACE, UPDATE_COOLDOWN, UPDATE_OUTSIDE_WINDOW,
  // UPDATE_HELPER_UNAVAILABLE, UPDATE_NOT_FOUND, UPDATE_NOT_RETRYABLE,
  // UPDATE_NOT_CANCELLABLE, UPDATE_SELF_COORDINATION_UNSUPPORTED,
  // UPDATE_IDEMPOTENCY_CONFLICT (same idempotency key, different request),
  // UPDATE_MANIFEST_INVALID (malformed manifest) and UPDATE_FIRMWARE_ACTIVE (a
  // hashboard or PSU firmware update is running on an instance; retry after it
  // finishes). While a rollout that can stop Proto container firmware is in progress, hashboard
  // and PSU firmware updates are refused with FIRMWARE_SERVER_UPDATE_ACTIVE.
  //
  // Runtime failures recorded while a rollout runs: UPDATE_PACKAGE_REJECTED
  // (digest, architecture, version or package control data check failed),
  // UPDATE_INSTALL_FAILED, UPDATE_MIGRATE_FAILED (including zero or multiple
  // migration executors), UPDATE_START_FAILED, UPDATE_EXPIRED (pre-stop
  // deadline passed), UPDATE_ABANDONED (operator ran on-host abandon),
  // UPDATE_HELPER_CONTACT_LOST and UPDATE_ETCD_UNAVAILABLE.
  string error_code = 7;
  string error_message = 8;
  // next_step is an operator-facing hint.
  string next_step = 9;
  bool stage_only = 10;
  // disruption_started is true once any instance has been stopped.
  bool disruption_started = 11;
  bool retryable = 12;
  bool cancellable = 13;
  uint32 automatic_retries = 14;
  // actor is the audit actor that started the rollout.
  string actor = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  google.protobuf.Timestamp stopped_at = 18;
  // expires_at is the deadline after which a rollout that has not stopped any
  // instance is cancelled.
  google.protobuf.Timestamp expires_at = 19;
  // from_version is the version that was running when the rollout started.
  string from_version = 20;
  // package_sha256 is the lowercase-hex SHA-256 of the package being installed,
  // as bound by the signed release statement.
  string package_sha256 = 21;
  // release_key_id identifies the key that verified the release statement, as
  // "sha256:" followed by the lowercase hex SHA-256 of its DER
  // SubjectPublicKeyInfo.
  string release_key_id = 22;
}

message ServerUpdateInstanceProgress {
  string instance_id = 1;
  FrigateUpdateAgentPhase phase = 2;
  // last_contact is the UTC wall-clock time at which this instance's helper
  // last wrote its report. Helpers write a report at least every 5 seconds
  // while a rollout is active, and hosts are time-synced (the time-sync gate),
  // so clients may compare it with their own clock.
  google.protobuf.Timestamp last_contact = 3;
  string running_version = 4;
  bool migration_executed = 5;
  // error_code is from the same open set as ServerUpdateRollout.error_code.
  string error_code = 6;
  string error_message = 7;
  // manifest_sha256 is the lowercase-hex fingerprint of the manifest this
  // instance's helper verified, for audit and comparison with the value the
  // caller staged.
  string manifest_sha256 = 8;
  // contact_stale is true when the serving node has seen no report from this
  // instance's helper for more than 30 seconds while the rollout is not
  // terminal.
  bool contact_stale = 9;
}

message StageServerUpdateRequest {
  oneof payload {
    ServerUpdateManifest manifest = 1;
    bytes chunk = 2;
  }
}

message StageServerUpdateResponse {
  string job_id = 1;
  int64 bytes_staged = 2;
  string sha256 = 3;
}

message BeginServerUpdateStageRequest {
  ServerUpdateManifest manifest = 1;
}

message AppendServerUpdateStageRequest {
  string job_id = 1;
  string manifest_sha256 = 2;
  int64 offset = 3;
  bytes chunk = 4;
}

message CommitServerUpdateStageRequest {
  string job_id = 1;
  string manifest_sha256 = 2;
}

message AbortServerUpdateStageRequest {
  string job_id = 1;
  string manifest_sha256 = 2;
}

message AbortServerUpdateStageResponse {}

message BeginServerUpdateStageResponse {
  string job_id = 1;
  string manifest_sha256 = 2;
  int64 next_offset = 3;
  int64 size_bytes = 4;
}

message AppendServerUpdateStageResponse {
  string job_id = 1;
  string manifest_sha256 = 2;
  int64 next_offset = 3;
  int64 size_bytes = 4;
}

message CommitServerUpdateStageResponse {
  string job_id = 1;
  int64 bytes_staged = 2;
  string sha256 = 3;
}

message FrigateUpdateAgentStatus {
  string job_id = 1;
  string site_id = 2;
  string container_id = 3;
  string instance_id = 4;
  string maintenance_token = 5;
  FrigateUpdateAgentPhase phase = 6;
  string running_version = 7;
  bool migration_executed = 8;
  string error = 9;
  google.protobuf.Timestamp updated_at = 10;
  // manifest_sha256 binds the locally validated package manifest to the
  // authenticated rollout retained by Flotilla.
  string manifest_sha256 = 11;
}

message FrigateUpdateAgentCommand {
  FrigateUpdateAgentAction action = 1;
  string message = 2;
  uint32 poll_after_seconds = 3;
}
