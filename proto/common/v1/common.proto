syntax = "proto3";

package common.v1;

// Lightweight identity + display label for related resources embedded in
// list rows. Full resource RPCs remain the source of editable metadata.
message ResourceRef {
  int64 id = 1;
  string label = 2;
}

// Shared placement references for fleet list rows.
message PlacementRefs {
  ResourceRef site = 1;
  ResourceRef building = 2;
  ResourceRef rack = 3;
  repeated ResourceRef groups = 4;
  // Rack zone label; empty when the rack has no zone or the device is
  // not in a rack. Populated where the producing RPC documents it.
  string zone = 5;
}

message FleetErrorDetails {
  oneof code {
    FleetErrorCode common = 1;
    int32 service = 2;
    int32 endpoint = 3;
  }
}

enum FleetErrorCode {
  FLEET_ERROR_CODE_UNSPECIFIED = 0;
  FLEET_ERROR_CODE_NOT_ACTIVE = 1;
}

// DeviceClass identifies the independently discoverable hardware unit.
// Tanks and modules belong to a container; they are not separate devices.
enum DeviceClass {
  DEVICE_CLASS_UNSPECIFIED = 0;
  DEVICE_CLASS_RIG = 1;
  DEVICE_CLASS_CONTAINER = 2;
}

// Discovered device address. The plugin defines the opaque endpoint ID and
// shared device key; Fleet scopes the key by driver and network owner.
message DeviceEndpoint {
  string id = 1;
  string device_key = 2;
  string host = 3;
  int32 port = 4;
  string url_scheme = 5;
  int32 rpc_port = 6;
  bool rpc_tls = 7;
  // Current group members. Discovery removes routes for replaced members.
  repeated string member_ids = 8;
}
