syntax = "proto3";

package instance.v1;

import "google/protobuf/timestamp.proto";

service InstanceUpdateService {
    // GetUpdateStatus reports the latest eligible release for the instance's
    // channel and the command that installs it. Gated by instance:update.
    rpc GetUpdateStatus(GetUpdateStatusRequest) returns (GetUpdateStatusResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // SetReleaseChannel switches the instance between Stable and Stable + RC.
    // Gated by instance:update.
    rpc SetReleaseChannel(SetReleaseChannelRequest) returns (SetReleaseChannelResponse);

    // TriggerUpgrade asks the host updater to install the exact release that
    // GetUpdateStatus currently offers. Gated by instance:update.
    rpc TriggerUpgrade(TriggerUpgradeRequest) returns (TriggerUpgradeResponse);

    // GetUpgradeStatus reports durable host-side progress across fleetd
    // restarts. Gated by instance:update.
    rpc GetUpgradeStatus(GetUpgradeStatusRequest) returns (GetUpgradeStatusResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // AcknowledgeUpgrade durably dismisses a terminal upgrade outcome on the
    // host, so it stops resurfacing for every session. Gated by
    // instance:update.
    rpc AcknowledgeUpgrade(AcknowledgeUpgradeRequest) returns (AcknowledgeUpgradeResponse) {
        option idempotency_level = IDEMPOTENT;
    }
}

enum ReleaseChannel {
    RELEASE_CHANNEL_UNSPECIFIED = 0;
    RELEASE_CHANNEL_STABLE = 1;
    RELEASE_CHANNEL_STABLE_AND_RC = 2;
}

enum UpgradePhase {
    UPGRADE_PHASE_UNSPECIFIED = 0;
    UPGRADE_PHASE_QUEUED = 1;
    UPGRADE_PHASE_DOWNLOADING = 2;
    UPGRADE_PHASE_VERIFYING = 3;
    UPGRADE_PHASE_STAGING = 4;
    UPGRADE_PHASE_PREFLIGHT = 5;
    UPGRADE_PHASE_ACTIVATING = 6;
    UPGRADE_PHASE_SUCCEEDED = 7;
    UPGRADE_PHASE_FAILED = 8;
}

message ReleaseInfo {
    string version = 1;
    string release_notes_url = 2;
    google.protobuf.Timestamp published_at = 3;
    bool prerelease = 4;
}

message GetUpdateStatusRequest {}

message GetUpdateStatusResponse {
    string current_version = 1;
    ReleaseChannel channel = 2;
    // Unset when no release newer than current_version is eligible.
    ReleaseInfo latest_eligible = 3;
    bool update_available = 4;
    // Full copy-paste installer invocation for latest_eligible; empty when
    // update_available is false.
    string install_command = 5;
    // True only when the independently installed host executor is reachable.
    // False keeps the copy-command fallback visible.
    bool one_click_available = 6;
    // False until release discovery succeeds and after its latest list fetch
    // fails. Callers must not interpret update_available=false as up to date
    // while status is unavailable.
    bool status_available = 7;
}

message SetReleaseChannelRequest {
    ReleaseChannel channel = 1;
}

message SetReleaseChannelResponse {}

message UpgradeOperation {
    string id = 1;
    string target_version = 2;
    UpgradePhase phase = 3;
    string message = 4;
    google.protobuf.Timestamp started_at = 5;
    google.protobuf.Timestamp updated_at = 6;
    google.protobuf.Timestamp completed_at = 7;
    string error = 8;
    string recovery_command = 9;
    string host_log_path = 10;
    // True once an operator dismissed this terminal outcome; clients keep the
    // operation out of their upgrade UI.
    bool acknowledged = 11;
    // Monotonically increases whenever the updater creates or materially
    // rewrites a terminal outcome. Acknowledgement uses this revision as a
    // compare-and-set guard so a stale browser cannot dismiss a newer result.
    uint64 outcome_revision = 12;
}

message TriggerUpgradeRequest {
    string target_version = 1;
    // Canonical UUID generated by the caller before the request is sent. It is
    // the idempotency key for retries and remains the operation's durable ID.
    string operation_id = 2;
}

message TriggerUpgradeResponse {
    UpgradeOperation operation = 1;
}

message AcknowledgeUpgradeRequest {
    string operation_id = 1;
    // Exact terminal outcome revision the caller observed. The updater rejects
    // the mutation when the durable outcome has since changed.
    uint64 expected_outcome_revision = 2;
}

message AcknowledgeUpgradeResponse {
    UpgradeOperation operation = 1;
}

message GetUpgradeStatusRequest {}

message GetUpgradeStatusResponse {
    bool executor_available = 1;
    UpgradeOperation operation = 2;
}
