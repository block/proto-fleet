syntax = "proto3";

package instance.v1;

import "google/protobuf/timestamp.proto";

service InstanceUpdateService {
    // GetUpdateStatus reports the latest eligible release for the instance's
    // channel and the command that installs it. Gated by instance:update.
    rpc GetUpdateStatus(GetUpdateStatusRequest) returns (GetUpdateStatusResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // SetReleaseChannel switches the instance between Stable and Stable + RC.
    // Gated by instance:update.
    rpc SetReleaseChannel(SetReleaseChannelRequest) returns (SetReleaseChannelResponse);
}

enum ReleaseChannel {
    RELEASE_CHANNEL_UNSPECIFIED = 0;
    RELEASE_CHANNEL_STABLE = 1;
    RELEASE_CHANNEL_STABLE_AND_RC = 2;
}

message ReleaseInfo {
    string version = 1;
    string release_notes_url = 2;
    google.protobuf.Timestamp published_at = 3;
    bool prerelease = 4;
}

message GetUpdateStatusRequest {}

message GetUpdateStatusResponse {
    string current_version = 1;
    ReleaseChannel channel = 2;
    // Unset when no release newer than current_version is eligible.
    ReleaseInfo latest_eligible = 3;
    bool update_available = 4;
    // Full copy-paste installer invocation for latest_eligible; empty when
    // update_available is false.
    string install_command = 5;
    // False until release discovery succeeds and after its latest list fetch
    // fails. Callers must not interpret update_available=false as up to date
    // while status is unavailable.
    bool status_available = 7;
}

message SetReleaseChannelRequest {
    ReleaseChannel channel = 1;
}

message SetReleaseChannelResponse {}
