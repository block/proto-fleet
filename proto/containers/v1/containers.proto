syntax = "proto3";
package containers.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "common/v1/equipment_coverage.proto";
import "minercommand/v1/command.proto";
import "google/protobuf/timestamp.proto";

// Containers are paired controllers with observed internal topology. Their
// modules are not Fleet miners, and tanks are not user-managed racks.
service ContainerService {
  rpc GetMiningStatus(GetMiningStatusRequest) returns (GetMiningStatusResponse);
  rpc GetPowerTarget(GetPowerTargetRequest) returns (GetPowerTargetResponse);
  rpc SetMining(SetMiningRequest) returns (SetMiningResponse);
  rpc SetPowerTarget(SetPowerTargetRequest) returns (SetPowerTargetResponse);
  rpc GetModuleMiningOptions(GetModuleMiningOptionsRequest) returns (GetModuleMiningOptionsResponse);
  rpc SetModuleMining(SetModuleMiningRequest) returns (SetModuleMiningResponse);
  rpc GetBoardIdentifyOptions(GetBoardIdentifyOptionsRequest) returns (GetBoardIdentifyOptionsResponse);
  rpc SetBoardIdentify(SetBoardIdentifyRequest) returns (SetBoardIdentifyResponse);
  rpc GetTankMiningOptions(GetTankMiningOptionsRequest) returns (GetTankMiningOptionsResponse);
  rpc SetTankMining(SetTankMiningRequest) returns (SetTankMiningResponse);
  rpc GetEquipmentCommandResult(GetEquipmentCommandResultRequest) returns (GetEquipmentCommandResultResponse);
  rpc SetEquipmentControl(SetEquipmentControlRequest) returns (SetEquipmentControlResponse);
  rpc GetContainer(GetContainerRequest) returns (GetContainerResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  // Site management metadata only; does not grant access to container telemetry.
  rpc ListContainerPlacements(ListContainerPlacementsRequest) returns (ListContainerPlacementsResponse);
}
message ListContainerPlacementsRequest {}
message ListContainerPlacementsResponse {
  repeated ContainerPlacement containers = 1;
}
message ContainerPlacement {
  string device_identifier = 1;
  string name = 2;
  common.v1.ResourceRef site = 3;
  int64 tank_count = 4;
}
message GetContainerRequest {
  string device_identifier = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
}
message GetContainerResponse {
  Container container = 1;
}
message ListContainersRequest {
  repeated int64 site_ids = 1 [(buf.validate.field).repeated = {
    max_items: 1024
    items: { int64: {gt: 0} }
  }];
  bool include_unassigned = 2;
}
message ListContainersResponse {
  repeated Container containers = 1;
}
// Latest controller redundancy observation. Stale evidence is unavailable,
// even when the last observation was healthy.
message ContainerHA {
 google.protobuf.Timestamp observed_at = 1;
 bool degraded = 2;
 bool stale = 3;
}
message Container {
 // Missing or stale HA evidence must be shown as degraded redundancy.
 ContainerHA ha = 22;
 // Current caller can manage placement at this controller's current site.
 // Assignment rechecks both current and destination site permissions.
 bool can_assign_site = 21;
 // Present only with fresh inventory coverage; zero means none reported.
 optional uint32 unlocated_hashboards = 20;
 optional double efficiency_jh = 16;
 common.v1.EquipmentCoverage coverage = 17;
 optional double min_temperature_c = 18;
 optional double max_temperature_c = 19;
 ContainerPlant plant = 15;
 // Current caller has plant-write permissions at this controller's current site.
 // Dispatch rechecks authorization. Firmware support is independently observed.
 bool can_control_equipment = 14;
 repeated ContainerFan fans = 12;
 ContainerControls controls = 13;
  // Stable Fleet device ID used by typed inventory ancestor filters.
  int64 id = 11;
  string device_identifier = 1;
  string name = 2;
  common.v1.ResourceRef site = 3;
  google.protobuf.Timestamp observed_at = 4;
  repeated TankHealth tanks = 5;
  google.protobuf.Timestamp metrics_at = 6;
  optional double hashrate_hs = 7;
  optional double power_w = 8;
  optional double temperature_c = 9;
  // False means a recent observation exists. Stale retained observations must
  // not be presented as current health, even if their counts were all healthy.
  bool stale = 10;

}
message TankHealth {
  int32 position = 1;
  int32 hashing_count = 2;
  int32 attention_count = 3;
  int32 offline_count = 4;
  int32 sleeping_count = 5;
  int32 isolated_count = 6;
  int32 unknown_count = 7;
}

// Latest component observations. Missing scalar values are unavailable, not zero.
message ContainerFan {
 string component_id = 1;
 google.protobuf.Timestamp observed_at = 2;
 optional double speed_percent = 3;
 optional double power_w = 4;
 optional string direction = 5;
 optional bool alarm_active = 6;
 bool stale = 7;
}
// A successful independent read; absent capability flags mean unknown.
message ContainerControls {
 google.protobuf.Timestamp observed_at = 1;
 optional bool supported = 2;
 repeated ContainerControl controls = 3;
 repeated ContainerSetpoint setpoints = 4;
 optional bool main_circuit_breaker_supported = 5;
 optional bool main_circuit_breaker_closed = 6;
 optional bool alarm_reset_supported = 7;
 optional bool alarm_mute_supported = 8;
 optional bool dry_cooler_fan_reverse_supported = 9;
 bool stale = 10;
}
message ContainerControl {
 string name = 1;
 optional bool enabled = 2;
}
message ContainerSetpoint {
 string name = 1;
 optional double value = 2;
 string unit = 3;
}

// A single named desired state, never a toggle or an arbitrary HTTP request.
message SetEquipmentControlRequest {
  string device_identifier = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string name = 2 [(buf.validate.field).string = {in: ["dry_cooler", "dry_cooler_auto", "tank_led_light", "coolant_pump", "air_conditioner_1", "air_conditioner_2", "main_circuit_breaker"]}];
  // For main_circuit_breaker true means closed, false means open.
  optional bool enabled = 3 [(buf.validate.field).required = true];
}
message SetEquipmentControlResponse {
  // Completion acknowledges the write, not refreshed physical state.
  string batch_identifier = 1;
}

message GetEquipmentCommandResultRequest {
 string device_identifier = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
 string batch_identifier = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message GetEquipmentCommandResultResponse {
 minercommand.v1.GetCommandBatchDeviceResultsResponse result = 1;
}

// Plant telemetry has its own source timestamp, independent of control reads.
message ContainerPlant {
 google.protobuf.Timestamp observed_at = 1;
 optional double dry_cooler_inlet_temperature_c = 2;
 bool stale = 3;
}

// Stable Fleet tank IDs; positions and controllers are resolved by the server.
message GetTankMiningOptionsRequest {
  repeated int64 tank_ids = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 100, items: {int64: {gt: 0}}}];
}
message GetTankMiningOptionsResponse {
  bool can_start = 1;
  bool can_stop = 2;
  string unavailable_reason = 3;
}
message SetTankMiningRequest {
  repeated int64 tank_ids = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 100, items: {int64: {gt: 0}}}];
  optional bool mining = 2 [(buf.validate.field).required = true];
}
message TankMiningCommand {
  string device_identifier = 1;
  string container_name = 2;
  repeated int64 tank_ids = 3;
  string batch_identifier = 4;
}
message SetTankMiningResponse {
  // One existing command batch per controller, with exact selected tank scope.
  repeated TankMiningCommand commands = 1;
}

message GetModuleMiningOptionsRequest {
  repeated int64 module_ids = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 100, items: {int64: {gt: 0}}}];
}
message GetModuleMiningOptionsResponse {
  bool can_start = 1;
  bool can_stop = 2;
  string unavailable_reason = 3;
}
message SetModuleMiningRequest {
  repeated int64 module_ids = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 100, items: {int64: {gt: 0}}}];
  optional bool mining = 2 [(buf.validate.field).required = true];
}
message ModuleMiningCommand {
  string device_identifier = 1;
  string container_name = 2;
  repeated int64 module_ids = 3;
  string batch_identifier = 4;
}
message SetModuleMiningResponse {
  // One batch per controller; the server resolves exact module scope and identity.
  repeated ModuleMiningCommand commands = 1;
}

// Stable Fleet module and hashboard IDs. The server expands modules into the
// boards currently installed in them; the caller confirms that exact list.
message GetBoardIdentifyOptionsRequest {
  repeated int64 module_ids = 1 [(buf.validate.field).repeated = {max_items: 10, items: {int64: {gt: 0}}}];
  repeated int64 hashboard_ids = 2 [(buf.validate.field).repeated = {max_items: 30, items: {int64: {gt: 0}}}];
}
// One currently installed board. installation_id changes whenever the board
// moves or is replaced, so it pins the confirmed identity to its placement.
message IdentifyBoard {
  int64 hashboard_id = 1;
  int64 installation_id = 2;
  int64 module_id = 3;
  string device_identifier = 4;
  string container_name = 5;
  int32 tank = 6;
  int32 module = 7;
  int32 slot = 8;
  string serial_number = 9;
}
message GetBoardIdentifyOptionsResponse {
  repeated IdentifyBoard boards = 1;
  bool can_identify = 2;
  string unavailable_reason = 3;
}
enum BoardIdentifyMode {
  BOARD_IDENTIFY_MODE_UNSPECIFIED = 0;
  BOARD_IDENTIFY_MODE_BLINK = 1;
  BOARD_IDENTIFY_MODE_OFF = 2;
}
message BoardIdentifyTarget {
  int64 hashboard_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 installation_id = 2 [(buf.validate.field).int64.gt = 0];
}
message SetBoardIdentifyRequest {
  // The exact boards the operator confirmed; a moved or replaced board is rejected.
  repeated BoardIdentifyTarget boards = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 30}];
  BoardIdentifyMode mode = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}
message BoardIdentifyCommand {
  int64 hashboard_id = 1;
  string device_identifier = 2;
  string batch_identifier = 3;
}
message SetBoardIdentifyResponse {
  // One batch per board so each board reports its own controller outcome.
  repeated BoardIdentifyCommand commands = 1;
}

message GetMiningStatusResponse {
  bool mining = 1;
  string operating_state = 2;
}
message GetPowerTargetResponse {
  double watts = 1;
  optional double minimum_watts = 2;
  optional double maximum_watts = 3;
  string performance_mode = 4;
  optional bool balance_bays = 5;
  optional bool hash_on_disconnect = 6;
}
message SetMiningRequest {
  string device_identifier = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional bool mining = 2 [(buf.validate.field).required = true];
}
message SetPowerTargetRequest {
  string device_identifier = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  double watts = 2 [(buf.validate.field).double = {gt: 0, finite: true}];
  string performance_mode = 3 [(buf.validate.field).string = {in: ["", "PERFORMANCE_MODE_UNSPECIFIED", "PERFORMANCE_MODE_MAXIMUM_HASHRATE", "PERFORMANCE_MODE_EFFICIENCY"]}];
  optional bool balance_bays = 4;
  optional bool hash_on_disconnect = 5;
}
message SetMiningResponse {
  // Use GetEquipmentCommandResult to observe this controller's command completion.
  string batch_identifier = 1;
}

message GetMiningStatusRequest {
  string device_identifier = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
}
message GetPowerTargetRequest {
  string device_identifier = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
}
message SetPowerTargetResponse {
  string batch_identifier = 1;
}
