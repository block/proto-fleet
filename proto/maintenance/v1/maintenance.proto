syntax = "proto3";

package maintenance.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// MaintenanceService is the admin surface for repair ticket management:
// create, triage, assign, track, and close repair tickets for both
// miner hardware and infrastructure components. Also manages ticket
// comments and provides aggregate statistics for queue dashboards.
service MaintenanceService {
    rpc ShareRepairTicket(ShareRepairTicketRequest) returns (ShareRepairTicketResponse);
    rpc SetTicketCommentVisibility(SetTicketCommentVisibilityRequest) returns (SetTicketCommentVisibilityResponse);
    rpc ListTicketAssetOptions(ListTicketAssetOptionsRequest) returns (ListTicketAssetOptionsResponse);
    rpc UpdateTicketTarget(UpdateTicketTargetRequest) returns (UpdateTicketTargetResponse);
    // ListRepairTickets returns a filtered, sorted, paginated list of
    // repair tickets. Excludes soft-deleted tickets. Supports cursor
    // pagination, multi-dimensional filtering, and text search across
    // ticket_number, component, diagnosis, and miner_identifier.
    rpc ListRepairTickets(ListRepairTicketsRequest) returns (ListRepairTicketsResponse);

    // GetRepairTicket returns a single ticket by id with its comments
    // and parts usage. Returns NotFound if the ticket does not exist
    // or belongs to another org.
    rpc GetRepairTicket(GetRepairTicketRequest) returns (GetRepairTicketResponse);

    // CreateRepairTicket inserts a new ticket. Ticket number is
    // auto-generated as TK-XXXX (zero-padded, monotonically
    // increasing per org).
    rpc CreateRepairTicket(CreateRepairTicketRequest) returns (CreateRepairTicketResponse);

    // UpdateRepairTicket mutates mutable fields on a single ticket:
    // status changes, field edits, completion form submission, and
    // RMA field updates. Status transitions are validated server-side.
    rpc UpdateRepairTicket(UpdateRepairTicketRequest) returns (UpdateRepairTicketResponse);

    // BulkUpdateRepairTickets applies a single mutation (assign,
    // status change, mark urgent, or bulk close with resolution) to
    // one or more tickets in a single transaction.
    rpc BulkUpdateRepairTickets(BulkUpdateRepairTicketsRequest) returns (BulkUpdateRepairTicketsResponse);

    // ListTicketComments returns all non-deleted comments on a ticket,
    // ordered by created_at ascending.
    rpc ListTicketComments(ListTicketCommentsRequest) returns (ListTicketCommentsResponse);

    // CreateTicketComment adds a comment to a ticket.
    rpc CreateTicketComment(CreateTicketCommentRequest) returns (CreateTicketCommentResponse);

    // DeleteTicketComment soft-deletes a comment.
    rpc DeleteTicketComment(DeleteTicketCommentRequest) returns (DeleteTicketCommentResponse);

    // ListCompletedTickets returns completed tickets for the history
    // tab with optional component and assignee filters.
    rpc ListCompletedTickets(ListCompletedTicketsRequest) returns (ListCompletedTicketsResponse);

    // ListAssignees returns active users who belong to the caller's
    // organization. It is intentionally maintenance-scoped so field
    // technicians do not need the Super-Admin-only user-management RPC.
    rpc ListAssignees(ListAssigneesRequest) returns (ListAssigneesResponse);

    // GetTicketStats returns aggregate counts by status for the queue
    // stats row and kanban column headers.
    rpc GetTicketStats(GetTicketStatsRequest) returns (GetTicketStatsResponse);
}

// ──────────────────────────────────────────────────────────────────
// Enums
// ──────────────────────────────────────────────────────────────────

enum TicketCategory {
    TICKET_CATEGORY_UNSPECIFIED     = 0;
    TICKET_CATEGORY_MINER           = 1;
    TICKET_CATEGORY_INFRASTRUCTURE  = 2;
    TICKET_CATEGORY_MODULE          = 3;
    TICKET_CATEGORY_HASHBOARD       = 4;
    TICKET_CATEGORY_ACCOUNT         = 5;
}

enum TicketStatus {
    TICKET_STATUS_UNSPECIFIED    = 0;
    TICKET_STATUS_OPEN           = 1;
    TICKET_STATUS_IN_PROGRESS    = 2;
    TICKET_STATUS_ON_HOLD        = 3;
    TICKET_STATUS_SENT_TO_VENDOR = 4;
    TICKET_STATUS_COMPLETED      = 5;
}

enum TicketResolution {
    TICKET_RESOLUTION_UNSPECIFIED      = 0;
    TICKET_RESOLUTION_REPAIRED         = 1;
    TICKET_RESOLUTION_REPLACED         = 2;
    TICKET_RESOLUTION_DEFERRED         = 3;
    TICKET_RESOLUTION_UNREPAIRABLE     = 4;
    // Closes the ticket without consuming parts; all active reservations are released.
    TICKET_RESOLUTION_NO_ACTION_NEEDED = 5;
}

enum RepairLocation {
    REPAIR_LOCATION_UNSPECIFIED  = 0;
    REPAIR_LOCATION_ON_RACK      = 1;
    REPAIR_LOCATION_REPAIR_BENCH = 2;
}

enum WarrantyStatus {
    WARRANTY_STATUS_UNSPECIFIED     = 0;
    WARRANTY_STATUS_IN_WARRANTY     = 1;
    WARRANTY_STATUS_OUT_OF_WARRANTY = 2;
    WARRANTY_STATUS_EXPIRING_SOON   = 3;
}

enum TicketSortField {
    TICKET_SORT_FIELD_UNSPECIFIED = 0;
    TICKET_SORT_FIELD_COMPONENT   = 1;
    TICKET_SORT_FIELD_ASSET       = 2;
    TICKET_SORT_FIELD_LOCATION    = 3;
    TICKET_SORT_FIELD_STATUS      = 4;
    TICKET_SORT_FIELD_CREATED_AT   = 5;
    TICKET_SORT_FIELD_COMPLETED_AT = 6;
}

enum SortDirection {
    SORT_DIRECTION_UNSPECIFIED = 0;
    SORT_DIRECTION_ASC         = 1;
    SORT_DIRECTION_DESC        = 2;
}

// ──────────────────────────────────────────────────────────────────
// Domain messages
// ──────────────────────────────────────────────────────────────────

// RepairTicket is the read shape returned by Get/List/Create/Update.
message RepairTicket {
    int64  id             = 1;
    string ticket_number  = 2;

    TicketCategory   category         = 3;
    TicketStatus     status           = 4;
    bool             urgent           = 5;

    string component  = 6;
    string diagnosis  = 7;

    // Set only for miner tickets.
    optional string miner_identifier = 8;
    // Set when the ticket was created from an alert.
    optional string alert_id = 9;

    // Assignee — user_id is the FK, name is denormalized for display.
    optional int64 assignee_user_id = 10;
    string         assignee_name    = 11;

    WarrantyStatus warranty_status = 12;

    // Location context — all optional; infra tickets may lack rack/group.
    optional int64 site_id     = 13;
    optional int64 building_id = 14;
    string         zone        = 15;
    optional int64 rack_id     = 16;
    string         rack_label  = 17;
    string         group_label = 18;

    // Completion fields — populated when status is COMPLETED.
    TicketResolution resolution      = 19;
    RepairLocation   repair_location = 20;
    // Operational notes remain separate from the client-visible closing note.
    string           notes           = 21;
    string           resolution_note = 36;
    double           daily_impact_usd = 22;

    // RMA fields — populated when status is SENT_TO_VENDOR.
    string                          rma_vendor   = 23;
    string                          rma_tracking = 24;
    optional google.protobuf.Timestamp rma_eta   = 25;

    optional google.protobuf.Timestamp completed_at = 26;
    google.protobuf.Timestamp          created_at   = 27;
    google.protobuf.Timestamp          updated_at   = 28;

    // Hydrated display labels. Clients do not resolve tenant-scoped IDs.
    string site_name     = 29;
    string building_name = 30;
    string description = 31;
    repeated TicketAsset targets = 32;
    // Opening-time recipients; access requires shared_with_clients.
    repeated TicketAudience audiences = 33;
    bool shared_with_clients = 35;
    string created_by_account_id = 34;
}

// Stable physical identities. A hashboard selection must name its current
// module; the server verifies that association and snapshots the installation.
message TicketAssetSelection {
    TicketCategory kind = 1 [(buf.validate.field).enum = {defined_only: true, in: [1,3,4]}];
    int64 id = 2 [(buf.validate.field).int64.gt = 0];
    optional int64 parent_module_id = 3 [(buf.validate.field).int64.gt = 0];
    option (buf.validate.message).cel = {
      id: "ticket_asset.parent"
      message: "only hashboards require a parent module"
      expression: "(this.kind == 4) == has(this.parent_module_id)"
    };
}
message TicketAsset {
    TicketCategory kind = 1;
    int64 id = 2;
    string label = 3;
    string model = 4;
    optional int64 module_id = 5;
    optional int64 installation_id = 6;
    optional int64 container_id = 7;
    optional int32 position = 8;
    optional int64 site_id = 9;
    optional int64 replacement_module_id = 10;
    optional int64 replacement_hashboard_id = 11;
    string diagnosis = 12;
    string warranty_evidence = 13;
    string repair_outcome = 14;
    string rma_outcome = 15;
    string miner_identifier = 16;
    // Client projections retain identity but omit physical details outside live policy.
    bool outside_policy = 17;
}
message TicketAudience {
    string account_id = 1;
    string name = 2;
}

message PartUsage {
    int64  inventory_part_id = 1 [(buf.validate.field).int64.gt = 0];
    string part_name         = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
    int32  quantity          = 3 [(buf.validate.field).int32.gt = 0];
}

message TicketPartsSelection {
    repeated PartUsage parts = 1;
}

// Read-only history distinguishes consumed stock from active reservations.
message RecordedPartUsage {
    int64 inventory_part_id = 1;
    string part_name = 2;
    int32 quantity = 3;
    optional google.protobuf.Timestamp consumed_at = 4;
}

message TicketComment {
    int64  id        = 1;
    int64  ticket_id = 2;
    int64  user_id   = 3;
    string user_name = 4;
    string text      = 5;
    google.protobuf.Timestamp created_at = 6;
    // Derived by the server from the authenticated caller. Never accepted
    // on a mutation request.
    bool authored_by_caller = 7;
    bool internal = 8;
    string account_id = 9;
    string account_name = 10;
}

message Assignee {
    int64  user_id   = 1;
    string username  = 2;
    string role_name = 3;
}

// RepairTicketDetail pairs a ticket with its comments and parts for
// the detail view. Returned by GetRepairTicket.
message RepairTicketDetail {
    RepairTicket          ticket   = 1;
    repeated TicketComment comments = 2;
    repeated RecordedPartUsage parts_used = 3;
}

// RepairTicketSummary is the list-view shape: ticket fields plus
// aggregate counts to avoid N+1 on the list page.
message RepairTicketSummary {
    RepairTicket ticket        = 1;
    int32        comment_count = 2;
    int32        parts_count   = 3;
}

// ──────────────────────────────────────────────────────────────────
// RPC messages
// ──────────────────────────────────────────────────────────────────

// ListRepairTickets

message TicketFilter {
    repeated TicketStatus   statuses     = 1;
    repeated TicketCategory categories   = 2;
    repeated int64          site_ids     = 3;
    repeated int64          building_ids = 4;
    repeated int64          rack_ids     = 5;
    repeated string         group_labels = 6;
    optional int64          assignee_user_id = 7;
    bool                    urgent_only  = 8;
    string                  search_query = 9 [(buf.validate.field).string.max_len = 256];
    bool                    exclude_completed = 10;
    bool                    overdue_only      = 11;
}

message ListRepairTicketsRequest {
    TicketFilter   filter         = 1;
    TicketSortField sort_field    = 2;
    SortDirection   sort_direction = 3;
    int32           page_size     = 4 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
    string          page_token    = 5 [(buf.validate.field).string.max_len = 2048];
}

message ListRepairTicketsResponse {
    repeated RepairTicketSummary tickets         = 1;
    string                      next_page_token = 2;
    int32                       total_count     = 3;
}

// GetRepairTicket

message GetRepairTicketRequest {
    int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetRepairTicketResponse {
    RepairTicketDetail detail = 1;
}

// CreateRepairTicket

message CreateRepairTicketRequest {
    option (buf.validate.message).cel = {
        id: "ticket_target_location_derived"
        message: "location and miner fields cannot be supplied with targets"
        expression: "this.targets.size() == 0 || (!has(this.site_id) && !has(this.building_id) && !has(this.rack_id) && !has(this.miner_identifier) && this.zone == '' && this.rack_label == '' && this.group_label == '')"
    };
    // Host tickets are internal unless explicitly shared.
    bool share_with_clients = 20;
    TicketCategory category  = 1 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3, 4]}];
    string         component = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
    string         diagnosis = 3 [(buf.validate.field).string.max_len = 4096];
    bool           urgent    = 4;

    optional string miner_identifier = 5 [(buf.validate.field).string.max_len = 256];
    optional string alert_id         = 6 [(buf.validate.field).string.max_len = 64];

    optional int64 assignee_user_id = 7 [(buf.validate.field).int64.gt = 0];

    WarrantyStatus warranty_status = 8 [(buf.validate.field).enum.defined_only = true];

    optional int64 site_id     = 9  [(buf.validate.field).int64.gt = 0];
    optional int64 building_id = 10 [(buf.validate.field).int64.gt = 0];
    string         zone        = 11 [(buf.validate.field).string.max_len = 255];
    optional int64 rack_id     = 12 [(buf.validate.field).int64.gt = 0];
    string         rack_label  = 13 [(buf.validate.field).string.max_len = 255];
    string         group_label = 14 [(buf.validate.field).string.max_len = 255];

    string notes = 15 [(buf.validate.field).string.max_len = 4096];

    // Caller-generated key reused when retrying the same create operation.
    string idempotency_key = 16 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
    string description = 17 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
    repeated TicketAssetSelection targets = 18 [(buf.validate.field).repeated.max_items = 100];
    // Explicit infrastructure audiences. Asset audiences are derived at opening.
    repeated string client_account_ids = 19 [(buf.validate.field).repeated = {max_items: 100, unique: true, items: {string: {uuid: true}}}];
}

message CreateRepairTicketResponse {
    RepairTicket ticket = 1;
}

// UpdateRepairTicket

message UpdateRepairTicketRequest {
    option (buf.validate.message).cel = {
        id: "resolution_note_required_on_completion"
        message: "completing a ticket requires a resolution note"
        expression: "!has(this.status) || this.status != 5 || (has(this.resolution_note) && this.resolution_note.size() > 0)"
    };
    option (buf.validate.message).cel = {
        id: "resolution_note_completion_only"
        message: "resolution_note is only accepted when completing a ticket"
        expression: "!has(this.resolution_note) || (has(this.status) && this.status == 5)"
    };

    int64 id = 1 [(buf.validate.field).int64.gt = 0];

    // Mutable fields — only set fields are applied.
    optional TicketStatus    status           = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
    optional bool            urgent           = 3;
    optional int64           assignee_user_id = 4;
    optional string          component        = 5  [(buf.validate.field).string.max_len = 255];
    optional string          diagnosis        = 6  [(buf.validate.field).string.max_len = 4096];
    optional WarrantyStatus  warranty_status  = 7 [(buf.validate.field).enum.defined_only = true];

    // Completion fields — set when transitioning to COMPLETED.
    optional TicketResolution   resolution      = 8 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
    optional RepairLocation     repair_location = 9 [(buf.validate.field).enum.defined_only = true];
    optional TicketPartsSelection parts_selection = 10;
    optional string           resolution_note = 22 [(buf.validate.field).string.max_len = 4096];

    // Operational notes — independent of completion.
    optional string           notes           = 11 [(buf.validate.field).string.max_len = 4096];

    // RMA fields — set when transitioning to SENT_TO_VENDOR.
    optional string                    rma_vendor   = 12 [(buf.validate.field).string.max_len = 255];
    optional string                    rma_tracking = 13 [(buf.validate.field).string.max_len = 255];
    optional google.protobuf.Timestamp rma_eta      = 14;

    // Clear assignee — set to true to unassign.
    bool clear_assignee = 15;
    // Clear RMA ETA — set to true to remove a previously recorded date.
    bool clear_rma_eta = 16;
    reserved 17, 18, 19;
    reserved "expected_parts_selection", "expected_rma_snapshot", "expected_status";
    // Exact version observed when the editor opened. Stale writes require refresh.
    google.protobuf.Timestamp expected_updated_at = 20 [(buf.validate.field).required = true];
    // Add affected physical boards to this incident without a duplicate ticket.
    repeated TicketAssetSelection affected_boards = 21 [(buf.validate.field).repeated.max_items = 100];
}

message UpdateRepairTicketResponse {
    RepairTicket ticket = 1;
}

// BulkUpdateRepairTickets

message BulkUpdateRepairTicketsRequest {
    repeated int64 ticket_ids = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 500}];

    // Exactly one mutation must be set.
    oneof mutation {
        int64           assign_to_user_id = 2 [(buf.validate.field).int64.gt = 0];
        TicketStatus    set_status        = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
        bool            mark_urgent       = 4;
        BulkCloseParams bulk_close        = 5;
    }

    // Clear assignee for all selected tickets.
    bool clear_assignee = 6;
    reserved 7;
    reserved "expected_statuses";
    // Required for every mutation; one version per selected ticket.
    repeated TicketVersion expected_versions = 8 [(buf.validate.field).repeated = {min_items: 1, max_items: 500}];
}

message TicketVersion {
    int64 ticket_id = 1 [(buf.validate.field).int64.gt = 0];
    google.protobuf.Timestamp updated_at = 2 [(buf.validate.field).required = true];
}

message BulkCloseParams {
    TicketResolution              resolution        = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
    RepairLocation                repair_location   = 2 [(buf.validate.field).enum.defined_only = true];
    reserved 3;
    reserved "parts_used";
    reserved 4;
    reserved "notes";
    string                        resolution_note   = 6 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
    reserved 5;
    reserved "expected_statuses";
}

message BulkUpdateRepairTicketsResponse {
    int32 updated_count = 1;
}

// ListTicketComments

message ListTicketCommentsRequest {
    int64 ticket_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListTicketCommentsResponse {
    repeated TicketComment comments = 1;
}

// CreateTicketComment

message CreateTicketCommentRequest {
    int64  ticket_id       = 1 [(buf.validate.field).int64.gt = 0];
    string text            = 2 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
    string idempotency_key = 3 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
    // Omission creates a host-only note. False explicitly posts a client reply.
    optional bool internal = 4;

}

message CreateTicketCommentResponse {
    TicketComment comment = 1;
}

// DeleteTicketComment

message DeleteTicketCommentRequest {
    int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteTicketCommentResponse {}

// ListCompletedTickets

message ListCompletedTicketsRequest {
    optional string component_filter        = 1 [(buf.validate.field).string.max_len = 255];
    optional int64  assignee_user_id_filter = 2 [(buf.validate.field).int64.gt = 0];
    TicketSortField sort_field              = 3;
    SortDirection   sort_direction          = 4;
    int32           page_size               = 5 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
    string          page_token              = 6 [(buf.validate.field).string.max_len = 2048];
}

message ListCompletedTicketsResponse {
    repeated RepairTicketSummary tickets          = 1;
    string                       next_page_token  = 2;
    int32                        total_count      = 3;
    // All users referenced by live completed tickets, including inactive users.
    repeated Assignee assignee_facets = 4;
}

// ListAssignees

message ListAssigneesRequest {}

message ListAssigneesResponse {
    repeated Assignee assignees = 1;
}

// GetTicketStats

message GetTicketStatsRequest {
    TicketFilter filter = 1;
}

message GetTicketStatsResponse {
    int32 open_count        = 1;
    int32 in_progress_count = 2;
    int32 on_hold_count     = 3;
    int32 sent_to_vendor_count = 4;
    int32 completed_count   = 5;
    int32 unassigned_count  = 6;
    int32 urgent_count      = 7;
    int32 overdue_count     = 8;
    // Average age in hours for non-completed tickets.
    double avg_age_hours    = 9;
}

// Physical equipment picker scoped by maintenance permissions.
message ListTicketAssetOptionsRequest {
 repeated int64 site_ids = 1 [(buf.validate.field).repeated.items.int64.gt = 0];
 string search = 2 [(buf.validate.field).string.max_len = 256];
 // For triage, list the physical boards installed in the ticket's modules
 // when it opened, including boards subsequently removed or moved.
 optional int64 ticket_id = 3 [(buf.validate.field).int64.gt = 0];
 optional TicketCategory kind = 4 [(buf.validate.field).enum = {defined_only: true, in: [1,3,4]}];
 option (buf.validate.message).cel = {
   id: "ticket_assets.historical_scope"
   message: "ticket history uses its recorded site and hashboard kind rather than picker filters"
   expression: "!has(this.ticket_id) || (this.site_ids.size() == 0 && !has(this.kind))"
 };
}
message ListTicketAssetOptionsResponse { repeated TicketAsset assets = 1; }

// Evidence belongs to the original physical target. Replacement links retain
// both identities and never rewrite the original snapshot.
message UpdateTicketTargetRequest {
 option (buf.validate.message).cel = {
   id: "target.module_replacement_context"
   message: "module replacement requires a module target"
   expression: "this.kind == 3 || (!has(this.replacement_module_id) && !has(this.replacement_module_model) && !this.clear_replacement_module)"
 };
 option (buf.validate.message).cel = {
   id: "target.hashboard_replacement_context"
   message: "board replacement requires a hashboard target"
   expression: "this.kind == 4 || (!has(this.replacement_hashboard_id) && !this.clear_replacement_hashboard)"
 };
 option (buf.validate.message).cel = {
   id: "target.module_model_context"
   message: "module model requires a module or hashboard target"
   expression: "!has(this.module_model) || this.kind in [3, 4]"
 };
 option (buf.validate.message).cel = {
   id: "target.replacement_model_context"
   message: "replacement model requires a replacement module"
   expression: "!has(this.replacement_module_model) || has(this.replacement_module_id)"
 };
 option (buf.validate.message).cel = {
   id: "target.clear_module_conflict"
   message: "replacement module cannot be set and cleared together"
   expression: "!this.clear_replacement_module || (!has(this.replacement_module_id) && !has(this.replacement_module_model))"
 };
 option (buf.validate.message).cel = {
   id: "target.clear_hashboard_conflict"
   message: "replacement hashboard cannot be set and cleared together"
   expression: "!this.clear_replacement_hashboard || !has(this.replacement_hashboard_id)"
 };
 int64 ticket_id = 1 [(buf.validate.field).int64.gt = 0];
 TicketCategory kind = 2 [(buf.validate.field).enum = {defined_only: true, in: [1,3,4]}];
 int64 asset_id = 3 [(buf.validate.field).int64.gt = 0];
 google.protobuf.Timestamp expected_updated_at = 4 [(buf.validate.field).required = true];
 optional string diagnosis = 5 [(buf.validate.field).string.max_len = 4096];
 optional string warranty_evidence = 6 [(buf.validate.field).string.max_len = 4096];
 optional string repair_outcome = 7 [(buf.validate.field).string.max_len = 4096];
 optional string rma_outcome = 8 [(buf.validate.field).string.max_len = 4096];
 // Actual module hardware model, recorded by the host when upstream has none.
 optional string module_model = 9 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
 optional int64 replacement_module_id = 10 [(buf.validate.field).int64.gt = 0];
 optional string replacement_module_model = 11 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
 optional int64 replacement_hashboard_id = 12 [(buf.validate.field).int64.gt = 0];
 // Omitted replacement IDs preserve links; these flags remove the corresponding link.
 bool clear_replacement_module = 13;
 bool clear_replacement_hashboard = 14;
}
message UpdateTicketTargetResponse { RepairTicket ticket = 1; }

message ShareRepairTicketRequest {
    int64 ticket_id = 1 [(buf.validate.field).int64.gt = 0];
    google.protobuf.Timestamp expected_updated_at = 2 [(buf.validate.field).required = true];
}
message ShareRepairTicketResponse { RepairTicket ticket = 1; }
message SetTicketCommentVisibilityRequest {
    int64 ticket_id = 1 [(buf.validate.field).int64.gt = 0];
    int64 comment_id = 2 [(buf.validate.field).int64.gt = 0];
    // True hides a host note; false exposes it to the ticket audience.
    optional bool internal = 3 [(buf.validate.field).required = true];
    google.protobuf.Timestamp expected_updated_at = 4 [(buf.validate.field).required = true];
}
message SetTicketCommentVisibilityResponse {}
