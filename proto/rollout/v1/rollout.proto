syntax = "proto3";

package rollout.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Firmware release channels and the rollouts that enforce them.
//
// A release channel is a set of miners described by a scope (sites,
// buildings, racks, groups and/or individual miners), resolved live against
// current fleet placement. Members are grouped by hardware manufacturer and
// model, and each manufacturer/model pair may have one firmware version
// assigned. Once assigned, the server enforces it: any member of that pair not
// matching the assignment is updated, paced by the channel's update behavior.
// Each enforcement run for one (channel, manufacturer, model) tuple is tracked
// as a rollout.
//
// Exclusive membership resolution: a miner belongs to at most one channel,
// and channels whose scopes would overlap cannot be saved. If fleet changes
// later create an overlap, the channel with the unique highest-specificity
// match (miner, group, rack, building, site) wins and lower-specificity
// channels lose. If channels tie at the highest specificity, the miner belongs
// to none until the conflict is removed. Query every matching channel in
// either overlap with ListReleaseChannelMembershipConflicts.
//
// Artifact-protection invariant: firmware artifact target metadata is frozen
// and artifacts are deletion-protected across service boundaries while a file
// id is a current channel assignment, an active rollout target, a finished
// rollout target that remains retryable because it still matches the current
// assignment, a previous_firmware_file_id retained in rollout history available
// to RollbackReleaseChannelFirmware, or a firmware command reference from
// enqueue until terminal state. The firmware service must fail with
// FAILED_PRECONDITION rather than delete such a file or change its target
// manufacturer, target model, or firmware version. Clearing an assignment,
// rolling back its first rollout, or deleting its channel may release assignment
// or history references, but never a command reference.
// Commands already sent may finish under existing cancellation semantics; this
// invariant adds no cancellation behavior. Non-target descriptive metadata may
// remain editable when it cannot affect dispatch or convergence.
//
// Managed-deployment provenance is the file id from the last successful
// Fleet-managed deployment, recorded after the miner reports its target
// version. It is historical, not current-device artifact attestation. Without
// a current checksum or file identity, Fleet cannot detect a same-version
// out-of-band, vendor, or manual replacement, and such a replacement does not
// change this provenance.
//
// "Rollout" is the engine's name; operator-facing copy calls it a firmware
// update.
service RolloutService {
    // Lists scope-free release channel summaries with aggregate miner and
    // manufacturer/model group counts, using bounded cursor pagination. Use
    // GetReleaseChannel to retrieve a scope.
    rpc ListReleaseChannels(ListReleaseChannelsRequest) returns (ListReleaseChannelsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Returns one release channel, including its scope and aggregate miner and
    // manufacturer/model group counts.
    rpc GetReleaseChannel(GetReleaseChannelRequest) returns (GetReleaseChannelResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Lists a channel's manufacturer/model groups sorted by manufacturer then
    // model, including firmware assignments and active rollout ids, with
    // bounded cursor pagination.
    rpc ListReleaseChannelModelGroups(ListReleaseChannelModelGroupsRequest) returns (ListReleaseChannelModelGroupsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Lists the miners currently resolved into a channel, optionally filtered
    // by manufacturer and model, with bounded cursor pagination.
    rpc ListReleaseChannelMiners(ListReleaseChannelMinersRequest) returns (ListReleaseChannelMinersResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Lists one flat relation per matching channel for every current overlap.
    // Each relation includes its ReleaseChannelConflictResolution. Results
    // include every relation unless filtered by channel id, with bounded cursor
    // pagination.
    rpc ListReleaseChannelMembershipConflicts(ListReleaseChannelMembershipConflictsRequest) returns (ListReleaseChannelMembershipConflictsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Creates a release channel. Fails when the scope overlaps another
    // channel's.
    rpc CreateReleaseChannel(CreateReleaseChannelRequest) returns (CreateReleaseChannelResponse);

    // Replaces a channel's name, description, scope and update behavior.
    // Behavior changes apply to rollouts started afterwards; a rollout in
    // flight keeps the behavior it started with.
    rpc UpdateReleaseChannel(UpdateReleaseChannelRequest) returns (UpdateReleaseChannelResponse);

    // Deletes a channel with its assignments and rollout history. Miners keep
    // their running firmware. Assignment and history references are released
    // only as specified by the RolloutService artifact-protection invariant.
    rpc DeleteReleaseChannel(DeleteReleaseChannelRequest) returns (DeleteReleaseChannelResponse);

    // Resolves a scope without saving it: how many miners it covers per
    // manufacturer/model pair, and which existing channels it would overlap.
    rpc PreviewReleaseChannelScope(PreviewReleaseChannelScopeRequest) returns (PreviewReleaseChannelScopeResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Atomically replaces per-manufacturer/model firmware assignments. For each
    // changed assignment with mismatched members, it starts a rollout paced by
    // the channel's behavior. A member matches only when it reports the target
    // version and its RolloutService managed-deployment provenance equals the
    // assigned firmware_file_id; empty or different provenance is mismatched.
    // FirmwareAssignment.firmware_file_id defines the detailed artifact metadata
    // and identity constraints. Any violation fails with FAILED_PRECONDITION
    // before any assignment changes or rollouts start. An empty file id clears
    // the assignment; its reference effects follow the RolloutService
    // artifact-protection invariant. Direct firmware uploads are outside this
    // contract.
    rpc ApplyReleaseChannelFirmware(ApplyReleaseChannelFirmwareRequest) returns (ApplyReleaseChannelFirmwareResponse);

    // Reverses the referenced rollout's firmware assignment. Before canceling
    // any rollout, changing an assignment, or starting a rollout, the referenced
    // rollout's channel, canonical manufacturer/model pair, and target
    // firmware_file_id must match the channel's current assignment. If any
    // differs, the RPC fails with FAILED_PRECONDITION and makes no changes.
    // When all match, rollback atomically cancels any active rollout for the
    // tuple. A first rollout clears the assignment and starts no rollout; a
    // later rollout restores its previous assignment and starts at most one
    // all-at-once rollout for mismatched members. Released references, enqueued
    // commands, and commands already sent remain governed by the RolloutService
    // artifact-protection invariant and existing cancellation semantics.
    rpc RollbackReleaseChannelFirmware(RollbackReleaseChannelFirmwareRequest) returns (RollbackReleaseChannelFirmwareResponse);

    // Lists rollout summaries (newest first), optionally filtered by channel
    // and status, and paged with a cursor.
    rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Returns one rollout summary with live aggregate evidence.
    rpc GetRollout(GetRolloutRequest) returns (GetRolloutResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Lists live per-device progress for one rollout with bounded cursor
    // pagination.
    rpc ListRolloutDevices(ListRolloutDevicesRequest) returns (ListRolloutDevicesResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Releases the review gate of a staged rollout: the next batch starts,
    // or the remaining miners when the last batch was under review.
    rpc ContinueRollout(ContinueRolloutRequest) returns (ContinueRolloutResponse);

    // Pauses an active rollout: no new update commands are sent and no stage
    // transitions happen until it is resumed. Commands already sent finish.
    rpc PauseRollout(PauseRolloutRequest) returns (PauseRolloutResponse);

    // Resumes a paused rollout where it left off.
    rpc ResumeRollout(ResumeRolloutRequest) returns (ResumeRolloutResponse);

    // Cancels the remaining work of an active rollout. No new update commands
    // are sent. Commands already sent may finish under existing cancellation
    // semantics; their artifacts follow the RolloutService artifact-protection
    // invariant. Miners already updated, including by a command that finishes
    // after cancellation, keep the new firmware; miners with no command sent
    // are left alone and are not picked up again until the assignment changes
    // or their updates are retried.
    rpc CancelRollout(CancelRolloutRequest) returns (CancelRolloutResponse);

    // Re-queues the miners that failed (or were canceled) in a rollout. An
    // active rollout retries them in place. A finished rollout starts a new
    // all-at-once rollout only when its manufacturer/model target and firmware
    // file still equal the channel's current assignment.
    //
    // Rollouts canceled as SUPERSEDED, ROLLED_BACK, or CLEARED are never
    // retryable. A rollout canceled as CANCELED_REMAINING is retryable only
    // while its target remains current. Otherwise this RPC fails with
    // FAILED_PRECONDITION; it never implicitly retargets to different firmware.
    rpc RetryFailedRolloutDevices(RetryFailedRolloutDevicesRequest) returns (RetryFailedRolloutDevicesResponse);
}

// --- Release channels ---

// Which miners a channel applies to. Every dimension is a union; a miner is
// in the channel when any selector matches its current placement.
message ReleaseChannelScope {
    repeated int64 site_ids = 1 [(buf.validate.field).repeated = {max_items: 100, items: {int64: {gt: 0}}}];
    repeated int64 building_ids = 2 [(buf.validate.field).repeated = {max_items: 100, items: {int64: {gt: 0}}}];
    repeated int64 rack_ids = 3 [(buf.validate.field).repeated = {max_items: 500, items: {int64: {gt: 0}}}];
    repeated int64 group_ids = 4 [(buf.validate.field).repeated = {max_items: 100, items: {int64: {gt: 0}}}];
    // Individual miners by device identifier. Identifiers are matched against
    // stored text, which cannot contain U+0000.
    repeated string device_identifiers = 5 [(buf.validate.field).repeated = {max_items: 10000, items: {string: {min_len: 1, max_len: 255, not_contains: "\x00"}}}];
}

// How a rollout distributes the update across its targets.
enum RolloutMethod {
    ROLLOUT_METHOD_UNSPECIFIED = 0;
    // One ungated REST stage for every mismatched miner, with no batching,
    // waits, or review gates. This does not guarantee simultaneous command
    // dispatch or bypass RolloutBehavior.max_concurrent_offline.
    ROLLOUT_METHOD_ALL_AT_ONCE = 1;
    // Multiple batches of batch_size, optionally reviewed after each one;
    // late joiners follow once the batches are done.
    ROLLOUT_METHOD_BATCHED = 2;
    // A pilot batch of pilot_size, a review gate, then the remaining miners.
    ROLLOUT_METHOD_PILOT_THEN_CONTINUE = 3;
}

// Order miners are worked through in a paced rollout. Meaningless for
// ALL_AT_ONCE.
enum RolloutOrder {
    ROLLOUT_ORDER_UNSPECIFIED = 0;
    // Miners with the worst efficiency (highest J/TH) go first; miners with
    // no recent sample go last.
    ROLLOUT_ORDER_LEAST_EFFICIENT_FIRST = 1;
    ROLLOUT_ORDER_RANDOM = 2;
}

// Aggregate telemetry limits a reviewed batch must satisfy for the rollout
// to continue without an operator. An unset limit is not checked.
//
// Coverage rule: a set telemetry limit is judged against the RolloutEvidence
// aggregate for its metric and fails closed. It passes only when that
// aggregate samples at least one miner and at least
// min_sample_coverage_percent of the verified miners under review; otherwise
// the gate holds and hold_reason names the metric. An absent aggregate is
// never treated as zero change.
message RolloutAutomationThresholds {
    // Largest acceptable aggregate hashrate drop versus baseline, percent.
    // Judged against RolloutEvidence.hash_rate_hs.
    optional double max_hashrate_drop_percent = 1 [(buf.validate.field).double = {gte: 0, lte: 100}];
    // Largest acceptable mean efficiency (J/TH) increase versus baseline,
    // percent. Judged against RolloutEvidence.efficiency_jh.
    optional double max_efficiency_increase_percent = 2 [(buf.validate.field).double = {gte: 0}];
    // Largest acceptable mean temperature increase versus baseline, °C.
    // Judged against RolloutEvidence.temp_c.
    optional double max_temperature_increase_celsius = 3 [(buf.validate.field).double = {gte: 0}];
    // Largest acceptable number of errors opened since baseline, summed over
    // the batch. Error counts cover every miner, so no coverage rule applies.
    optional int32 max_new_errors = 4 [(buf.validate.field).int32 = {gte: 0}];
    // Minimum share of verified miners under review that an aggregate must
    // sample before the limit for its metric can pass. Defaults to 100 when
    // unset.
    optional double min_sample_coverage_percent = 5 [(buf.validate.field).double = {gt: 0, lte: 100}];
}

// How updates started in a channel are staged and dispatched. Stored on the
// channel and copied onto each rollout when it starts.
message RolloutBehavior {
    option (buf.validate.message).cel = {
        id: "batch_size_required_for_batched"
        message: "batch_size must be at least 1 for BATCHED"
        expression: "this.method != 2 || this.batch_size > 0"
    };
    option (buf.validate.message).cel = {
        id: "pilot_size_required_for_pilot"
        message: "pilot_size must be at least 1 for PILOT_THEN_CONTINUE"
        expression: "this.method != 3 || this.pilot_size > 0"
    };

    // Defaults to ALL_AT_ONCE when unspecified.
    RolloutMethod method = 1 [(buf.validate.field).enum.defined_only = true];
    // Paced methods only; defaults to LEAST_EFFICIENT_FIRST.
    RolloutOrder order = 2 [(buf.validate.field).enum.defined_only = true];
    // BATCHED: miners per batch (>= 1).
    int32 batch_size = 3 [(buf.validate.field).int32 = {gte: 0}];
    // PILOT_THEN_CONTINUE: miners in the pilot batch (>= 1).
    int32 pilot_size = 4 [(buf.validate.field).int32 = {gte: 0}];
    // BATCHED without review: pause between one batch finishing and the
    // next starting.
    int32 wait_between_batches_seconds = 5 [(buf.validate.field).int32 = {gte: 0}];
    // BATCHED: hold at a review gate after every batch. The pilot method
    // always gates after the pilot.
    bool review_after_each_batch = 6;
    // Release a gate automatically once the DONE count and failed-device
    // checks pass, every set threshold passes under the
    // RolloutAutomationThresholds coverage rule, and stabilization_seconds
    // has elapsed.
    bool auto_continue_on_healthy_telemetry = 7;
    // How long a verified batch must hold at the gate before it can
    // auto-continue, so post-update telemetry has settled.
    int32 stabilization_seconds = 8 [(buf.validate.field).int32 = {gte: 0}];
    RolloutAutomationThresholds thresholds = 9;
    // Per-rollout safety budget across every rollout method, including
    // ALL_AT_ONCE. Each distinct target consumes at most one slot when it is
    // observed offline, regardless of phase or whether the update caused the
    // outage, or when a slot has been reserved immediately before dispatch.
    // A reservation or offline slot is released only after that target is next
    // observed online; becoming EXCLUDED, FAILED, or otherwise terminal does
    // not release an offline slot. Dispatch pauses while this nonzero budget is
    // full. Cancellation ends all further dispatch, so residual slots no
    // longer affect that canceled rollout; it does not waive offline state.
    // 0 is unlimited.
    int32 max_concurrent_offline = 10 [(buf.validate.field).int32 = {gte: 0}];
}

// A release channel with its scope and aggregate member counts.
message ReleaseChannel {
    int64 id = 1;
    string name = 2 [(buf.validate.field).string.max_len = 100];
    string description = 3 [(buf.validate.field).string.max_len = 1000];
    ReleaseChannelScope scope = 4;
    RolloutBehavior behavior = 5;
    // Total manufacturer/model groups, including assigned pairs with no
    // current members. Retrieve details with ListReleaseChannelModelGroups.
    int32 model_group_count = 6 [(buf.validate.field).int32.gte = 0];
    int32 miner_count = 7 [(buf.validate.field).int32.gte = 0];
    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
}

// Scope-free release channel details with aggregate member counts.
message ReleaseChannelSummary {
    int64 id = 1;
    string name = 2 [(buf.validate.field).string.max_len = 100];
    string description = 3 [(buf.validate.field).string.max_len = 1000];
    RolloutBehavior behavior = 4;
    int32 miner_count = 6 [(buf.validate.field).int32.gte = 0];
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
    // Total manufacturer/model groups, including assigned pairs with no
    // current members. Retrieve details with ListReleaseChannelModelGroups.
    int32 model_group_count = 9 [(buf.validate.field).int32.gte = 0];
}

// Summary for one observed manufacturer/model pair in a channel, including
// its member count and firmware assignment. The observed manufacturer and
// model are returned verbatim and are separate from the canonical target keys
// used for firmware assignment.
message ReleaseChannelModelGroup {
    option (buf.validate.message).cel = {
        id: "reported_version_count_covers_returned_versions"
        message: "reported_version_count must be at least the number of reported_versions"
        expression: "this.reported_version_count >= this.reported_versions.size()"
    };
    option (buf.validate.message).cel = {
        id: "on_target_count_within_miner_count"
        message: "on_target_count must not exceed miner_count"
        expression: "this.on_target_count <= this.miner_count"
    };
    option (buf.validate.message).cel = {
        id: "firmware_assignment_is_absent_or_complete"
        message: "firmware assignment fields must be absent or include canonical target manufacturer/model keys and firmware_version"
        expression: "(this.firmware_file_id == '' && this.firmware_target_manufacturer == '' && this.firmware_target_model == '' && this.firmware_version == '') || (this.firmware_file_id != '' && this.firmware_target_manufacturer.matches('^[!-~](?:[ -~]*[!-~])?$') && this.firmware_target_model.matches('^[!-~](?:[ -~]*[!-~])?$') && this.firmware_version != '')"
    };

    // Observed manufacturer returned verbatim. May contain non-ASCII,
    // whitespace, or control characters; empty means unknown.
    string manufacturer = 1 [(buf.validate.field).string.max_len = 255];
    // Observed model returned verbatim. May contain non-ASCII, whitespace, or
    // control characters; empty means unknown.
    string model = 2 [(buf.validate.field).string.max_len = 255];
    // Current assignment for this target pair; empty when none. Its artifact
    // reference follows the RolloutService artifact-protection invariant.
    string firmware_file_id = 3 [(buf.validate.field).string.max_len = 255];
    // Target firmware version; empty when no firmware is assigned.
    string firmware_version = 4 [(buf.validate.field).string = {max_len: 255, not_contains: "\x00"}];
    int32 miner_count = 5 [(buf.validate.field).int32.gte = 0];
    // Id of the active rollout for this firmware target pair, 0 if none.
    int64 active_rollout_id = 6 [(buf.validate.field).int64.gte = 0];
    // Members reporting the assigned version whose RolloutService
    // managed-deployment provenance equals firmware_file_id; 0 when unassigned.
    int32 on_target_count = 7 [(buf.validate.field).int32.gte = 0];
    // The first 10 sorted distinct firmware versions members currently report.
    // Lets a client show "1.0.0 -> 2.0.0" or "Mixed -> 2.0.0" without listing
    // miners.
    repeated string reported_versions = 8 [(buf.validate.field).repeated = {
        max_items: 10
        unique: true
        items: { string: {max_len: 255} }
    }];
    // Total distinct reported versions before reported_versions is truncated.
    // A value greater than the length of reported_versions means truncation.
    int32 reported_version_count = 9 [(buf.validate.field).int32.gte = 0];
    // Canonical printable-ASCII manufacturer assignment key with no
    // surrounding spaces. Empty when no firmware is assigned.
    string firmware_target_manufacturer = 10 [(buf.validate.field).string.max_len = 255];
    // Canonical printable-ASCII model assignment key with no surrounding
    // spaces. Empty when no firmware is assigned.
    string firmware_target_model = 11 [(buf.validate.field).string.max_len = 255];
}

// A miner resolved into a release channel. Observed identities up to 255
// characters are returned verbatim and may contain non-ASCII, whitespace, or
// control characters; an empty manufacturer or model means the miner's
// identity is unknown.
message ReleaseChannelMiner {
    int64 device_id = 1;
    string device_identifier = 2 [(buf.validate.field).string.max_len = 255];
    string manufacturer = 3 [(buf.validate.field).string.max_len = 255];
    string model = 4 [(buf.validate.field).string.max_len = 255];
    // Firmware version the miner currently reports.
    string firmware_version = 5 [(buf.validate.field).string.max_len = 255];
    // Set when the miner belongs to this channel but also matches another under
    // the RolloutService membership rule. Query all matching relations with
    // ListReleaseChannelMembershipConflicts.
    bool conflicted = 6;
    // Managed-deployment provenance as defined by RolloutService; empty when no
    // qualifying Fleet-managed deployment is recorded.
    string last_deployed_firmware_file_id = 7 [(buf.validate.field).string.max_len = 255];
}

// Selector specificity, ordered from most specific to least specific.
enum ReleaseChannelSelectorSpecificity {
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_UNSPECIFIED = 0;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_MINER = 1;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_GROUP = 2;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_RACK = 3;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_BUILDING = 4;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_SITE = 5;
}

// How one matching channel is resolved when a miner matches multiple channels.
enum ReleaseChannelConflictResolution {
    RELEASE_CHANNEL_CONFLICT_RESOLUTION_UNSPECIFIED = 0;
    // The unique highest-specificity channel to which the miner belongs.
    RELEASE_CHANNEL_CONFLICT_RESOLUTION_WINNER = 1;
    // A lower-specificity channel to which the miner does not belong.
    RELEASE_CHANNEL_CONFLICT_RESOLUTION_LOSER = 2;
    // A channel tied at the highest specificity; the miner belongs to none.
    RELEASE_CHANNEL_CONFLICT_RESOLUTION_EXCLUDED_TIE = 3;
}

// One miner/channel relation for a miner matched by multiple channels. The
// resolution field is the outcome of the RolloutService membership rule.
// Observed identities up to 255 characters are returned verbatim and may
// contain non-ASCII, whitespace, or control characters; an empty manufacturer
// or model means the miner's identity is unknown.
message ReleaseChannelMembershipConflict {
    int64 device_id = 1;
    string device_identifier = 2 [(buf.validate.field).string.max_len = 255];
    string manufacturer = 3 [(buf.validate.field).string.max_len = 255];
    string model = 4 [(buf.validate.field).string.max_len = 255];
    int64 channel_id = 5;
    string channel_name = 6 [(buf.validate.field).string.max_len = 100];
    ReleaseChannelSelectorSpecificity selector_specificity = 7 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
    }];
    ReleaseChannelConflictResolution resolution = 8 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
    }];
}

// Desired firmware for one manufacturer/model pair within a channel.
message FirmwareAssignment {
    string manufacturer = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    // Firmware file to enforce for this pair. A nonempty id must identify an
    // immutable payload with complete target metadata: nonempty target
    // manufacturer and target model, plus a firmware version of 1..255 Unicode
    // code points; none may contain U+0000, which stored text cannot hold.
    // The normalized metadata target must match this normalized
    // assignment target. One normalized manufacturer/model/version tuple
    // identifies exactly one release-channel firmware file: reusing its id is
    // valid, but using another id for the tuple is not.
    // ApplyReleaseChannelFirmware defines atomic validation and failure
    // behavior. Convergence uses the RolloutService managed-deployment
    // provenance, and artifact references follow its artifact-protection
    // invariant. Empty clears the assignment.
    string firmware_file_id = 3 [(buf.validate.field).string.max_len = 255];
}

// --- Rollouts ---

// Aggregate rollout lifecycle. Per-device DONE criteria, including managed
// deployment provenance, are defined by RolloutDevicePhase.DONE.
enum RolloutStatus {
    ROLLOUT_STATUS_UNSPECIFIED = 0;
    // The rollout is enforcing its firmware version.
    ROLLOUT_STATUS_ACTIVE = 1;
    // A non-canceled rollout completes successfully when every target is DONE
    // or EXCLUDED. EXCLUDED is neutral; aggregate telemetry does not affect this
    // terminal status.
    ROLLOUT_STATUS_COMPLETED = 2;
    // A non-canceled rollout completes with failures when every target is DONE,
    // FAILED, or EXCLUDED and at least one target is FAILED. EXCLUDED is neutral.
    ROLLOUT_STATUS_COMPLETED_WITH_FAILURES = 3;
    // Ended by explicit cancellation, supersession, assignment clearing, or
    // rollback; see cancel_reason. Cancellation takes precedence over device
    // phases, so a canceled rollout remains CANCELED even when targets are
    // terminal.
    ROLLOUT_STATUS_CANCELED = 4;
}

// Why a rollout was canceled.
enum RolloutCancelReason {
    ROLLOUT_CANCEL_REASON_UNSPECIFIED = 0;
    // A newer assignment replaced it.
    ROLLOUT_CANCEL_REASON_SUPERSEDED = 1;
    // An operator canceled the remaining updates.
    ROLLOUT_CANCEL_REASON_CANCELED_REMAINING = 2;
    // An operator rolled the manufacturer/model pair back to an earlier version.
    ROLLOUT_CANCEL_REASON_ROLLED_BACK = 3;
    // The manufacturer/model pair's assignment was cleared.
    ROLLOUT_CANCEL_REASON_CLEARED = 4;
}

// Progress of a staged rollout. ALL_AT_ONCE remains in one ungated REST stage;
// REST does not imply simultaneous dispatch. Every stage obeys
// RolloutBehavior.max_concurrent_offline.
enum RolloutStage {
    ROLLOUT_STAGE_UNSPECIFIED = 0;
    // Updating the current batch only.
    ROLLOUT_STAGE_BATCH = 1;
    // The current batch is done; holding for a review (manual continue, or
    // automatic once the configured aggregate telemetry thresholds are met).
    ROLLOUT_STAGE_AWAITING_REVIEW = 2;
    // The current batch is done; waiting wait_between_batches_seconds
    // before the next one starts.
    ROLLOUT_STAGE_WAITING = 3;
    // Updating all remaining targets with no further waits or review gates,
    // subject to RolloutBehavior.max_concurrent_offline.
    ROLLOUT_STAGE_REST = 4;
}

// Operator-facing lifecycle state, derived from status, stage and pause.
enum RolloutState {
    ROLLOUT_STATE_UNSPECIFIED = 0;
    ROLLOUT_STATE_IN_PROGRESS = 1;
    // At a gate that will auto-continue once the stabilization period
    // elapses and aggregate telemetry remains within configured thresholds.
    ROLLOUT_STATE_STABILIZING_TELEMETRY = 2;
    // At the gate after the pilot batch, waiting for an operator.
    ROLLOUT_STATE_PAUSED_AT_PILOT_GATE = 3;
    // At the gate after a batch, waiting for an operator.
    ROLLOUT_STATE_PAUSED_AT_BATCH_REVIEW = 4;
    // Paused by an operator.
    ROLLOUT_STATE_PAUSED = 5;
    ROLLOUT_STATE_COMPLETED = 6;
    ROLLOUT_STATE_COMPLETED_WITH_FAILURES = 7;
    ROLLOUT_STATE_CANCELED = 8;
}

// Per-miner phase within a rollout.
enum RolloutDevicePhase {
    ROLLOUT_DEVICE_PHASE_UNSPECIFIED = 0;
    // No update command sent yet.
    ROLLOUT_DEVICE_PHASE_QUEUED = 1;
    // First update command sent; the miner has not verified yet.
    ROLLOUT_DEVICE_PHASE_IN_PROGRESS = 2;
    // The first attempt did not take; the update was re-sent.
    ROLLOUT_DEVICE_PHASE_RETRYING = 3;
    // Meets every convergence criterion: reports the target version; its
    // RolloutService managed-deployment provenance equals the rollout's
    // firmware_file_id; is online; and is hashing when baseline_hashing is true
    // or has_baseline is false. A miner with a non-hashing baseline need not be
    // hashing. Per-device telemetry deltas do not affect this phase.
    ROLLOUT_DEVICE_PHASE_DONE = 4;
    // Attempts exhausted, or the rollout was canceled before this miner
    // updated. Retried only by RetryFailedRolloutDevices. Offline accounting
    // follows RolloutBehavior.max_concurrent_offline.
    ROLLOUT_DEVICE_PHASE_FAILED = 5;
    // Neutral terminal settlement for a target that left the channel's scope;
    // no further rollout work is performed for it. It does not count as a
    // failure or decide aggregate status. Offline accounting follows
    // RolloutBehavior.max_concurrent_offline.
    ROLLOUT_DEVICE_PHASE_EXCLUDED = 6;
}

// A telemetry metric before the update (baseline, captured when the miner
// was snapshotted into the rollout) and now. A missing half means no sample
// was available.
message MetricComparison {
    optional double baseline = 1;
    optional double current = 2;
}

// One telemetry metric aggregated over the verified miners under review that
// have both halves. Both halves are present exactly when at least one miner
// is sampled, so an absent aggregate is never mistaken for zero change.
message AggregateMetricComparison {
    option (buf.validate.message).cel = {
        id: "aggregate_present_iff_sampled"
        message: "baseline and current must both be set when sampled_devices is positive and unset otherwise"
        expression: "(has(this.baseline) && has(this.current)) == (this.sampled_devices > 0)"
    };

    optional double baseline = 1;
    optional double current = 2;
    // Miners with both halves that contribute to this aggregate.
    int32 sampled_devices = 3 [(buf.validate.field).int32.gte = 0];
}

// Per-phase miner counts for a rollout or for one of its batches.
message RolloutDeviceCounts {
    int32 queued = 1 [(buf.validate.field).int32.gte = 0];
    int32 in_progress = 2 [(buf.validate.field).int32.gte = 0];
    int32 retrying = 3 [(buf.validate.field).int32.gte = 0];
    int32 done = 4 [(buf.validate.field).int32.gte = 0];
    int32 failed = 5 [(buf.validate.field).int32.gte = 0];
    // Neutral terminal targets; kept distinct from done and failed.
    int32 excluded = 6 [(buf.validate.field).int32.gte = 0];
}

// Post-update evidence for the miners under review: the batch at the gate
// (or in flight), or every target in the rest stage. Compared against each
// miner's own baseline.
message RolloutEvidence {
    option (buf.validate.message).cel = {
        id: "evidence_counts_within_devices_total"
        message: "verified plus failed, online, hashing, and baseline_hashing must not exceed devices_total"
        expression: "this.verified + this.failed <= this.devices_total && this.online <= this.devices_total && this.hashing <= this.devices_total && this.baseline_hashing <= this.devices_total"
    };
    option (buf.validate.message).cel = {
        id: "aggregate_coverage_within_verified"
        message: "an aggregate may sample at most the verified miners"
        expression: "this.hash_rate_hs.sampled_devices <= this.verified && this.power_w.sampled_devices <= this.verified && this.efficiency_jh.sampled_devices <= this.verified && this.temp_c.sampled_devices <= this.verified"
    };
    option (buf.validate.message).cel = {
        id: "derived_changes_require_samples"
        message: "a derived change must be unset when its aggregate samples no miners"
        expression: "(!has(this.hashrate_change_percent) || this.hash_rate_hs.sampled_devices > 0) && (!has(this.efficiency_change_percent) || this.efficiency_jh.sampled_devices > 0) && (!has(this.temperature_change_celsius) || this.temp_c.sampled_devices > 0)"
    };

    int32 devices_total = 1 [(buf.validate.field).int32.gte = 0];
    // Miners in the DONE phase. Per-device telemetry deltas do not affect
    // this count.
    int32 verified = 2 [(buf.validate.field).int32.gte = 0];
    int32 online = 3 [(buf.validate.field).int32.gte = 0];
    int32 hashing = 4 [(buf.validate.field).int32.gte = 0];
    // How many of these miners were hashing before the update.
    int32 baseline_hashing = 5 [(buf.validate.field).int32.gte = 0];
    int32 failed = 6 [(buf.validate.field).int32.gte = 0];
    // Aggregate hashrate change versus baseline, percent (negative is a
    // drop). Unset when hash_rate_hs samples no miners.
    optional double hashrate_change_percent = 7;
    // Mean efficiency change versus baseline, percent (positive is worse).
    // Unset when efficiency_jh samples no miners.
    optional double efficiency_change_percent = 8;
    // Mean temperature change versus baseline, °C. Unset when temp_c samples
    // no miners.
    optional double temperature_change_celsius = 9;
    // Errors opened since baseline, summed over the batch (never below 0).
    int32 new_errors = 10 [(buf.validate.field).int32.gte = 0];
    // Whether the DONE count and failed-device checks pass, every set
    // threshold passes under the RolloutAutomationThresholds coverage rule,
    // and stabilization rules permit auto-continue. Always false for rollouts
    // without auto-continue.
    bool ready_to_advance = 11;
    // Why the rollout is holding at the gate when it cannot auto-continue,
    // including which metric lacks the required sample coverage.
    string hold_reason = 12 [(buf.validate.field).string.max_len = 1024];
    // Seconds of stabilization still required before auto-continue.
    int32 stabilization_remaining_seconds = 13 [(buf.validate.field).int32.gte = 0];
    // Aggregates over the verified miners with both halves: total hashrate,
    // total power, mean efficiency, mean temperature. Each reports how many
    // miners it samples so clients and the coverage rule can judge it.
    AggregateMetricComparison hash_rate_hs = 14;
    AggregateMetricComparison power_w = 15;
    AggregateMetricComparison efficiency_jh = 16;
    AggregateMetricComparison temp_c = 17;
}

// A firmware change being enforced for one manufacturer/model pair within one
// channel.
message Rollout {
    int64 id = 1;
    int64 channel_id = 2;
    string channel_name = 3 [(buf.validate.field).string.max_len = 100];
    string manufacturer = 4 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 5 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    // Target artifact governed by the RolloutService artifact-protection
    // invariant.
    string firmware_file_id = 6 [(buf.validate.field).string.max_len = 255];
    string firmware_version = 7 [(buf.validate.field).string = {max_len: 255, not_contains: "\x00"}];
    RolloutStatus status = 8;
    RolloutState state = 9;
    // Stage of a staged rollout; REST for all-at-once rollouts.
    RolloutStage stage = 10;
    RolloutCancelReason cancel_reason = 11;
    // The behavior this rollout runs with (copied from the channel at start).
    RolloutBehavior behavior = 12;
    // Number of snapshotted batches; 0 for all-at-once rollouts.
    int32 batch_count = 13 [(buf.validate.field).int32.gte = 0];
    // 0-based index of the batch in flight or under review.
    int32 current_batch = 14 [(buf.validate.field).int32.gte = 0];
    // When the current stage began.
    google.protobuf.Timestamp stage_changed_at = 15;
    // Set while the rollout is paused.
    google.protobuf.Timestamp paused_at = 16;
    google.protobuf.Timestamp created_at = 17;
    // Set when the rollout completed or was canceled.
    google.protobuf.Timestamp finished_at = 18;
    // Assignment in place before this rollout. Empty marks the pair's first
    // assignment; rollback clears it only while this rollout's target remains
    // current. A nonempty id is restored under the same precondition. This
    // history reference follows the RolloutService artifact-protection
    // invariant.
    string previous_firmware_file_id = 19 [(buf.validate.field).string.max_len = 255];
    // Version of the previous assignment; empty when there was no previous
    // assignment.
    string previous_firmware_version = 20 [(buf.validate.field).string = {max_len: 255, not_contains: "\x00"}];
    // Number of miners snapshotted into the rollout. Retrieve their live
    // progress with ListRolloutDevices.
    int32 device_count = 21 [(buf.validate.field).int32.gte = 0];
    // Evidence for the miners currently under review; unset for rollouts
    // that are not active.
    RolloutEvidence evidence = 22;
    // Per-phase counts over every snapshotted miner; sums to device_count.
    RolloutDeviceCounts device_counts = 23;
    // Per-phase counts over the batch in flight or under review. All zero
    // in the rest stage and for all-at-once rollouts.
    RolloutDeviceCounts current_batch_counts = 24;
}

// Progress of one miner within a rollout.
message RolloutDevice {
    int64 device_id = 1;
    string device_identifier = 2 [(buf.validate.field).string.max_len = 255];
    string ip_address = 3 [(buf.validate.field).string.max_len = 45];
    // Firmware version the miner currently reports.
    string firmware_version = 4 [(buf.validate.field).string.max_len = 255];
    RolloutDevicePhase phase = 5;
    // 1-based batch the miner was snapshotted into; 0 when it is not part of
    // any batch (rest stage / late joiner).
    int32 batch = 6 [(buf.validate.field).int32.gte = 0];
    // Live device status (e.g. ACTIVE, OFFLINE, NEEDS_MINING_POOL).
    string status = 7 [(buf.validate.field).string.max_len = 50];
    bool online = 8;
    bool hashing = 9;
    // False for late joiners with no baseline snapshot; those miners must be
    // currently hashing to reach DONE.
    bool has_baseline = 10;
    // Whether the miner was hashing at baseline. When has_baseline is true,
    // this controls whether current hashing is required to reach DONE.
    bool baseline_hashing = 11;
    int32 open_errors = 12 [(buf.validate.field).int32.gte = 0];
    int32 baseline_open_errors = 13 [(buf.validate.field).int32.gte = 0];
    MetricComparison hash_rate_hs = 14;
    MetricComparison power_w = 15;
    MetricComparison efficiency_jh = 16;
    MetricComparison temp_c = 17;
    // Update commands sent to this miner so far.
    int32 attempts = 18 [(buf.validate.field).int32.gte = 0];
    google.protobuf.Timestamp last_sent_at = 19;
    // Why the miner is FAILED, when known. Device-reported text is truncated
    // to this limit before it is persisted or returned.
    string last_error = 20 [(buf.validate.field).string.max_len = 2048];
    // Managed-deployment provenance as defined by RolloutService; empty when no
    // qualifying Fleet-managed deployment is recorded.
    string last_deployed_firmware_file_id = 21 [(buf.validate.field).string.max_len = 255];
}

// --- Requests / responses ---

message ListReleaseChannelsRequest {
    // Maximum channels to return. 0 uses the server default of 100.
    int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelsResponse {
    repeated ReleaseChannelSummary channels = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page; empty when there are no more channels.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message GetReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message ListReleaseChannelModelGroupsRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Maximum model groups to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
    // Opaque cursor sized for maximum 255-code-point Unicode sort keys and
    // encoding overhead; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 8192];
}

message ListReleaseChannelModelGroupsResponse {
    repeated ReleaseChannelModelGroup model_groups = 1 [(buf.validate.field).repeated.max_items = 100];
    // Opaque cursor sized for maximum 255-code-point Unicode sort keys and
    // encoding overhead; empty when there are no more model groups.
    string cursor = 2 [(buf.validate.field).string.max_len = 8192];
}

message ListReleaseChannelMinersRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Filters match observed identities verbatim up to 255 characters,
    // including non-ASCII, whitespace, and control characters other than
    // U+0000, which stored text cannot contain. Empty filters return every
    // manufacturer/model pair in the channel.
    string manufacturer = 2 [(buf.validate.field).string = {max_len: 255, not_contains: "\x00"}];
    string model = 3 [(buf.validate.field).string = {max_len: 255, not_contains: "\x00"}];
    // Maximum miners to return. 0 uses the server default of 100.
    int32 page_size = 4 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 5 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelMinersResponse {
    repeated ReleaseChannelMiner miners = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page; empty when there are no more miners.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelMembershipConflictsRequest {
    // Only relations for this channel are returned. 0 returns all conflicts
    // in the organization.
    int64 channel_id = 1 [(buf.validate.field).int64.gte = 0];
    // Maximum conflict records to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelMembershipConflictsResponse {
    // Flat records keep the page bounded when one miner matches many channels.
    // Clients may group records by device_id.
    repeated ReleaseChannelMembershipConflict conflicts = 1 [(buf.validate.field).repeated.max_items = 100];
    // Cursor for the next page; empty when there are no more conflicts.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message CreateReleaseChannelRequest {
    string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 100, not_contains: "\x00"}];
    string description = 2 [(buf.validate.field).string = {max_len: 1000, not_contains: "\x00"}];
    ReleaseChannelScope scope = 3;
    RolloutBehavior behavior = 4;
}

message CreateReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message UpdateReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100, not_contains: "\x00"}];
    string description = 3 [(buf.validate.field).string = {max_len: 1000, not_contains: "\x00"}];
    ReleaseChannelScope scope = 4;
    RolloutBehavior behavior = 5;
}

message UpdateReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message DeleteReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteReleaseChannelResponse {}

message PreviewReleaseChannelScopeRequest {
    ReleaseChannelScope scope = 1;
    // When editing, the channel being edited so its own members do not count
    // as conflicts.
    int64 channel_id = 2 [(buf.validate.field).int64.gte = 0];
}

// Miners another channel already covers that the previewed scope would take.
message ReleaseChannelScopeConflict {
    int64 channel_id = 1;
    string channel_name = 2 [(buf.validate.field).string.max_len = 100];
    int32 miner_count = 3;
}

// Aggregate count for one observed hardware identity. Observed identities up
// to 255 characters are returned verbatim and may contain non-ASCII,
// whitespace, or control characters; an empty manufacturer or model means the
// identity is unknown.
message ReleaseChannelScopeModelCount {
    string manufacturer = 1 [(buf.validate.field).string.max_len = 255];
    string model = 2 [(buf.validate.field).string.max_len = 255];
    int32 miner_count = 3;
}

message PreviewReleaseChannelScopeResponse {
    option (buf.validate.message).cel = {
        id: "models_match_bounded_model_count"
        message: "models must contain all entries up to the 100-item limit"
        expression: "this.models.size() == (this.model_count < 100 ? this.model_count : 100)"
    };
    option (buf.validate.message).cel = {
        id: "conflicts_match_bounded_conflict_count"
        message: "conflicts must contain all entries up to the 100-item limit"
        expression: "this.conflicts.size() == (this.conflict_count < 100 ? this.conflict_count : 100)"
    };

    int32 miner_count = 1;
    // The first 100 manufacturer/model pairs sorted by manufacturer then model.
    repeated ReleaseChannelScopeModelCount models = 2 [(buf.validate.field).repeated.max_items = 100];
    // The first 100 conflicts sorted by channel id. Non-empty means the scope
    // cannot be saved as is.
    repeated ReleaseChannelScopeConflict conflicts = 3 [(buf.validate.field).repeated.max_items = 100];
    // Total manufacturer/model pairs before models is truncated. A value
    // greater than the length of models means truncation.
    int32 model_count = 4;
    // Total conflicting channels before conflicts is truncated. A value
    // greater than the length of conflicts means truncation.
    int32 conflict_count = 5;
}

message ApplyReleaseChannelFirmwareRequest {
    option (buf.validate.message).cel = {
        id: "assignments_unique_by_manufacturer_model"
        message: "assignments must contain at most one entry per manufacturer/model pair"
        expression: "this.assignments.size() > 100 || this.assignments.map(a, string(a.manufacturer.size()) + ':' + a.manufacturer.lowerAscii() + a.model.lowerAscii()).unique()"
    };

    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Desired assignments. Manufacturer/model pairs omitted here keep their
    // current assignment. Assignment target identities must be printable ASCII
    // without surrounding spaces and compare ASCII letters case-insensitively.
    repeated FirmwareAssignment assignments = 2 [(buf.validate.field).repeated = {
        min_items: 1
        max_items: 100
    }];
}

message ApplyReleaseChannelFirmwareResponse {
    ReleaseChannel channel = 1;
    // Rollouts started by this call, one per changed manufacturer/model pair
    // with mismatched members.
    repeated Rollout started_rollouts = 2 [(buf.validate.field).repeated.max_items = 100];
}

message RollbackReleaseChannelFirmwareRequest {
    // Rollout whose assignment to reverse. See
    // RollbackReleaseChannelFirmware for its current-target precondition and
    // atomic effects.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message RollbackReleaseChannelFirmwareResponse {
    ReleaseChannel channel = 1;
    // Rollouts started by this call. Empty when the first assignment was
    // cleared or no members mismatch the restored assignment; otherwise
    // contains one all-at-once rollout for those mismatched members.
    repeated Rollout started_rollouts = 2 [(buf.validate.field).repeated.max_items = 1];
}

message ListRolloutsRequest {
    // When set, only rollouts for this channel are returned.
    int64 channel_id = 1 [(buf.validate.field).int64.gte = 0];
    // When set, only rollouts with this status are returned.
    RolloutStatus status = 2 [(buf.validate.field).enum.defined_only = true];
    // Maximum number of rollouts to return. 0 uses the server default of 100.
    int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 4 [(buf.validate.field).string.max_len = 100];
}

message ListRolloutsResponse {
    repeated Rollout rollouts = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page; empty when there are no more rollouts.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message GetRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetRolloutResponse {
    Rollout rollout = 1;
}

message ListRolloutDevicesRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // Maximum devices to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 100];
}

message ListRolloutDevicesResponse {
    repeated RolloutDevice devices = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page; empty when there are no more devices.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message ContinueRolloutRequest {
    // Active staged rollout in the AWAITING_REVIEW stage.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ContinueRolloutResponse {
    Rollout rollout = 1;
}

message PauseRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message PauseRolloutResponse {
    Rollout rollout = 1;
}

message ResumeRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ResumeRolloutResponse {
    Rollout rollout = 1;
}

message CancelRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message CancelRolloutResponse {
    // The canceled rollout.
    Rollout rollout = 1;
    ReleaseChannel channel = 2;
}

message RetryFailedRolloutDevicesRequest {
    // The rollout whose failed (or canceled) miners are retried. Its original
    // target must satisfy the RetryFailedRolloutDevices preconditions; a stale
    // target fails with FAILED_PRECONDITION rather than being retargeted.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message RetryFailedRolloutDevicesResponse {
    // The rollout now carrying the retried miners: the same rollout when it
    // was still active, otherwise a new all-at-once rollout with the eligible
    // finished rollout's unchanged target.
    Rollout rollout = 1;
}
