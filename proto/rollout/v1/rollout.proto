syntax = "proto3";

package rollout.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Firmware release channels and the rollouts that enforce them.
//
// A release channel is a set of miners described by a scope (sites,
// buildings, racks, groups and/or individual miners), resolved live against
// current fleet placement. Members are grouped by hardware manufacturer and
// model, and each manufacturer/model pair may have one firmware version
// assigned. Once assigned, the server enforces it: any member of that pair not
// running the assigned version is updated, paced by the channel's update
// behavior. Each enforcement run for one (channel, manufacturer, model) tuple
// is tracked as a rollout.
//
// A miner belongs to at most one channel. Channels whose scopes would
// overlap cannot be saved. If fleet changes later create an overlap, the
// channel with the unique highest-specificity match (miner, group, rack,
// building, site) wins and reports the miner as conflicted. If multiple
// channels tie at the highest specificity, the miner belongs to none until
// the conflict is removed. Query excluded miners with
// ListReleaseChannelMembershipConflicts.
//
// "Rollout" is the engine's name; operator-facing copy calls it a firmware
// update.
service RolloutService {
    // Lists scope-free release channel summaries with aggregate miner and
    // manufacturer/model group counts, using bounded cursor pagination. Use
    // GetReleaseChannel to retrieve a scope.
    rpc ListReleaseChannels(ListReleaseChannelsRequest) returns (ListReleaseChannelsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Returns one release channel, including its scope and aggregate miner and
    // manufacturer/model group counts.
    rpc GetReleaseChannel(GetReleaseChannelRequest) returns (GetReleaseChannelResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Lists a channel's manufacturer/model groups sorted by manufacturer then
    // model, including firmware assignments and active rollout ids, with
    // bounded cursor pagination.
    rpc ListReleaseChannelModelGroups(ListReleaseChannelModelGroupsRequest) returns (ListReleaseChannelModelGroupsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Lists the miners currently resolved into a channel, optionally filtered
    // by manufacturer and model, with bounded cursor pagination.
    rpc ListReleaseChannelMiners(ListReleaseChannelMinersRequest) returns (ListReleaseChannelMinersResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Lists flat miner/channel relations excluded from membership because
    // multiple channels tie at the miner's highest matching selector
    // specificity. Results include every channel in each tie unless filtered
    // by channel id, with bounded cursor pagination.
    rpc ListReleaseChannelMembershipConflicts(ListReleaseChannelMembershipConflictsRequest) returns (ListReleaseChannelMembershipConflictsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Creates a release channel. Fails when the scope overlaps another
    // channel's.
    rpc CreateReleaseChannel(CreateReleaseChannelRequest) returns (CreateReleaseChannelResponse);

    // Replaces a channel's name, description, scope and update behavior.
    // Behavior changes apply to rollouts started afterwards; a rollout in
    // flight keeps the behavior it started with.
    rpc UpdateReleaseChannel(UpdateReleaseChannelRequest) returns (UpdateReleaseChannelResponse);

    // Deletes a channel with its firmware assignments and rollout history.
    // Miners keep whatever firmware they are running.
    rpc DeleteReleaseChannel(DeleteReleaseChannelRequest) returns (DeleteReleaseChannelResponse);

    // Resolves a scope without saving it: how many miners it covers per
    // manufacturer/model pair, and which existing channels it would overlap.
    rpc PreviewReleaseChannelScope(PreviewReleaseChannelScopeRequest) returns (PreviewReleaseChannelScopeResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Replaces per-manufacturer/model firmware assignments of a channel and
    // starts a rollout, paced by the channel's behavior, for every pair whose
    // assignment changed and has mismatched members.
    rpc ApplyReleaseChannelFirmware(ApplyReleaseChannelFirmwareRequest) returns (ApplyReleaseChannelFirmwareResponse);

    // Restores the firmware assignment that was in place immediately before
    // the referenced rollout. For an A-to-B rollout, this rolls the channel's
    // manufacturer/model group back to A. Any active rollout for the (channel,
    // manufacturer, model) tuple is canceled and a new all-at-once rollout
    // enforces the restored version.
    rpc RollbackReleaseChannelFirmware(RollbackReleaseChannelFirmwareRequest) returns (RollbackReleaseChannelFirmwareResponse);

    // Lists rollout summaries (newest first), optionally filtered by channel
    // and status, and paged with a cursor.
    rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Returns one rollout summary with live aggregate evidence.
    rpc GetRollout(GetRolloutRequest) returns (GetRolloutResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Lists live per-device progress for one rollout with bounded cursor
    // pagination.
    rpc ListRolloutDevices(ListRolloutDevicesRequest) returns (ListRolloutDevicesResponse) {
        option idempotency_level = NO_SIDE_EFFECTS;
    }

    // Releases the review gate of a staged rollout: the next batch starts,
    // or the remaining miners when the last batch was under review.
    rpc ContinueRollout(ContinueRolloutRequest) returns (ContinueRolloutResponse);

    // Pauses an active rollout: no new update commands are sent and no stage
    // transitions happen until it is resumed. Commands already sent finish.
    rpc PauseRollout(PauseRolloutRequest) returns (PauseRolloutResponse);

    // Resumes a paused rollout where it left off.
    rpc ResumeRollout(ResumeRolloutRequest) returns (ResumeRolloutResponse);

    // Cancels the remaining work of an active rollout. Miners already
    // updated keep the new firmware; miners not yet updated are left alone
    // and are not picked up again until the assignment changes or their
    // updates are retried.
    rpc CancelRollout(CancelRolloutRequest) returns (CancelRolloutResponse);

    // Re-queues the miners that failed (or were canceled) in a rollout. An
    // active rollout retries them in place. A finished rollout starts a new
    // all-at-once rollout only when its manufacturer/model target and firmware
    // file still equal the channel's current assignment.
    //
    // Rollouts canceled as SUPERSEDED, ROLLED_BACK, or CLEARED are never
    // retryable. A rollout canceled as CANCELED_REMAINING is retryable only
    // while its target remains current. Otherwise this RPC fails with
    // FAILED_PRECONDITION; it never implicitly retargets to different firmware.
    rpc RetryFailedRolloutDevices(RetryFailedRolloutDevicesRequest) returns (RetryFailedRolloutDevicesResponse);
}

// --- Release channels ---

// Which miners a channel applies to. Every dimension is a union; a miner is
// in the channel when any selector matches its current placement.
message ReleaseChannelScope {
    repeated int64 site_ids = 1 [(buf.validate.field).repeated = {max_items: 100, items: {int64: {gt: 0}}}];
    repeated int64 building_ids = 2 [(buf.validate.field).repeated = {max_items: 100, items: {int64: {gt: 0}}}];
    repeated int64 rack_ids = 3 [(buf.validate.field).repeated = {max_items: 500, items: {int64: {gt: 0}}}];
    repeated int64 group_ids = 4 [(buf.validate.field).repeated = {max_items: 100, items: {int64: {gt: 0}}}];
    // Individual miners by device identifier.
    repeated string device_identifiers = 5 [(buf.validate.field).repeated = {max_items: 10000, items: {string: {min_len: 1, max_len: 255}}}];
}

// How a rollout distributes the update across its targets.
enum RolloutMethod {
    ROLLOUT_METHOD_UNSPECIFIED = 0;
    // Single batch: every mismatched miner is updated at once.
    ROLLOUT_METHOD_ALL_AT_ONCE = 1;
    // Multiple batches of batch_size, optionally reviewed after each one;
    // late joiners follow once the batches are done.
    ROLLOUT_METHOD_BATCHED = 2;
    // A pilot batch of pilot_size, a review gate, then the remaining miners.
    ROLLOUT_METHOD_PILOT_THEN_CONTINUE = 3;
}

// Order miners are worked through in a paced rollout. Meaningless for
// ALL_AT_ONCE.
enum RolloutOrder {
    ROLLOUT_ORDER_UNSPECIFIED = 0;
    // Miners with the worst efficiency (highest J/TH) go first; miners with
    // no recent sample go last.
    ROLLOUT_ORDER_LEAST_EFFICIENT_FIRST = 1;
    ROLLOUT_ORDER_RANDOM = 2;
}

// Limits a reviewed batch must satisfy for the rollout to continue without
// an operator. An unset threshold is not checked.
message RolloutAutomationThresholds {
    // Largest acceptable aggregate hashrate drop versus baseline, percent.
    optional double max_hashrate_drop_percent = 1 [(buf.validate.field).double = {gte: 0, lte: 100}];
    // Largest acceptable mean efficiency (J/TH) increase versus baseline, percent.
    optional double max_efficiency_increase_percent = 2 [(buf.validate.field).double = {gte: 0}];
    // Largest acceptable mean temperature increase versus baseline, °C.
    optional double max_temperature_increase_celsius = 3 [(buf.validate.field).double = {gte: 0}];
    // Largest acceptable number of errors opened since baseline, summed over
    // the batch.
    optional int32 max_new_errors = 4 [(buf.validate.field).int32 = {gte: 0}];
}

// How updates started in a channel are paced. Stored on the channel and
// copied onto each rollout when it starts.
message RolloutBehavior {
    option (buf.validate.message).cel = {
        id: "batch_size_required_for_batched"
        message: "batch_size must be at least 1 for BATCHED"
        expression: "this.method != 2 || this.batch_size > 0"
    };
    option (buf.validate.message).cel = {
        id: "pilot_size_required_for_pilot"
        message: "pilot_size must be at least 1 for PILOT_THEN_CONTINUE"
        expression: "this.method != 3 || this.pilot_size > 0"
    };

    // Defaults to ALL_AT_ONCE when unspecified.
    RolloutMethod method = 1 [(buf.validate.field).enum.defined_only = true];
    // Paced methods only; defaults to LEAST_EFFICIENT_FIRST.
    RolloutOrder order = 2 [(buf.validate.field).enum.defined_only = true];
    // BATCHED: miners per batch (>= 1).
    int32 batch_size = 3 [(buf.validate.field).int32 = {gte: 0}];
    // PILOT_THEN_CONTINUE: miners in the pilot batch (>= 1).
    int32 pilot_size = 4 [(buf.validate.field).int32 = {gte: 0}];
    // BATCHED without review: pause between one batch finishing and the
    // next starting.
    int32 wait_between_batches_seconds = 5 [(buf.validate.field).int32 = {gte: 0}];
    // BATCHED: hold at a review gate after every batch. The pilot method
    // always gates after the pilot.
    bool review_after_each_batch = 6;
    // Release a gate automatically once the batch is verified, has no failed
    // miners, meets the thresholds, and has held for stabilization_seconds.
    bool auto_continue_on_healthy_telemetry = 7;
    // How long a verified batch must hold at the gate before it can
    // auto-continue, so post-update telemetry has settled.
    int32 stabilization_seconds = 8 [(buf.validate.field).int32 = {gte: 0}];
    RolloutAutomationThresholds thresholds = 9;
    // Never have more than this many miners mid-update at once; 0 means no
    // limit.
    int32 max_concurrent_offline = 10 [(buf.validate.field).int32 = {gte: 0}];
}

// A release channel with its scope and aggregate member counts.
message ReleaseChannel {
    int64 id = 1;
    string name = 2;
    string description = 3;
    ReleaseChannelScope scope = 4;
    RolloutBehavior behavior = 5;
    // Total manufacturer/model groups, including assigned pairs with no
    // current members. Retrieve details with ListReleaseChannelModelGroups.
    int32 model_group_count = 6;
    int32 miner_count = 7;
    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
}

// Scope-free release channel details with aggregate member counts.
message ReleaseChannelSummary {
    int64 id = 1;
    string name = 2;
    string description = 3;
    RolloutBehavior behavior = 4;
    int32 miner_count = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
    // Total manufacturer/model groups, including assigned pairs with no
    // current members. Retrieve details with ListReleaseChannelModelGroups.
    int32 model_group_count = 9;
}

// Summary for one manufacturer/model pair in a channel, including its member
// count and firmware assignment.
message ReleaseChannelModelGroup {
    option (buf.validate.message).cel = {
        id: "reported_version_count_covers_returned_versions"
        message: "reported_version_count must be at least the number of reported_versions"
        expression: "this.reported_version_count >= this.reported_versions.size()"
    };

    string manufacturer = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    // Empty when no firmware is assigned to this manufacturer/model pair.
    string firmware_file_id = 3 [(buf.validate.field).string.max_len = 255];
    string firmware_version = 4 [(buf.validate.field).string.max_len = 255];
    int32 miner_count = 5;
    // Id of the active rollout for this manufacturer/model pair, 0 if none.
    int64 active_rollout_id = 6;
    // Members currently reporting the assigned firmware version; 0 when no
    // firmware is assigned.
    int32 on_target_count = 7;
    // The first 10 sorted distinct firmware versions members currently report.
    // Lets a client show "1.0.0 -> 2.0.0" or "Mixed -> 2.0.0" without listing
    // miners.
    repeated string reported_versions = 8 [(buf.validate.field).repeated = {
        max_items: 10
        unique: true
        items: { string: {max_len: 255} }
    }];
    // Total distinct reported versions before reported_versions is truncated.
    // A value greater than the length of reported_versions means truncation.
    int32 reported_version_count = 9;
}

// A miner resolved into a release channel.
message ReleaseChannelMiner {
    int64 device_id = 1;
    string device_identifier = 2;
    string manufacturer = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 4 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    // Firmware version the miner currently reports.
    string firmware_version = 5;
    // Set only when this channel is the unique highest-specificity match and
    // another channel's less-specific selector also covers this miner.
    bool conflicted = 6;
}

// Selector specificity, ordered from most specific to least specific.
enum ReleaseChannelSelectorSpecificity {
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_UNSPECIFIED = 0;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_MINER = 1;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_GROUP = 2;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_RACK = 3;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_BUILDING = 4;
    RELEASE_CHANNEL_SELECTOR_SPECIFICITY_SITE = 5;
}

// One excluded miner/channel relation in an equal-specificity membership tie.
// A miner tying multiple channels produces one record for each tied channel.
message ReleaseChannelMembershipConflict {
    int64 device_id = 1;
    string device_identifier = 2 [(buf.validate.field).string.max_len = 255];
    string manufacturer = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 4 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    int64 channel_id = 5;
    string channel_name = 6 [(buf.validate.field).string.max_len = 100];
    ReleaseChannelSelectorSpecificity selector_specificity = 7 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
    }];
}

// Desired firmware for one manufacturer/model pair within a channel.
message FirmwareAssignment {
    string manufacturer = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    // Firmware file to enforce for this manufacturer/model pair; empty clears
    // the assignment.
    string firmware_file_id = 3;
}

// --- Rollouts ---

// Lifecycle of a rollout.
enum RolloutStatus {
    ROLLOUT_STATUS_UNSPECIFIED = 0;
    // The rollout is enforcing its firmware version.
    ROLLOUT_STATUS_ACTIVE = 1;
    // Every targeted miner is on the assigned version, back online, and at
    // least as healthy as before the update.
    ROLLOUT_STATUS_COMPLETED = 2;
    // Every targeted miner settled, but some failed.
    ROLLOUT_STATUS_COMPLETED_WITH_FAILURES = 3;
    // Ended before completion; see cancel_reason.
    ROLLOUT_STATUS_CANCELED = 4;
}

// Why a rollout was canceled.
enum RolloutCancelReason {
    ROLLOUT_CANCEL_REASON_UNSPECIFIED = 0;
    // A newer assignment replaced it.
    ROLLOUT_CANCEL_REASON_SUPERSEDED = 1;
    // An operator canceled the remaining updates.
    ROLLOUT_CANCEL_REASON_CANCELED_REMAINING = 2;
    // An operator rolled the manufacturer/model pair back to an earlier version.
    ROLLOUT_CANCEL_REASON_ROLLED_BACK = 3;
    // The manufacturer/model pair's assignment was cleared.
    ROLLOUT_CANCEL_REASON_CLEARED = 4;
}

// Progress of a staged rollout. ALL_AT_ONCE rollouts are always in REST.
enum RolloutStage {
    ROLLOUT_STAGE_UNSPECIFIED = 0;
    // Updating the current batch only.
    ROLLOUT_STAGE_BATCH = 1;
    // The current batch is done; holding for a review (manual continue, or
    // automatic once the thresholds are met).
    ROLLOUT_STAGE_AWAITING_REVIEW = 2;
    // The current batch is done; waiting wait_between_batches_seconds
    // before the next one starts.
    ROLLOUT_STAGE_WAITING = 3;
    // Updating all remaining targets.
    ROLLOUT_STAGE_REST = 4;
}

// Operator-facing lifecycle state, derived from status, stage and pause.
enum RolloutState {
    ROLLOUT_STATE_UNSPECIFIED = 0;
    ROLLOUT_STATE_IN_PROGRESS = 1;
    // At a gate that will auto-continue once the stabilization period
    // elapses and telemetry holds.
    ROLLOUT_STATE_STABILIZING_TELEMETRY = 2;
    // At the gate after the pilot batch, waiting for an operator.
    ROLLOUT_STATE_PAUSED_AT_PILOT_GATE = 3;
    // At the gate after a batch, waiting for an operator.
    ROLLOUT_STATE_PAUSED_AT_BATCH_REVIEW = 4;
    // Paused by an operator.
    ROLLOUT_STATE_PAUSED = 5;
    ROLLOUT_STATE_COMPLETED = 6;
    ROLLOUT_STATE_COMPLETED_WITH_FAILURES = 7;
    ROLLOUT_STATE_CANCELED = 8;
}

// Per-miner phase within a rollout.
enum RolloutDevicePhase {
    ROLLOUT_DEVICE_PHASE_UNSPECIFIED = 0;
    // No update command sent yet.
    ROLLOUT_DEVICE_PHASE_QUEUED = 1;
    // First update command sent; the miner has not verified yet.
    ROLLOUT_DEVICE_PHASE_IN_PROGRESS = 2;
    // The first attempt did not take; the update was re-sent.
    ROLLOUT_DEVICE_PHASE_RETRYING = 3;
    // On the target version, back online, and at least as healthy as
    // before the update.
    ROLLOUT_DEVICE_PHASE_DONE = 4;
    // Attempts exhausted, or the rollout was canceled before this miner
    // updated. Not retried until RetryFailedRolloutDevices.
    ROLLOUT_DEVICE_PHASE_FAILED = 5;
    // Left the channel's scope while the rollout was running.
    ROLLOUT_DEVICE_PHASE_EXCLUDED = 6;
}

// A telemetry metric before the update (baseline, captured when the miner
// was snapshotted into the rollout) and now. A missing half means no sample
// was available.
message MetricComparison {
    optional double baseline = 1;
    optional double current = 2;
}

// Per-phase miner counts for a rollout or for one of its batches.
message RolloutDeviceCounts {
    int32 queued = 1;
    int32 in_progress = 2;
    int32 retrying = 3;
    int32 done = 4;
    int32 failed = 5;
    int32 excluded = 6;
}

// Post-update evidence for the miners under review: the batch at the gate
// (or in flight), or every target in the rest stage. Compared against each
// miner's own baseline.
message RolloutEvidence {
    int32 devices_total = 1;
    // Miners in the DONE phase.
    int32 verified = 2;
    int32 online = 3;
    int32 hashing = 4;
    // How many of these miners were hashing before the update.
    int32 baseline_hashing = 5;
    int32 failed = 6;
    // Aggregate hashrate change versus baseline, percent (negative is a
    // drop). Only meaningful when hash_rate_hs has both halves.
    double hashrate_change_percent = 7;
    // Mean efficiency change versus baseline, percent (positive is worse).
    double efficiency_change_percent = 8;
    // Mean temperature change versus baseline, °C.
    double temperature_change_celsius = 9;
    // Errors opened since baseline, summed over the batch (never below 0).
    int32 new_errors = 10;
    // Whether the evidence meets the rollout's auto-continue conditions
    // (always false for rollouts without auto-continue).
    bool ready_to_advance = 11;
    // Why the rollout is holding at the gate when it cannot auto-continue.
    string hold_reason = 12;
    // Seconds of stabilization still required before auto-continue.
    int32 stabilization_remaining_seconds = 13;
    // Aggregates over miners in scope that have both halves: total
    // hashrate, total power, mean efficiency, mean temperature.
    MetricComparison hash_rate_hs = 14;
    MetricComparison power_w = 15;
    MetricComparison efficiency_jh = 16;
    MetricComparison temp_c = 17;
}

// A firmware change being enforced for one manufacturer/model pair within one
// channel.
message Rollout {
    int64 id = 1;
    int64 channel_id = 2;
    string channel_name = 3;
    string manufacturer = 4 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 5 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string firmware_file_id = 6;
    string firmware_version = 7;
    RolloutStatus status = 8;
    RolloutState state = 9;
    // Stage of a staged rollout; REST for all-at-once rollouts.
    RolloutStage stage = 10;
    RolloutCancelReason cancel_reason = 11;
    // The behavior this rollout runs with (copied from the channel at start).
    RolloutBehavior behavior = 12;
    // Number of snapshotted batches; 0 for all-at-once rollouts.
    int32 batch_count = 13;
    // 0-based index of the batch in flight or under review.
    int32 current_batch = 14;
    // When the current stage began.
    google.protobuf.Timestamp stage_changed_at = 15;
    // Set while the rollout is paused.
    google.protobuf.Timestamp paused_at = 16;
    google.protobuf.Timestamp created_at = 17;
    // Set when the rollout completed or was canceled.
    google.protobuf.Timestamp finished_at = 18;
    // Assignment in place before this rollout; what a rollback restores.
    string previous_firmware_file_id = 19;
    string previous_firmware_version = 20;
    // Number of miners snapshotted into the rollout. Retrieve their live
    // progress with ListRolloutDevices.
    int32 device_count = 21;
    // Evidence for the miners currently under review; unset for rollouts
    // that are not active.
    RolloutEvidence evidence = 22;
    // Per-phase counts over every snapshotted miner; sums to device_count.
    RolloutDeviceCounts device_counts = 23;
    // Per-phase counts over the batch in flight or under review. All zero
    // in the rest stage and for all-at-once rollouts.
    RolloutDeviceCounts current_batch_counts = 24;
}

// Progress of one miner within a rollout.
message RolloutDevice {
    int64 device_id = 1;
    string device_identifier = 2;
    string ip_address = 3;
    // Firmware version the miner currently reports.
    string firmware_version = 4;
    RolloutDevicePhase phase = 5;
    // 1-based batch the miner was snapshotted into; 0 when it is not part of
    // any batch (rest stage / late joiner).
    int32 batch = 6;
    // Live device status (e.g. ACTIVE, OFFLINE, NEEDS_MINING_POOL).
    string status = 7;
    bool online = 8;
    bool hashing = 9;
    // False for late joiners with no baseline snapshot.
    bool has_baseline = 10;
    bool baseline_hashing = 11;
    int32 open_errors = 12;
    int32 baseline_open_errors = 13;
    MetricComparison hash_rate_hs = 14;
    MetricComparison power_w = 15;
    MetricComparison efficiency_jh = 16;
    MetricComparison temp_c = 17;
    // Update commands sent to this miner so far.
    int32 attempts = 18;
    google.protobuf.Timestamp last_sent_at = 19;
    // Why the miner is FAILED, when known.
    string last_error = 20;
}

// --- Requests / responses ---

message ListReleaseChannelsRequest {
    // Maximum channels to return. 0 uses the server default of 100.
    int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelsResponse {
    repeated ReleaseChannelSummary channels = 1;
    // Cursor for the next page; empty when there are no more channels.
    string cursor = 2;
}

message GetReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message ListReleaseChannelModelGroupsRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Maximum model groups to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
    // Opaque cursor returned by a previous call; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 1024];
}

message ListReleaseChannelModelGroupsResponse {
    repeated ReleaseChannelModelGroup model_groups = 1 [(buf.validate.field).repeated.max_items = 100];
    // Opaque cursor for the next page; empty when there are no more model groups.
    string cursor = 2 [(buf.validate.field).string.max_len = 1024];
}

message ListReleaseChannelMinersRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Empty filters return every manufacturer/model pair in the channel.
    string manufacturer = 2 [(buf.validate.field).string = {max_len: 255, pattern: "^$|^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 3 [(buf.validate.field).string = {max_len: 255, pattern: "^$|^[!-~](?:[ -~]*[!-~])?$"}];
    // Maximum miners to return. 0 uses the server default of 100.
    int32 page_size = 4 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 5 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelMinersResponse {
    repeated ReleaseChannelMiner miners = 1;
    // Cursor for the next page; empty when there are no more miners.
    string cursor = 2;
}

message ListReleaseChannelMembershipConflictsRequest {
    // Only relations for this channel are returned. 0 returns all conflicts
    // in the organization.
    int64 channel_id = 1 [(buf.validate.field).int64.gte = 0];
    // Maximum conflict records to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelMembershipConflictsResponse {
    // Flat records keep the page bounded when one miner ties many channels.
    // Clients may group records by device_id.
    repeated ReleaseChannelMembershipConflict conflicts = 1 [(buf.validate.field).repeated.max_items = 100];
    // Cursor for the next page; empty when there are no more conflicts.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message CreateReleaseChannelRequest {
    string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
    string description = 2 [(buf.validate.field).string = {max_len: 1000}];
    ReleaseChannelScope scope = 3;
    RolloutBehavior behavior = 4;
}

message CreateReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message UpdateReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
    string description = 3 [(buf.validate.field).string = {max_len: 1000}];
    ReleaseChannelScope scope = 4;
    RolloutBehavior behavior = 5;
}

message UpdateReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message DeleteReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteReleaseChannelResponse {}

message PreviewReleaseChannelScopeRequest {
    ReleaseChannelScope scope = 1;
    // When editing, the channel being edited so its own members do not count
    // as conflicts.
    int64 channel_id = 2;
}

// Miners another channel already covers that the previewed scope would take.
message ReleaseChannelScopeConflict {
    int64 channel_id = 1;
    string channel_name = 2 [(buf.validate.field).string.max_len = 100];
    int32 miner_count = 3;
}

message ReleaseChannelScopeModelCount {
    string manufacturer = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    int32 miner_count = 3;
}

message PreviewReleaseChannelScopeResponse {
    option (buf.validate.message).cel = {
        id: "models_match_bounded_model_count"
        message: "models must contain all entries up to the 100-item limit"
        expression: "this.models.size() == (this.model_count < 100 ? this.model_count : 100)"
    };
    option (buf.validate.message).cel = {
        id: "conflicts_match_bounded_conflict_count"
        message: "conflicts must contain all entries up to the 100-item limit"
        expression: "this.conflicts.size() == (this.conflict_count < 100 ? this.conflict_count : 100)"
    };

    int32 miner_count = 1;
    // The first 100 manufacturer/model pairs sorted by manufacturer then model.
    repeated ReleaseChannelScopeModelCount models = 2 [(buf.validate.field).repeated.max_items = 100];
    // The first 100 conflicts sorted by channel id. Non-empty means the scope
    // cannot be saved as is.
    repeated ReleaseChannelScopeConflict conflicts = 3 [(buf.validate.field).repeated.max_items = 100];
    // Total manufacturer/model pairs before models is truncated. A value
    // greater than the length of models means truncation.
    int32 model_count = 4;
    // Total conflicting channels before conflicts is truncated. A value
    // greater than the length of conflicts means truncation.
    int32 conflict_count = 5;
}

message ApplyReleaseChannelFirmwareRequest {
    option (buf.validate.message).cel = {
        id: "assignments_unique_by_manufacturer_model"
        message: "assignments must contain at most one entry per manufacturer/model pair"
        expression: "this.assignments.size() > 100 || this.assignments.map(a, string(a.manufacturer.lowerAscii().size()) + ':' + a.manufacturer.lowerAscii() + a.model.lowerAscii()).unique()"
    };

    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Desired assignments. Manufacturer/model pairs omitted here keep their
    // current assignment. Assignment target identities must be printable ASCII
    // without surrounding spaces and compare ASCII letters case-insensitively.
    repeated FirmwareAssignment assignments = 2 [(buf.validate.field).repeated = {
        min_items: 1
        max_items: 100
    }];
}

message ApplyReleaseChannelFirmwareResponse {
    ReleaseChannel channel = 1;
    // Rollouts started by this call, one per changed manufacturer/model pair
    // with mismatched members.
    repeated Rollout started_rollouts = 2;
}

message RollbackReleaseChannelFirmwareRequest {
    // Rollout whose previous firmware assignment is restored for its channel
    // and manufacturer/model pair.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message RollbackReleaseChannelFirmwareResponse {
    ReleaseChannel channel = 1;
    // Rollouts started by this call (at most one, for the rolled-back
    // manufacturer/model pair).
    repeated Rollout started_rollouts = 2;
}

message ListRolloutsRequest {
    // When set, only rollouts for this channel are returned.
    int64 channel_id = 1;
    // When set, only rollouts with this status are returned.
    RolloutStatus status = 2 [(buf.validate.field).enum.defined_only = true];
    // Maximum number of rollouts to return. 0 uses the server default of 100.
    int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 4 [(buf.validate.field).string.max_len = 100];
}

message ListRolloutsResponse {
    repeated Rollout rollouts = 1;
    // Cursor for the next page; empty when there are no more rollouts.
    string cursor = 2;
}

message GetRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetRolloutResponse {
    Rollout rollout = 1;
}

message ListRolloutDevicesRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // Maximum devices to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 100];
}

message ListRolloutDevicesResponse {
    repeated RolloutDevice devices = 1;
    // Cursor for the next page; empty when there are no more devices.
    string cursor = 2;
}

message ContinueRolloutRequest {
    // Active staged rollout in the AWAITING_REVIEW stage.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ContinueRolloutResponse {
    Rollout rollout = 1;
}

message PauseRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message PauseRolloutResponse {
    Rollout rollout = 1;
}

message ResumeRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ResumeRolloutResponse {
    Rollout rollout = 1;
}

message CancelRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message CancelRolloutResponse {
    // The canceled rollout.
    Rollout rollout = 1;
    ReleaseChannel channel = 2;
}

message RetryFailedRolloutDevicesRequest {
    // The rollout whose failed (or canceled) miners are retried. Its original
    // target must satisfy the RetryFailedRolloutDevices preconditions; a stale
    // target fails with FAILED_PRECONDITION rather than being retargeted.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message RetryFailedRolloutDevicesResponse {
    // The rollout now carrying the retried miners: the same rollout when it
    // was still active, otherwise a new all-at-once rollout with the eligible
    // finished rollout's unchanged target.
    Rollout rollout = 1;
}
