// Progress of one miner within a rollout.
message RolloutDevice {

    int64 device_id = 1 [(buf.validate.field).int64.gte = 0];
    string device_identifier = 2 [(buf.validate.field).string.max_len = 255];
    string ip_address = 3 [(buf.validate.field).string.max_len = 45];
    // Firmware version the miner currently reports.
    string firmware_version = 4 [(buf.validate.field).string.max_len = 255];
    RolloutDevicePhase phase = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
    // 1-based batch the miner was snapshotted into; 0 when it is not part of
    // any batch (rest stage / late joiner).
    int32 batch = 6 [(buf.validate.field).int32.gte = 0];
    // Live device status (e.g. ACTIVE, OFFLINE, NEEDS_MINING_POOL).
    string status = 7 [(buf.validate.field).string.max_len = 50];
    bool online = 8;
    bool hashing = 9;
    // False for late joiners with no baseline snapshot; those miners must be
    // currently hashing to reach DONE.
    bool has_baseline = 10;
    // Whether the miner was hashing at baseline. When has_baseline is true,
    // this controls whether current hashing is required to reach DONE.
    bool baseline_hashing = 11;
    int32 open_errors = 12 [(buf.validate.field).int32.gte = 0];
    int32 baseline_open_errors = 13 [(buf.validate.field).int32.gte = 0];
    MetricComparison hash_rate_hs = 14;
    MetricComparison power_w = 15;
    MetricComparison efficiency_jh = 16;
    MetricComparison temp_c = 17;
    // Update commands sent to this miner so far.
    int32 attempts = 18 [(buf.validate.field).int32.gte = 0];
    google.protobuf.Timestamp last_sent_at = 19;
    // Why the miner is FAILED, when known. Device-reported text is truncated
    // to this limit before it is persisted or returned.
    string last_error = 20 [(buf.validate.field).string.max_len = 2048];
    // Managed-deployment provenance as defined by RolloutService: the checksum
    // of the last firmware Fleet deployed to this miner; empty when none is
    // recorded.
    string last_deployed_firmware_checksum = 21 [(buf.validate.field).string = {max_len: 64, pattern: "^$|^[0-9a-f]{64}$"}];
    // Note from the SkipRolloutDevices or CompleteRollout call that settled a
    // SKIPPED miner; empty otherwise.
    string skip_note = 22 [(buf.validate.field).string.max_len = 1024];
}

// --- Requests / responses ---

message ListReleaseChannelsRequest {
    // Maximum channels to return. 0 uses the server default of 100.
    int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelsResponse {
    repeated ReleaseChannelSummary channels = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page; empty when there are no more channels.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message GetReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message ListReleaseChannelModelGroupsRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Maximum model groups to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
    // Opaque cursor sized for maximum 255-code-point Unicode sort keys and
    // encoding overhead; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 8192];
}

message ListReleaseChannelModelGroupsResponse {
    repeated ReleaseChannelModelGroup model_groups = 1 [(buf.validate.field).repeated.max_items = 100];
    // Opaque cursor sized for maximum 255-code-point Unicode sort keys and
    // encoding overhead; empty when there are no more model groups.
    string cursor = 2 [(buf.validate.field).string.max_len = 8192];
}

message ListReleaseChannelMinersRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Filters match observed identities verbatim up to 255 characters,
    // including non-ASCII, whitespace, and control characters other than
    // U+0000, which stored text cannot contain. Empty filters return every
    // manufacturer/model pair in the channel.
    string manufacturer = 2 [(buf.validate.field).string = {max_len: 255, not_contains: "\x00"}];
    string model = 3 [(buf.validate.field).string = {max_len: 255, not_contains: "\x00"}];
    // Maximum miners to return. 0 uses the server default of 100.
    int32 page_size = 4 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 5 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelMinersResponse {
    repeated ReleaseChannelMiner miners = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page; empty when there are no more miners.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelMembershipConflictsRequest {
    // Only relations for this channel are returned. 0 returns all conflicts
    // in the organization.
    int64 channel_id = 1 [(buf.validate.field).int64.gte = 0];
    // Maximum conflict records to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 100];
}

message ListReleaseChannelMembershipConflictsResponse {
    // Flat records keep the page bounded when one miner matches many channels.
    // Clients may group records by device_id.
    repeated ReleaseChannelMembershipConflict conflicts = 1 [(buf.validate.field).repeated.max_items = 100];
    // Cursor for the next page; empty when there are no more conflicts.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message CreateReleaseChannelRequest {
    string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 100, not_contains: "\x00"}];
    string description = 2 [(buf.validate.field).string = {max_len: 1000, not_contains: "\x00"}];
    ReleaseChannelScope scope = 3;
    RolloutBehavior behavior = 4;
}

message CreateReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message UpdateReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100, not_contains: "\x00"}];
    string description = 3 [(buf.validate.field).string = {max_len: 1000, not_contains: "\x00"}];
    ReleaseChannelScope scope = 4;
    RolloutBehavior behavior = 5;
}

message UpdateReleaseChannelResponse {
    ReleaseChannel channel = 1;
}

message DeleteReleaseChannelRequest {
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteReleaseChannelResponse {}

message PreviewReleaseChannelScopeRequest {
    ReleaseChannelScope scope = 1;
    // When editing, the channel being edited so its own members do not count
    // as conflicts.
    int64 channel_id = 2 [(buf.validate.field).int64.gte = 0];
}

// Miners another channel already covers that the previewed scope would take.
message ReleaseChannelScopeConflict {
    int64 channel_id = 1 [(buf.validate.field).int64.gte = 0];
    string channel_name = 2 [(buf.validate.field).string.max_len = 100];
    // Miners the previewed scope would take from this channel; a listed
    // conflict always involves at least one.
    int32 miner_count = 3 [(buf.validate.field).int32.gt = 0];
}

// Aggregate count for one observed hardware identity. Observed identities up
// to 255 characters are returned verbatim and may contain non-ASCII,
// whitespace, or control characters; an empty manufacturer or model means the
// identity is unknown.
message ReleaseChannelScopeModelCount {
    string manufacturer = 1 [(buf.validate.field).string.max_len = 255];
    string model = 2 [(buf.validate.field).string.max_len = 255];
    // Miners in the previewed scope with this identity; a listed group always
    // has at least one.
    int32 miner_count = 3 [(buf.validate.field).int32.gt = 0];
}

message PreviewReleaseChannelScopeResponse {
    option (buf.validate.message).cel = {
        id: "models_match_bounded_model_count"
        message: "models must contain all entries up to the 100-item limit"
        expression: "this.models.size() == (this.model_count < 100 ? this.model_count : 100)"
    };
    option (buf.validate.message).cel = {
        id: "model_groups_fit_within_miner_count"
        message: "model_count and each group's miner_count must not exceed the preview's miner_count"
        expression: "this.model_count <= this.miner_count && this.models.all(m, m.miner_count <= this.miner_count)"
    };
    option (buf.validate.message).cel = {
        id: "conflicts_match_bounded_conflict_count"
        message: "conflicts must contain all entries up to the 100-item limit"
        expression: "this.conflicts.size() == (this.conflict_count < 100 ? this.conflict_count : 100)"
    };

    int32 miner_count = 1 [(buf.validate.field).int32.gte = 0];
    // The first 100 manufacturer/model pairs sorted by manufacturer then model.
    repeated ReleaseChannelScopeModelCount models = 2 [(buf.validate.field).repeated.max_items = 100];
    // The first 100 conflicts sorted by channel id. Non-empty means the scope
    // cannot be saved as is.
    repeated ReleaseChannelScopeConflict conflicts = 3 [(buf.validate.field).repeated.max_items = 100];
    // Total manufacturer/model pairs before models is truncated. A value
    // greater than the length of models means truncation.
    int32 model_count = 4 [(buf.validate.field).int32.gte = 0];
    // Total conflicting channels before conflicts is truncated. A value
    // greater than the length of conflicts means truncation.
    int32 conflict_count = 5 [(buf.validate.field).int32.gte = 0];
}

message ApplyReleaseChannelFirmwareRequest {
    option (buf.validate.message).cel = {
        id: "assignments_unique_by_manufacturer_model"
        message: "assignments must contain at most one entry per manufacturer/model pair"
        expression: "this.assignments.size() > 100 || this.assignments.map(a, string(a.manufacturer.size()) + ':' + a.manufacturer.lowerAscii() + a.model.lowerAscii()).unique()"
    };

    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Desired assignments. Manufacturer/model pairs omitted here keep their
    // current assignment. Assignment target identities must be printable ASCII
    // without surrounding spaces and compare ASCII letters case-insensitively.
    repeated FirmwareAssignment assignments = 2 [(buf.validate.field).repeated = {
        min_items: 1
        max_items: 100
    }];
    // When set, the rollouts this call starts run with this behavior instead
    // of the channel's saved behavior; the channel is not changed. Lets a
    // controller run one DELEGATED rollout on a channel operators otherwise
    // drive by hand.
    RolloutBehavior behavior_override = 3;
}

message PreviewReleaseChannelFirmwareRequest {
    option (buf.validate.message).cel = {
        id: "preview_assignments_unique_by_manufacturer_model"
        message: "assignments must contain at most one entry per manufacturer/model pair"
        expression: "this.assignments.size() > 100 || this.assignments.map(a, string(a.manufacturer.size()) + ':' + a.manufacturer.lowerAscii() + a.model.lowerAscii()).unique()"
    };
    int64 channel_id = 1 [(buf.validate.field).int64.gt = 0];
    // Assignments to plan, with the same constraints as
    // ApplyReleaseChannelFirmwareRequest.assignments.
    repeated FirmwareAssignment assignments = 2 [(buf.validate.field).repeated = {
        min_items: 1
        max_items: 100
    }];
    // Behavior to plan with instead of the channel's saved behavior.
    RolloutBehavior behavior_override = 3;
}

// The rollout ApplyReleaseChannelFirmware would start for one assignment.
message ReleaseChannelFirmwarePlan {
    option (buf.validate.message).cel = {
        id: "plan_artifact_fields_are_atomic"
        message: "a clearing plan has no artifact fields; an assigning plan has firmware_file_id, firmware_version and firmware_checksum together"
        expression: "(this.firmware_file_id == '' && this.firmware_version == '' && this.firmware_checksum == '') || (this.firmware_file_id != '' && this.firmware_version != '' && this.firmware_checksum != '')"
    };

    string manufacturer = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    string model = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[!-~](?:[ -~]*[!-~])?$"}];
    // Empty when the assignment would clear the pair.
    string firmware_file_id = 3 [(buf.validate.field).string.max_len = 255];
    string firmware_version = 4 [(buf.validate.field).string = {max_len: 255, not_contains: "\x00"}];
    // Members that would be targeted (mismatched as ApplyReleaseChannelFirmware
    // defines it).
    int32 target_count = 5 [(buf.validate.field).int32.gte = 0];
    // Members already matching the assignment.
    int32 on_target_count = 6 [(buf.validate.field).int32.gte = 0];
    // Batches the rollout would snapshot; 0 for all-at-once and DELEGATED.
    int32 batch_count = 7 [(buf.validate.field).int32.gte = 0];
    // The behavior the rollout would run with.
    RolloutBehavior behavior = 8;
    // Whether the assignment is unchanged, in which case no rollout starts.
    bool unchanged = 9;
    // Checksum the assignment would carry; empty when it would clear the pair.
    string firmware_checksum = 10 [(buf.validate.field).string = {max_len: 64, pattern: "^$|^[0-9a-f]{64}$"}];
}

message PreviewReleaseChannelFirmwareResponse {
    repeated ReleaseChannelFirmwarePlan plans = 1 [(buf.validate.field).repeated.max_items = 100];
}

message ApplyReleaseChannelFirmwareResponse {
    ReleaseChannel channel = 1;
    // Rollouts started by this call, one per changed manufacturer/model pair
    // with mismatched members.
    repeated Rollout started_rollouts = 2 [(buf.validate.field).repeated.max_items = 100];
}

message RollbackReleaseChannelFirmwareRequest {
    // Rollout whose assignment to reverse. See
    // RollbackReleaseChannelFirmware for its assignment-generation
    // precondition and atomic effects.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // When nonzero, the referenced rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 2 [(buf.validate.field).int64.gte = 0];
    // Rationale recorded on the resulting events.
    string note = 3 [(buf.validate.field).string = {max_len: 1024, not_contains: "\x00"}];
}

message RollbackReleaseChannelFirmwareResponse {
    ReleaseChannel channel = 1;
    // Rollouts started by this call. Empty when an empty lineage cleared the
    // assignment or no members mismatch the restored assignment (including
    // members with an outstanding update for the rolled-back target);
    // otherwise contains one all-at-once rollout for those mismatched members.
    repeated Rollout started_rollouts = 2 [(buf.validate.field).repeated.max_items = 1];
}

message ListRolloutsRequest {
    // When set, only rollouts for this channel are returned.
    int64 channel_id = 1 [(buf.validate.field).int64.gte = 0];
    // When set, only rollouts with this status are returned.
    RolloutStatus status = 2 [(buf.validate.field).enum.defined_only = true];
    // Maximum number of rollouts to return. 0 uses the server default of 100.
    int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 4 [(buf.validate.field).string.max_len = 100];
    // When set, only rollouts whose updated_at is at or after this time are
    // returned, so a poller can fetch what changed since its last call.
    google.protobuf.Timestamp updated_after = 5;
}

message ListRolloutsResponse {
    repeated Rollout rollouts = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page; empty when there are no more rollouts.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message GetRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetRolloutResponse {
    Rollout rollout = 1;
}

message ListRolloutDevicesRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // Maximum devices to return. 0 uses the server default of 100.
    int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty for the first page.
    string cursor = 3 [(buf.validate.field).string.max_len = 100];
}

message ListRolloutDevicesResponse {
    repeated RolloutDevice devices = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page; empty when there are no more devices.
    string cursor = 2 [(buf.validate.field).string.max_len = 100];
}

message ContinueRolloutRequest {
    // Active staged rollout in the AWAITING_REVIEW stage.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // When nonzero, the rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 2 [(buf.validate.field).int64.gte = 0];
    // Rationale recorded on the CONTINUED event.
    string note = 3 [(buf.validate.field).string = {max_len: 1024, not_contains: "\x00"}];
}

// Targets named by device identifier within one rollout.
message RolloutDeviceSelection {
    repeated string device_identifiers = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 1000, unique: true, items: {string: {min_len: 1, max_len: 255, not_contains: "\x00"}}}];
}

message AdvanceRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    oneof selection {
        option (buf.validate.oneof).required = true;
        // Dispatch exactly these QUEUED targets.
        RolloutDeviceSelection devices = 2;
        // Dispatch the next count QUEUED targets in the rollout's order; fewer
        // when fewer remain.
        int32 count = 3 [(buf.validate.field).int32 = {gt: 0, lte: 1000}];
    }
    // When nonzero, the rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 4 [(buf.validate.field).int64.gte = 0];
    // Rationale recorded on the ADVANCED event.
    string note = 5 [(buf.validate.field).string = {max_len: 1024, not_contains: "\x00"}];
}

message AdvanceRolloutResponse {
    Rollout rollout = 1;
    // Targets that were dispatched to, in dispatch order.
    repeated string device_identifiers = 2 [(buf.validate.field).repeated = {max_items: 1000, items: {string: {max_len: 255}}}];
}

message SkipRolloutDevicesRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    RolloutDeviceSelection devices = 2 [(buf.validate.field).required = true];
    // When nonzero, the rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 3 [(buf.validate.field).int64.gte = 0];
    // Rationale recorded on the DEVICES_SKIPPED event and each target's
    // skip_note.
    string note = 4 [(buf.validate.field).string = {max_len: 1024, not_contains: "\x00"}];
}

message SkipRolloutDevicesResponse {
    Rollout rollout = 1;
}

message CompleteRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // When nonzero, the rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 2 [(buf.validate.field).int64.gte = 0];
    // Rationale recorded on the COMPLETED event and any skipped target's
    // skip_note.
    string note = 3 [(buf.validate.field).string = {max_len: 1024, not_contains: "\x00"}];
}

message CompleteRolloutResponse {
    Rollout rollout = 1;
}

message ListRolloutEventsRequest {
    // When set, only events of this rollout.
    int64 rollout_id = 1 [(buf.validate.field).int64.gte = 0];
    // When set, only events of rollouts in this channel.
    int64 channel_id = 2 [(buf.validate.field).int64.gte = 0];
    // Maximum events to return. 0 uses the server default of 100.
    int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
    // Cursor returned by a previous call; leave empty to start from the
    // oldest event. A cursor stays valid indefinitely, so a client may resume
    // from where it stopped.
    string cursor = 4 [(buf.validate.field).string.max_len = 100];
}

message ListRolloutEventsResponse {
    repeated RolloutEvent events = 1 [(buf.validate.field).repeated.max_items = 1000];
    // Cursor for the next page. Unlike other lists it is never empty: when no
    // newer events exist it points just past the last one returned, so a
    // poller passes it back to receive only new events.
    string cursor = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
}

message ContinueRolloutResponse {
    Rollout rollout = 1;
}

message PauseRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // When nonzero, the rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 2 [(buf.validate.field).int64.gte = 0];
}

message PauseRolloutResponse {
    Rollout rollout = 1;
}

message ResumeRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // When nonzero, the rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 2 [(buf.validate.field).int64.gte = 0];
}

message ResumeRolloutResponse {
    Rollout rollout = 1;
}

message CancelRolloutRequest {
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // When nonzero, the rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 2 [(buf.validate.field).int64.gte = 0];
    // Rationale recorded on the CANCELED event.
    string note = 3 [(buf.validate.field).string = {max_len: 1024, not_contains: "\x00"}];
}

message CancelRolloutResponse {
    // The canceled rollout.
    Rollout rollout = 1;
    ReleaseChannel channel = 2;
}

message RetryFailedRolloutDevicesRequest {
    // The rollout whose failed (or canceled) miners are retried. Its original
    // target must satisfy the RetryFailedRolloutDevices preconditions; a stale
    // target fails with FAILED_PRECONDITION rather than being retargeted.
    int64 rollout_id = 1 [(buf.validate.field).int64.gt = 0];
    // When nonzero, the rollout's revision must equal this value
    // (RolloutService revision rule).
    int64 expected_revision = 2 [(buf.validate.field).int64.gte = 0];
}

message RetryFailedRolloutDevicesResponse {
    // The rollout now carrying the retried miners: the same rollout when it
    // was still active, otherwise a new all-at-once rollout with the eligible
    // finished rollout's unchanged target.
    Rollout rollout = 1;
}
