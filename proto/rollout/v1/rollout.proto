syntax = "proto3";

package rollout.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service RolloutService {
    rpc PreviewRolloutLane(PreviewRolloutLaneRequest) returns (PreviewRolloutLaneResponse);
    rpc CreateRolloutLane(CreateRolloutLaneRequest) returns (CreateRolloutLaneResponse);
    rpc GetRolloutLane(GetRolloutLaneRequest) returns (GetRolloutLaneResponse);
    rpc GetRolloutLaneForRollout(GetRolloutLaneForRolloutRequest) returns (GetRolloutLaneForRolloutResponse);
    rpc ListRolloutLanes(ListRolloutLanesRequest) returns (ListRolloutLanesResponse);
    rpc ListRolloutLaneMembers(ListRolloutLaneMembersRequest) returns (ListRolloutLaneMembersResponse);
    rpc GetRolloutLaneAssignments(GetRolloutLaneAssignmentsRequest) returns (GetRolloutLaneAssignmentsResponse);
    rpc PreviewRolloutLaneMembershipChange(PreviewRolloutLaneMembershipChangeRequest) returns (PreviewRolloutLaneMembershipChangeResponse);
    rpc UpdateRolloutLaneMembership(UpdateRolloutLaneMembershipRequest) returns (UpdateRolloutLaneMembershipResponse);
    rpc PreviewRolloutLaneModelDeclaration(PreviewRolloutLaneModelDeclarationRequest) returns (PreviewRolloutLaneModelDeclarationResponse);
    rpc CreateRolloutLaneModelDeclaration(CreateRolloutLaneModelDeclarationRequest) returns (CreateRolloutLaneModelDeclarationResponse);
    rpc PublishRolloutLaneModelTarget(PublishRolloutLaneModelTargetRequest) returns (PublishRolloutLaneModelTargetResponse);
    rpc PreviewRolloutLaneModelMembershipChange(PreviewRolloutLaneModelMembershipChangeRequest) returns (PreviewRolloutLaneModelMembershipChangeResponse);
    rpc UpdateRolloutLaneModelMembership(UpdateRolloutLaneModelMembershipRequest) returns (UpdateRolloutLaneModelMembershipResponse);
    rpc DeleteRolloutLane(DeleteRolloutLaneRequest) returns (DeleteRolloutLaneResponse);
    rpc StartRolloutLane(StartRolloutLaneRequest) returns (StartRolloutLaneResponse);
    rpc GetRolloutLaneTopologyReadiness(GetRolloutLaneTopologyReadinessRequest) returns (GetRolloutLaneTopologyReadinessResponse);
    rpc RepairRolloutLaneModelBinding(RepairRolloutLaneModelBindingRequest) returns (RepairRolloutLaneModelBindingResponse);
    rpc EnableRolloutLaneModelTopology(EnableRolloutLaneModelTopologyRequest) returns (EnableRolloutLaneModelTopologyResponse);
    rpc CreateRollout(CreateRolloutRequest) returns (CreateRolloutResponse);
    rpc GetRollout(GetRolloutRequest) returns (GetRolloutResponse);
    rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse);
    rpc GetRolloutGroup(GetRolloutGroupRequest) returns (GetRolloutGroupResponse);
    rpc ListRolloutGroups(ListRolloutGroupsRequest) returns (ListRolloutGroupsResponse);
    rpc AdmitRollout(AdmitRolloutRequest) returns (AdmitRolloutResponse);
    rpc ContinueRollout(ContinueRolloutRequest) returns (ContinueRolloutResponse);
    rpc PauseRollout(PauseRolloutRequest) returns (PauseRolloutResponse);
    rpc ResumeRollout(ResumeRolloutRequest) returns (ResumeRolloutResponse);
    rpc AbortRollout(AbortRolloutRequest) returns (AbortRolloutResponse);
    rpc RevertRollout(RevertRolloutRequest) returns (RevertRolloutResponse);
    rpc CompleteRollout(CompleteRolloutRequest) returns (CompleteRolloutResponse);
}

message RolloutLane {
    string lane_id = 1;
    string label = 2;
    string description = 3;
    int64 current_channel_id = 4 [deprecated = true];
    uint64 revision = 5;
    repeated RolloutLaneChannel channels = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
    RolloutLaneFirmwareConvergenceStatus firmware_convergence = 9 [deprecated = true];
    uint32 member_count = 10 [deprecated = true];
    repeated RolloutLaneModel models = 11;
    bool scalar_projection_available = 12;
    bool topology_enabled = 13;
}

message RolloutLaneChannel {
    int64 channel_id = 1;
    int64 release_set_id = 2;
    uint32 position = 3;
    optional string rollout_id = 4;
    bool current = 5;
    google.protobuf.Timestamp created_at = 6;
}

enum RolloutLaneModelCompatibility {
    ROLLOUT_LANE_MODEL_COMPATIBILITY_UNSPECIFIED = 0;
    ROLLOUT_LANE_MODEL_COMPATIBILITY_COMPATIBLE = 1;
    ROLLOUT_LANE_MODEL_COMPATIBILITY_TARGET_UNAVAILABLE = 2;
}

message RolloutLaneModelFirmwareTarget {
    int64 release_target_id = 1;
    int64 release_set_id = 2;
    string firmware_file_id = 3;
    string firmware_version = 4;
    string sha256 = 5;
}

message RolloutLaneModelChannel {
    int64 channel_id = 1;
    uint32 position = 2;
    bool current = 3;
    RolloutLaneModelFirmwareTarget firmware_target = 4;
    google.protobuf.Timestamp created_at = 5;
}

message RolloutLaneModelBindingSummary {
    uint32 active_count = 1;
    uint32 historical_count = 2;
}

message RolloutLaneModel {
    string lane_model_id = 1;
    string model_identity_key = 2;
    uint64 revision = 3;
    string manufacturer = 4;
    string model = 5;
    int64 current_channel_id = 6;
    RolloutLaneModelFirmwareTarget current_firmware_target = 7;
    uint32 member_count = 8;
    RolloutLaneModelBindingSummary bindings = 9;
    RolloutLaneFirmwareConvergenceStatus firmware_convergence = 10;
    repeated RolloutLaneModelChannel channels = 11;
    RolloutLaneModelCompatibility compatibility = 12;
}

message CreateRolloutLaneRequest {
    string label = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
    string description = 2 [(buf.validate.field).string.max_len = 1024];
    repeated string firmware_file_ids = 3 [(buf.validate.field).repeated = {
        min_items: 1
        max_items: 100
        unique: true
        items: {string: {min_len: 1}}
    }];
    repeated string device_identifiers = 4 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
    string idempotency_key = 5 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    bool confirm_initial_enforcement = 6;
    bool confirm_reassignment = 7;
    string reassignment_confirmation_token = 8;
}

message CreateRolloutLaneResponse {
    RolloutLane lane = 1;
}

message GetRolloutLaneRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    bool include_firmware_convergence_members = 2;
    google.protobuf.Timestamp firmware_convergence_members_updated_after = 3;
}

message GetRolloutLaneResponse {
    RolloutLane lane = 1;
}

message GetRolloutLaneForRolloutRequest {
    string rollout_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetRolloutLaneForRolloutResponse {
    RolloutLane lane = 1;
}

message ListRolloutLanesRequest {
    bool active_firmware_convergence_only = 1;
}

message ListRolloutLanesResponse {
    repeated RolloutLane lanes = 1;
}

message RolloutLaneMember {
    string device_identifier = 1;
    string manufacturer = 2;
    string model = 3;
    optional string observed_firmware_version = 4;
    int64 channel_id = 5;
    uint32 channel_position = 6;
    bool on_current_channel = 7;
    string pinned_release_version = 8;
    FirmwareTransitionMiner enforcement = 9;
}

message ListRolloutLaneMembersRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    uint32 page_size = 2 [(buf.validate.field).uint32.lte = 1000];
    string page_token = 3 [(buf.validate.field).string.max_len = 2048];
    bool include_total_count = 4;
    optional string lane_model_id = 5 [(buf.validate.field).string.uuid = true];
}

message ListRolloutLaneMembersResponse {
    repeated RolloutLaneMember members = 1;
    string next_page_token = 2;
    uint32 total_count = 3;
}

message RolloutLaneAssignment {
    string device_identifier = 1;
    string lane_id = 2;
    string lane_label = 3;
}

message GetRolloutLaneAssignmentsRequest {
    repeated string device_identifiers = 1 [(buf.validate.field).repeated = {
        min_items: 1
        max_items: 50
        unique: true
        items: {string: {min_len: 1}}
    }];
}

message GetRolloutLaneAssignmentsResponse {
    repeated RolloutLaneAssignment assignments = 1;
}

message RolloutLaneMembershipReassignment {
    string device_identifier = 1;
    string source_lane_id = 2;
    string source_lane_label = 3;
}

message PreviewRolloutLaneMembershipChangeRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    repeated string add_device_identifiers = 2 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
    repeated string remove_device_identifiers = 3 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
}

message PreviewRolloutLaneMembershipChangeResponse {
    RolloutLanePreview target_firmware_preview = 1;
    repeated RolloutLaneMembershipReassignment reassignments = 2;
    repeated RolloutLaneMember removals = 3;
    bool requires_firmware_confirmation = 4;
    bool requires_reassignment_confirmation = 5;
}

message UpdateRolloutLaneMembershipRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    uint64 expected_revision = 2 [(buf.validate.field).uint64.gt = 0];
    repeated string add_device_identifiers = 3 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
    repeated string remove_device_identifiers = 4 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
    bool confirm_firmware = 5;
    bool confirm_reassign = 6;
    string idempotency_key = 7 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    string reason = 8 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
}

message UpdateRolloutLaneMembershipResponse {
    RolloutLane lane = 1;
    repeated RolloutLaneMember transition_members = 2;
}

message RolloutLaneModelSelector {
    oneof selector {
        string lane_model_id = 1 [(buf.validate.field).string.uuid = true];
        string model_identity_key = 2 [(buf.validate.field).string = {min_len: 1, max_len: 512}];
    }
}

message PreviewRolloutLaneModelDeclarationRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    string firmware_file_id = 2 [(buf.validate.field).string.min_len = 1];
    repeated string device_identifiers = 3 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
}

message PreviewRolloutLaneModelDeclarationResponse {
    RolloutLanePreview preview = 1;
    string lane_id = 2 [(buf.validate.field).string.uuid = true];
}

message CreateRolloutLaneModelDeclarationRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    uint64 expected_revision = 2;
    string firmware_file_id = 3 [(buf.validate.field).string.min_len = 1];
    repeated string device_identifiers = 4 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
    string idempotency_key = 5 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    string reason = 6 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    bool confirm_initial_enforcement = 7;
    bool confirm_reassignment = 8;
    string reassignment_confirmation_token = 9;
}

message CreateRolloutLaneModelDeclarationResponse {
    RolloutLane lane = 1;
}

message PublishRolloutLaneModelTargetRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    RolloutLaneModelSelector declaration = 2 [(buf.validate.field).required = true];
    uint64 expected_revision = 3 [(buf.validate.field).uint64.gt = 0];
    string firmware_file_id = 4 [(buf.validate.field).string.min_len = 1];
    string idempotency_key = 5 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    string reason = 6 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
}

message PublishRolloutLaneModelTargetResponse {
    RolloutLane lane = 1;
}

message PreviewRolloutLaneModelMembershipChangeRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    RolloutLaneModelSelector declaration = 2 [(buf.validate.field).required = true];
    repeated string add_device_identifiers = 3 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
    repeated string remove_device_identifiers = 4 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
}

message PreviewRolloutLaneModelMembershipChangeResponse {
    RolloutLanePreview target_firmware_preview = 1;
    repeated RolloutLaneMembershipReassignment reassignments = 2;
    repeated RolloutLaneMember removals = 3;
    bool requires_firmware_confirmation = 4;
    bool requires_reassignment_confirmation = 5;
}

message UpdateRolloutLaneModelMembershipRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    RolloutLaneModelSelector declaration = 2 [(buf.validate.field).required = true];
    uint64 expected_revision = 3 [(buf.validate.field).uint64.gt = 0];
    repeated string add_device_identifiers = 4 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
    repeated string remove_device_identifiers = 5 [(buf.validate.field).repeated = {
        max_items: 10000
        unique: true
        items: {string: {min_len: 1}}
    }];
    bool confirm_firmware = 6;
    bool confirm_reassign = 7;
    string idempotency_key = 8 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    string reason = 9 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
}

message UpdateRolloutLaneModelMembershipResponse {
    RolloutLane lane = 1;
    repeated RolloutLaneMember transition_members = 2;
}

message DeleteRolloutLaneRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    uint64 expected_revision = 2 [(buf.validate.field).uint64.gt = 0];
    string idempotency_key = 3 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    string reason = 4 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
}

message DeleteRolloutLaneResponse {}

message StartRolloutLaneRequest {
    option (buf.validate.message).cel = {
        id: "start_rollout_lane_input_mode"
        message: "provide either legacy rollout fields or model plans"
        expression: "(size(this.model_plans) > 0 && size(this.firmware_file_ids) == 0 && size(this.batches) == 0 && !has(this.hashrate_policy)) || (size(this.model_plans) == 0 && size(this.firmware_file_ids) > 0 && size(this.batches) > 0)"
    };

    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
    repeated string firmware_file_ids = 3 [(buf.validate.field).repeated = {
        max_items: 100
        unique: true
        items: {string: {min_len: 1}}
    }];
    repeated CreateRolloutBatch batches = 4 [(buf.validate.field).repeated = {
        max_items: 1000
    }];
    string idempotency_key = 5 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    string reason = 6 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    RolloutHashratePolicy hashrate_policy = 7;
    repeated StartRolloutLaneModelPlan model_plans = 8 [(buf.validate.field).repeated = {
        max_items: 100
    }];
}

message StartRolloutLaneResponse {
    RolloutLane lane = 1;
    // Deprecated legacy child projection. New callers use parent and children.
    Rollout rollout = 2;
    RolloutGroup parent = 3;
    repeated StartedRolloutLaneModel children = 4;
}

message StartRolloutLaneModelPlan {
    string lane_model_id = 1 [(buf.validate.field).string.uuid = true];
    uint64 expected_model_revision = 2 [(buf.validate.field).uint64.gt = 0];
    string firmware_file_id = 3 [(buf.validate.field).string.min_len = 1];
    repeated CreateRolloutBatch batches = 4 [(buf.validate.field).repeated = {
        min_items: 1
        max_items: 1000
    }];
    RolloutHashratePolicy hashrate_policy = 5;
    string model_start_key = 6 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
}

message StartedRolloutLaneModel {
    Rollout child = 1;
    int64 first_batch_id = 2 [(buf.validate.field).int64.gt = 0];
}

enum RolloutLaneTopologyAnomalyType {
    ROLLOUT_LANE_TOPOLOGY_ANOMALY_TYPE_UNSPECIFIED = 0;
    ROLLOUT_LANE_TOPOLOGY_ANOMALY_TYPE_NULL_IDENTITY = 1;
    ROLLOUT_LANE_TOPOLOGY_ANOMALY_TYPE_AMBIGUOUS_TARGET_MATCH = 2;
    ROLLOUT_LANE_TOPOLOGY_ANOMALY_TYPE_NO_TARGET_MATCH = 3;
    ROLLOUT_LANE_TOPOLOGY_ANOMALY_TYPE_PHYSICAL_MISMATCH = 4;
    ROLLOUT_LANE_TOPOLOGY_ANOMALY_TYPE_MISSING_BINDING = 5;
    ROLLOUT_LANE_TOPOLOGY_ANOMALY_TYPE_DUPLICATE_ACTIVE_BINDING = 6;
}

enum RolloutLaneTopologyRepairAction {
    ROLLOUT_LANE_TOPOLOGY_REPAIR_ACTION_UNSPECIFIED = 0;
    ROLLOUT_LANE_TOPOLOGY_REPAIR_ACTION_CONFIRM_IDENTITY = 1;
    ROLLOUT_LANE_TOPOLOGY_REPAIR_ACTION_SELECT_DECLARATION = 2;
    ROLLOUT_LANE_TOPOLOGY_REPAIR_ACTION_REPAIR_PHYSICAL_MEMBERSHIP = 3;
    ROLLOUT_LANE_TOPOLOGY_REPAIR_ACTION_END_STALE_BINDING = 4;
    ROLLOUT_LANE_TOPOLOGY_REPAIR_ACTION_REPAIR_BINDING = 5;
    ROLLOUT_LANE_TOPOLOGY_REPAIR_ACTION_RERUN_BACKFILL = 6;
}

message RolloutLaneTopologyAnomaly {
    string anomaly_id = 1;
    string lane_id = 2;
    string device_identifier = 3;
    string lane_model_id = 4;
    uint64 lane_model_revision = 5;
    RolloutLaneTopologyAnomalyType type = 6;
    repeated RolloutLaneTopologyRepairAction supported_repair_actions = 7;
    google.protobuf.Struct details = 8;
}

message RolloutLaneTopologyReadiness {
    bool enabled = 1;
    uint64 revision = 2;
    uint64 anomaly_count = 3;
    uint64 active_legacy_rollout_count = 4;
    repeated RolloutLaneTopologyAnomaly anomalies = 5;
    google.protobuf.Timestamp updated_at = 6;
    string next_anomaly_page_token = 7;
}

message GetRolloutLaneTopologyReadinessRequest {
    uint32 anomaly_page_size = 1 [(buf.validate.field).uint32.lte = 100];
    string anomaly_page_token = 2 [(buf.validate.field).string.max_len = 2048];
}

message GetRolloutLaneTopologyReadinessResponse {
    RolloutLaneTopologyReadiness readiness = 1;
}

message RepairRolloutLaneModelBindingRequest {
    string lane_id = 1 [(buf.validate.field).string.uuid = true];
    string lane_model_id = 2 [(buf.validate.field).string.uuid = true];
    string device_identifier = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
    uint64 expected_revision = 4 [(buf.validate.field).uint64.gt = 0];
    string idempotency_key = 5 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    string reason = 6 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
}

message RepairRolloutLaneModelBindingResponse {
    string binding_id = 1;
    uint64 resulting_revision = 2;
    bool replayed = 3;
    RolloutLaneTopologyReadiness readiness = 4;
}

message EnableRolloutLaneModelTopologyRequest {
    uint64 expected_revision = 1 [(buf.validate.field).uint64.gt = 0];
    string idempotency_key = 2 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
    string reason = 3 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
}

message EnableRolloutLaneModelTopologyResponse {
    RolloutLaneTopologyReadiness readiness = 1;
    bool replayed = 2;
}

enum RolloutState {
    ROLLOUT_STATE_UNSPECIFIED = 0;
    ROLLOUT_STATE_CREATED = 1;
    ROLLOUT_STATE_RUNNING = 2;
    ROLLOUT_STATE_PAUSED = 3;
    ROLLOUT_STATE_REVIEW = 4;
    ROLLOUT_STATE_ABORTED = 5;
    ROLLOUT_STATE_COMPLETED = 6;
    ROLLOUT_STATE_COMPLETED_WITH_FAILURES = 7;
    ROLLOUT_STATE_REVERTING = 8;
    ROLLOUT_STATE_REVERTED = 9;
}

enum RolloutBatchState {
    ROLLOUT_BATCH_STATE_UNSPECIFIED = 0;
    ROLLOUT_BATCH_STATE_PENDING = 1;
    ROLLOUT_BATCH_STATE_ADMITTED = 2;
    ROLLOUT_BATCH_STATE_COMPLETED = 3;
    ROLLOUT_BATCH_STATE_CANCELLED = 4;
}

enum RolloutMemberState {
    ROLLOUT_MEMBER_STATE_UNSPECIFIED = 0;
    ROLLOUT_MEMBER_STATE_PENDING = 1;
    ROLLOUT_MEMBER_STATE_ADMITTED = 2;
    ROLLOUT_MEMBER_STATE_SUCCEEDED = 3;
    ROLLOUT_MEMBER_STATE_FAILED = 4;
    ROLLOUT_MEMBER_STATE_ATTENTION_REQUIRED = 5;
    ROLLOUT_MEMBER_STATE_CANCELLED = 6;
    ROLLOUT_MEMBER_STATE_REVERTING = 7;
    ROLLOUT_MEMBER_STATE_REVERTED = 8;
}

enum RolloutEvidencePhase {
    ROLLOUT_EVIDENCE_PHASE_UNSPECIFIED = 0;
    ROLLOUT_EVIDENCE_PHASE_BASELINE = 1;
    ROLLOUT_EVIDENCE_PHASE_POST = 2;
}

enum RolloutEvidenceStatus {
    ROLLOUT_EVIDENCE_STATUS_UNSPECIFIED = 0;
    ROLLOUT_EVIDENCE_STATUS_PENDING = 1;
    ROLLOUT_EVIDENCE_STATUS_COLLECTING = 2;
    ROLLOUT_EVIDENCE_STATUS_UNAVAILABLE = 3;
    ROLLOUT_EVIDENCE_STATUS_OBSERVING = 4;
    ROLLOUT_EVIDENCE_STATUS_HEALTHY = 5;
    ROLLOUT_EVIDENCE_STATUS_HELD = 6;
    ROLLOUT_EVIDENCE_STATUS_STALE = 7;
    ROLLOUT_EVIDENCE_STATUS_AUTOMATION_ERROR = 8;
    ROLLOUT_EVIDENCE_STATUS_FINALIZED = 9;
    ROLLOUT_EVIDENCE_STATUS_CANCELLED = 10;
}

message RolloutHashratePolicy {
    option (buf.validate.message).cel = {
        id: "hashrate_policy_max_drop_increment"
        message: "maximum hashrate drop must use 10-basis-point increments"
        expression: "this.max_drop_basis_points % 10u == 0u"
    };
    option (buf.validate.message).cel = {
        id: "hashrate_policy_healthy_duration_increment"
        message: "healthy duration must use 10-second increments"
        expression: "this.healthy_duration_seconds % 10u == 0u"
    };

    uint32 max_drop_basis_points = 1 [(buf.validate.field).uint32.lte = 10000];
    uint32 healthy_duration_seconds = 2 [(buf.validate.field).uint32 = {gte: 10, lte: 1800}];
}

message Rollout {
    string rollout_id = 1;
    string name = 2;
    string strategy_key = 3;
    RolloutState state = 4;
    uint64 revision = 5;

    optional int64 source_channel_id = 10;
    optional int64 target_channel_id = 11;
    optional int64 source_release_set_id = 12;
    optional int64 target_release_set_id = 13;
    google.protobuf.Struct source_snapshot = 14;
    google.protobuf.Struct target_snapshot = 15;
    google.protobuf.Struct revert_snapshot = 16;
    RolloutHashratePolicy hashrate_policy = 17;

    string reason = 20;
    google.protobuf.Timestamp started_at = 21;
    google.protobuf.Timestamp paused_at = 22;
    google.protobuf.Timestamp aborted_at = 23;
    google.protobuf.Timestamp completed_at = 24;
    google.protobuf.Timestamp reverting_at = 25;
    google.protobuf.Timestamp reverted_at = 26;
    google.protobuf.Timestamp created_at = 27;
    google.protobuf.Timestamp updated_at = 28;

    repeated RolloutBatch batches = 30;
    repeated RolloutMember members = 31;
    repeated RolloutCause causes = 32;
    optional string parent_id = 33;
    optional string lane_id = 34;
    optional string lane_model_id = 35;
    optional string model_identity_key = 36;
    optional string manufacturer = 37;
    optional string model = 38;
    uint32 member_count = 39;
    repeated RolloutMemberStateCount member_state_counts = 40;
    repeated RolloutBatchSummary batch_summaries = 41;
    bool summary_only = 42;
    bool failed_admission = 43;
}

message RolloutMemberStateCount {
    RolloutMemberState state = 1;
    uint32 count = 2;
}

message RolloutBatchSummary {
    int64 batch_id = 1;
    uint32 position = 2;
    string label = 3;
    RolloutBatchState state = 4;
    uint64 revision = 5;
    uint32 member_count = 6;
    google.protobuf.Timestamp completed_at = 7;
    RolloutBatchEvidenceSummary evidence_summary = 8;
    uint32 admission_attempt = 9;
}

message RolloutGroup {
    string parent_id = 1;
    string lane_id = 2;
    string name = 3;
