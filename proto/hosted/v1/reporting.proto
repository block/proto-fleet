  string status = 8;
  bool complete = 9;
  google.protobuf.Timestamp issued_at = 10;
  string correction_of = 11;
  string correction_reason = 12;
  string exception = 13;
  ReportingDeadlines deadlines = 14;
  string delivery_status = 15;
}
message HostReportSummary {
  ReportSummary report = 1;
  int64 created_by = 2;
  int64 owner_id = 3;
  int64 input_revision = 4;
  bool can_publish = 5;
}

message HostReportDelivery {
