  string requester = 4 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];
  string scope = 5 [(buf.validate.field).string = {min_len: 1, max_len: 4000}];
  string owner_user_id = 6 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp target_at = 7;
  string limitations = 8 [(buf.validate.field).string.max_len = 4000];
  string communication_ref = 9 [(buf.validate.field).string.max_len = 2000];
  string delivery_ref = 10 [(buf.validate.field).string.max_len = 2000];
