  string fulfillment_ref = 12 [(buf.validate.field).string.max_len = 2000];
}
message HostReportRequestInput {
  google.protobuf.Timestamp received_at = 1 [(buf.validate.field).required = true];
  string source_ref = 2 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];
  string requester = 3 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];
  string scope = 4 [(buf.validate.field).string = {min_len: 1, max_len: 4000}];
  string owner_user_id = 5 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp target_at = 6;
  string limitations = 7 [(buf.validate.field).string.max_len = 4000];
