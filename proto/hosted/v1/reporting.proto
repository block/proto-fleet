message ListHostReportRequestsRequest {
  string account_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  string page_token = 3 [(buf.validate.field).string.max_len = 2048];
}
message ListHostReportRequestsResponse {
  repeated HostReportRequest requests = 1;
  string next_page_token = 2;
}

// State changes create a new generation; acknowledgements apply to that exact state.
message HostReportQueueEvent {
 int64 generation = 1;
 string kind = 2;
 string actor_user_id = 3;
 string reason = 4;
 google.protobuf.Timestamp created_at = 5;
}
message HostReportQueueItem {
 string queue_id = 1;
 string account_id = 2;
 string account_name = 3;
 string kind = 4;
 ReportingPeriod period = 5;
 string owner_user_id = 6;
 HostReportSummary report = 7;
 HostReportRequest request = 8;
 ReportingDeadlines deadlines = 9;
 repeated string reasons = 10;
 string delivery_status = 11;
 string notification_status = 12;
 repeated HostReportQueueEvent events = 13;
 int64 generation = 14;
 bool can_acknowledge = 15;
 bool can_retry = 16;
 int64 attempts = 17;
 string owner_username = 18;
}
// Lists active work in descending creation order. Quiet and superseded rows remain retained as history.
message ListHostReportQueueRequest {
 int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}]; // Defaults to 50.
 string page_token = 2 [(buf.validate.field).string.max_len = 512];
}
message ListHostReportQueueResponse {
 repeated HostReportQueueItem items = 1;
 // Continue even when this page has no items: current site admission can filter a raw page.
 string next_page_token = 2;
}
message AcknowledgeHostReportQueueRequest {
 string account_id = 1 [(buf.validate.field).string.uuid = true];
 string queue_id = 2 [(buf.validate.field).string.uuid = true];
 int64 expected_generation = 3 [(buf.validate.field).int64.gt = 0];
 string reason = 4 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];
}
message AcknowledgeHostReportQueueResponse {}
message RetryHostReportQueueNotificationRequest {
 string account_id = 1 [(buf.validate.field).string.uuid = true];
 string queue_id = 2 [(buf.validate.field).string.uuid = true];
 int64 expected_generation = 3 [(buf.validate.field).int64.gt = 0];
 string reason = 4 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];
}
message RetryHostReportQueueNotificationResponse {}
