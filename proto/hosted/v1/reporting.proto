 google.protobuf.Timestamp delivered_at = 4 [(buf.validate.field).required = true];
 string delivery_ref = 5 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];
 string communication_ref = 6 [(buf.validate.field).string.max_len = 2000];
 string evidence = 7 [(buf.validate.field).string = {min_len: 1, max_len: 8000}];
