<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fog Proto Logo Volume</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100vh;
      min-width: 0;
    }
  </style>
</head>
<body>
  <canvas id="scene" width="240" height="240" aria-label="Animated Proto logo"></canvas>

  <script>
    const colorOptions = [{ id: "scene", layer: "black" }];
    const layerColors = {
      white: [255, 255, 255]
    };
    let foregroundColor = "rgb(0 0 0 / 90%)";
    const logoPathData = "M8.02671 0.101377C7.29433 0.254691 6.60478 0.647148 5.22567 1.43206L3.82683 2.22821C2.43299 3.02151 1.73607 3.41816 1.22908 3.97511C0.780513 4.46788 0.441524 5.04919 0.234254 5.68108C-9.46936e-06 6.39527 -6.29253e-06 7.19372 6.59957e-08 8.79062L4.12793e-06 9.81075C1.0516e-05 11.4151 1.37143e-05 12.2172 0.236159 12.934C0.445087 13.5682 0.78673 14.1512 1.2386 14.6447C1.74934 15.2024 2.45119 15.5979 3.85488 16.389L5.25726 17.1793L5.25727 17.1793C6.62558 17.9504 7.30973 18.336 8.03568 18.4869C8.6781 18.6204 9.34135 18.6201 9.98367 18.4862C10.7095 18.3348 11.3934 17.9488 12.7612 17.1767L14.1497 16.393C15.5518 15.6016 16.2528 15.2059 16.763 14.6483C17.2143 14.1549 17.5555 13.5722 17.7642 12.9383C18 12.2219 18 11.4204 18 9.81725L18 8.78938C18 7.19511 18 6.39797 17.7664 5.68472C17.5597 5.05365 17.2216 4.47294 16.7742 3.98042C16.2685 3.42376 15.5734 3.02673 14.183 2.23267L12.791 1.43768C11.4131 0.650716 10.7241 0.257236 9.99199 0.102836C9.34415 -0.0337854 8.67475 -0.0342821 8.02671 0.101377ZM6.45652 6.94689C5.15985 6.94689 4.1087 7.99805 4.1087 9.29472C4.1087 10.5914 5.15985 11.6425 6.45652 11.6425H11.5435C12.8401 11.6425 13.8913 10.5914 13.8913 9.29472C13.8913 7.99805 12.8401 6.94689 11.5435 6.94689H6.45652Z";
    const logoPath = typeof Path2D === "function" ? new Path2D(logoPathData) : null;
    const sampleCanvas = document.createElement("canvas");
    const sampleCtx = sampleCanvas.getContext("2d");
    const svgPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    svgPath.setAttribute("d", logoPathData);
    const volumeDepth = 0.25;
    const crossSectionCount = 22;
    const maxRenderRatio = 1.5;
    const pointBudgets = {
      standard: 10500,
      highDensity: 12000
    };

    const state = {
      points: [],
      pointStride: 1
    };

    const targets = colorOptions.map((option) => {
      const canvas = document.getElementById(option.id);
      return {
        ...option,
        canvas,
        ctx: canvas.getContext("2d", { alpha: true, desynchronized: true }),
        width: 0,
        height: 0,
        ratio: 1
      };
    });
    const buffers = {
      mask: createRenderBuffer(),
      black: createRenderBuffer()
    };
    const perf = {
      frameMs: 0,
      fps: 0,
      pointCount: 0,
      projectedCount: 0,
      sample: 0
    };
    window.fogProtoPerf = perf;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, amount) {
      return a + (b - a) * amount;
    }

    function colorWithAlpha(color, alpha) {
      return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
    }

    function createRenderBuffer() {
      const canvas = document.createElement("canvas");
      return {
        canvas,
        ctx: canvas.getContext("2d", { alpha: true, desynchronized: true }),
        width: 0,
        height: 0,
        ratio: 1
      };
    }

    function resizeBuffer(buffer, width, height, ratio) {
      buffer.width = width;
      buffer.height = height;
      buffer.ratio = ratio;
      buffer.canvas.width = Math.round(width * ratio);
      buffer.canvas.height = Math.round(height * ratio);
      buffer.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function random(seed) {
      let value = seed >>> 0;
      return () => {
        value += 0x6D2B79F5;
        let next = value;
        next = Math.imul(next ^ next >>> 15, next | 1);
        next ^= next + Math.imul(next ^ next >>> 7, next | 61);
        return ((next ^ next >>> 14) >>> 0) / 4294967296;
      };
    }

    function isInsideLogo(x, y) {
      if (!sampleCtx || !logoPath) return true;
      return sampleCtx.isPointInPath(logoPath, x, y, "evenodd");
    }

    function normalizeLogoPoint(x, y, z, kind, entropy) {
      return {
        x: (x - 9) / 9.05,
        y: (y - 9.5) / 9.05,
        z,
        kind,
        entropy
      };
    }

    function buildPoints() {
      const rng = random(1337);
      const points = [];
      const depth = volumeDepth;
      const faceCount = 1800;
      const coreCount = 2200;
      const softBoundarySteps = 120;
      const softBoundaryLayers = 8;
      const volumeColumns = 32;
      const volumeRows = 34;
      const volumeLayers = crossSectionCount;

      for (let i = 0; i < faceCount; i += 1) {
        const x = rng() * 18;
        const y = rng() * 19;
        if (!isInsideLogo(x, y)) continue;
        const z = rng() > 0.5 ? depth : -depth;
        points.push(normalizeLogoPoint(x, y, z, "face", rng()));
      }

      for (let i = 0; i < coreCount; i += 1) {
        const x = rng() * 18;
        const y = rng() * 19;
        if (!isInsideLogo(x, y)) continue;
        const z = lerp(-depth, depth, rng());
        points.push(normalizeLogoPoint(x, y, z, "core", rng()));
      }

      for (let layer = 0; layer < volumeLayers; layer += 1) {
        const zAmount = volumeLayers === 1 ? 0.5 : layer / (volumeLayers - 1);
        const z = lerp(-depth, depth, zAmount) + (rng() - 0.5) * 0.035;
        for (let col = 0; col < volumeColumns; col += 1) {
          for (let row = 0; row < volumeRows; row += 1) {
            const stagger = row % 2 === 0 ? 0.18 : -0.18;
            const x = ((col + 0.5 + stagger + (rng() - 0.5) * 0.2) / volumeColumns) * 18;
            const y = ((row + 0.5 + (layer % 2) * 0.18 + (rng() - 0.5) * 0.2) / volumeRows) * 19;
            if (!isInsideLogo(x, y)) continue;
            if (layer > 0 && layer < volumeLayers - 1 && rng() < 0.06) continue;
            points.push(normalizeLogoPoint(x, y, z, "core", rng()));
          }
        }
      }

      try {
        const length = svgPath.getTotalLength();
        for (let step = 0; step < softBoundarySteps; step += 1) {
          const pathPoint = svgPath.getPointAtLength(((step + rng() * 0.35) / softBoundarySteps) * length);
          for (let layer = 0; layer < softBoundaryLayers; layer += 1) {
            const angle = rng() * Math.PI * 2;
            const scatter = 0.18 + rng() * 0.36;
            const x = pathPoint.x + Math.cos(angle) * scatter;
            const y = pathPoint.y + Math.sin(angle) * scatter;
            if (!isInsideLogo(x, y)) continue;
            const zAmount = softBoundaryLayers === 1 ? 0.5 : (layer + rng() * 0.25) / (softBoundaryLayers - 1 + 0.25);
            const z = lerp(-depth, depth, zAmount);
            points.push(normalizeLogoPoint(x, y, z, "core", rng()));
          }
        }
      } catch (error) {
        for (let i = 0; i < 520; i += 1) {
          const angle = (i / 520) * Math.PI * 2;
          const x = 9 + Math.cos(angle) * 8.5;
          const y = 9.5 + Math.sin(angle) * 8.85;
          const z = lerp(-depth, depth, rng());
          points.push(normalizeLogoPoint(x, y, z, "core", rng()));
        }
      }

      state.points = points;
    }

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, maxRenderRatio);
      for (const target of targets) {
        const bounds = target.canvas.getBoundingClientRect();
        const width = Math.max(1, Math.round(bounds.width));
        const height = Math.max(1, Math.round(bounds.height));
        target.width = width;
        target.height = height;
        target.ratio = ratio;
        target.canvas.width = Math.round(width * ratio);
        target.canvas.height = Math.round(height * ratio);
        target.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      const reference = targets[0];
      resizeBuffer(buffers.mask, reference.width, reference.height, reference.ratio);
      resizeBuffer(buffers.black, reference.width, reference.height, reference.ratio);
      const pointBudget = window.devicePixelRatio > 1 ? pointBudgets.highDensity : pointBudgets.standard;
      state.pointStride = Math.max(1, Math.ceil(state.points.length / pointBudget));

      // A resize clears each canvas. Redraw the single permitted frame so
      // reduced-motion users never see a blank animation after resizing.
      if (reducedMotion.matches) {
        renderStaticFrame();
      }
    }

    function rotatePoint(point, time) {
      const yaw = time * 0.86;
      const cosY = Math.cos(yaw);
      const sinY = Math.sin(yaw);
      return {
        x: point.x * cosY - point.z * sinY,
        y: point.y,
        z: point.x * sinY + point.z * cosY,
        kind: point.kind,
        entropy: point.entropy
      };
    }

    function drawCrossSectionGlow(ctx, time, width, height, scale, focal, camera) {
      if (!logoPath) return;

      const yaw = time * 0.86;
      const cosY = Math.cos(yaw);
      const sinY = Math.sin(yaw);
      const xCompression = clamp(Math.abs(cosY), 0.2, 1);

      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.filter = "blur(7px)";
      ctx.fillStyle = "#fff";

      for (let layer = 0; layer < crossSectionCount; layer += 1) {
        const amount = crossSectionCount === 1 ? 0.5 : layer / (crossSectionCount - 1);
        const z = lerp(-volumeDepth, volumeDepth, amount);
        const rotatedX = -z * sinY;
        const rotatedZ = z * cosY;
        const zCamera = camera - rotatedZ;
        if (zCamera <= 0.35) continue;

        const perspective = focal / zCamera;
        const sx = width * 0.5 + rotatedX * scale * perspective;
        const sy = height * 0.5;
        const logoScale = scale * perspective / 9.05;
        const centerWeight = 1 - Math.abs(amount * 2 - 1);
        const near = clamp(1 - (zCamera - 2.1) / 2.25, 0, 1);

        ctx.save();
        ctx.globalAlpha = (0.008 + near * 0.014) * (0.62 + centerWeight * 0.38);
        ctx.translate(sx, sy);
        ctx.scale(logoScale * xCompression, logoScale);
        ctx.translate(-9, -9.5);
        ctx.fill(logoPath, "evenodd");
        ctx.restore();
      }

      ctx.filter = "none";
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function projectFrame(time, width, height) {
      const minSize = Math.min(width, height);
      const previewSize = Math.min(minSize, 240);
      const scale = previewSize * 0.42;
      const focal = 2.7;
      const camera = 3.55 + Math.sin(time * 0.24) * 0.08;
      const projected = [];

      for (let index = 0; index < state.points.length; index += state.pointStride) {
        const point = state.points[index];
        const rotated = rotatePoint(point, time);
        const zCamera = camera - rotated.z;
        if (zCamera <= 0.35) continue;
        const perspective = focal / zCamera;
        const sx = width * 0.5 + rotated.x * scale * perspective;
        const sy = height * 0.5 + rotated.y * scale * perspective;
        if (sx < -40 || sx > width + 40 || sy < -40 || sy > height + 40) continue;
        projected.push({
          x: sx,
          y: sy,
          z: zCamera,
          perspective,
          kind: rotated.kind,
          entropy: rotated.entropy
        });
      }

      return {
        width,
        height,
        minSize,
        scale,
        focal,
        camera,
        projected
      };
    }

    function drawPointMask(ctx, projected, time) {
      const bucketCount = 18;
      const buckets = Array.from({ length: bucketCount }, () => null);

      for (const point of projected) {
        const near = clamp(1 - (point.z - 2.1) / 2.25, 0, 1);
        const glint = Math.pow(0.5 + Math.sin(time * 2.4 + point.entropy * 30) * 0.5, 3);
        const depthWeight = point.kind === "face" ? 0.96 : 0.9;
        const alpha = clamp((0.025 + near * 0.22 + glint * 0.08) * depthWeight, 0.018, 0.44);
        const baseRadius = 0.64;
        const radius = baseRadius * point.perspective * (1 + glint * 0.24);
        const bucket = clamp(Math.round(alpha * (bucketCount - 1)), 1, bucketCount - 1);
        if (!buckets[bucket]) buckets[bucket] = new Path2D();
        buckets[bucket].moveTo(point.x + radius, point.y);
        buckets[bucket].arc(point.x, point.y, radius, 0, Math.PI * 2);
      }

      ctx.globalCompositeOperation = "source-over";
      for (let bucket = 1; bucket < bucketCount; bucket += 1) {
        if (!buckets[bucket]) continue;
        ctx.fillStyle = colorWithAlpha(layerColors.white, bucket / (bucketCount - 1));
        ctx.fill(buckets[bucket]);
      }
    }

    function drawHazeMask(ctx, width, height, minSize) {
      const haze = ctx.createRadialGradient(width * 0.5, height * 0.5, minSize * 0.12, width * 0.5, height * 0.5, minSize * 0.64);
      haze.addColorStop(0, colorWithAlpha(layerColors.white, 0.035));
      haze.addColorStop(0.52, colorWithAlpha(layerColors.white, 0.014));
      haze.addColorStop(1, colorWithAlpha(layerColors.white, 0));
      ctx.fillStyle = haze;
      ctx.fillRect(0, 0, width, height);
    }

    function renderMask(frame, time) {
      const buffer = buffers.mask;
      const ctx = buffer.ctx;
      ctx.setTransform(buffer.ratio, 0, 0, buffer.ratio, 0, 0);
      ctx.globalAlpha = 1;
      ctx.filter = "none";
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, buffer.width, buffer.height);
      drawCrossSectionGlow(ctx, time, frame.width, frame.height, frame.scale, frame.focal, frame.camera);
      drawPointMask(ctx, frame.projected, time);
      drawHazeMask(ctx, frame.width, frame.height, frame.minSize);
    }

    function tintBuffer(buffer, mask, color) {
      const ctx = buffer.ctx;
      ctx.setTransform(buffer.ratio, 0, 0, buffer.ratio, 0, 0);
      ctx.globalAlpha = 1;
      ctx.filter = "none";
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, buffer.width, buffer.height);
      ctx.drawImage(mask.canvas, 0, 0, buffer.width, buffer.height);
      ctx.globalCompositeOperation = "source-in";
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, buffer.width, buffer.height);
      ctx.globalCompositeOperation = "source-over";
    }

    function drawTarget(target) {
      const ctx = target.ctx;
      const layer = buffers[target.layer];
      ctx.setTransform(target.ratio, 0, 0, target.ratio, 0, 0);
      ctx.globalAlpha = 1;
      ctx.filter = "none";
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, target.width, target.height);
      ctx.drawImage(layer.canvas, 0, 0, target.width, target.height);
    }

    const targetFrameInterval = 1000 / 24;
    let lastFrameNow = 0;
    let animationFrameId = null;
    let isVisible = true;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function shouldAnimate() {
      return isVisible && !document.hidden && !reducedMotion.matches;
    }

    function requestDraw() {
      if (animationFrameId === null && shouldAnimate()) {
        animationFrameId = requestAnimationFrame(draw);
      }
    }

    function draw(now) {
      animationFrameId = null;

      if (!shouldAnimate()) {
        return;
      }

      if (lastFrameNow && now - lastFrameNow < targetFrameInterval) {
        requestDraw();
        return;
      }

      const frameStart = performance.now();
      const time = now * 0.001;
      const reference = buffers.mask;
      const frame = projectFrame(time, reference.width, reference.height);
      renderMask(frame, time);
      tintBuffer(buffers.black, buffers.mask, foregroundColor);
      for (const target of targets) {
        drawTarget(target);
      }

      const elapsed = performance.now() - frameStart;
      const frameDelta = lastFrameNow ? now - lastFrameNow : targetFrameInterval;
      // Preserve the fractional interval so a 24 FPS cap can alternate between
      // two and three display refreshes instead of settling at 20 FPS on 60 Hz screens.
      lastFrameNow = now - ((now - lastFrameNow) % targetFrameInterval);
      perf.frameMs = perf.frameMs ? lerp(perf.frameMs, elapsed, 0.12) : elapsed;
      perf.fps = perf.fps ? lerp(perf.fps, 1000 / frameDelta, 0.12) : 1000 / frameDelta;
      perf.pointCount = state.points.length;
      perf.projectedCount = frame.projected.length;
      perf.sample += 1;
      if (perf.sample % 30 === 0) {
        document.documentElement.dataset.fogFrameMs = perf.frameMs.toFixed(2);
        document.documentElement.dataset.fogFps = perf.fps.toFixed(1);
        document.documentElement.dataset.fogPoints = String(perf.pointCount);
        document.documentElement.dataset.fogProjected = String(perf.projectedCount);
      }
      requestDraw();
    }

    function renderStaticFrame() {
      const now = performance.now();
      const time = 0;
      const reference = buffers.mask;
      const frame = projectFrame(time, reference.width, reference.height);
      renderMask(frame, time);
      tintBuffer(buffers.black, buffers.mask, foregroundColor);
      for (const target of targets) {
        drawTarget(target);
      }
      lastFrameNow = now;
    }

    function updatePlayback() {
      if (shouldAnimate()) {
        requestDraw();
      } else if (reducedMotion.matches) {
        renderStaticFrame();
      }
    }

    buildPoints();
    resize();
    window.addEventListener("message", (event) => {
      const { data } = event;
      if (
        data?.type === "proto-fleet-animation-theme" &&
        typeof data.foreground === "string" &&
        CSS.supports("color", data.foreground)
      ) {
        foregroundColor = data.foreground;
        if (reducedMotion.matches) {
          renderStaticFrame();
        }
      }
    });
    window.addEventListener("resize", resize);
    window.addEventListener("visibilitychange", updatePlayback);
    reducedMotion.addEventListener("change", updatePlayback);
    window.addEventListener("message", (event) => {
      if (event.data?.type === "proto-fleet-animation-playback") {
        isVisible = Boolean(event.data.isVisible);
        updatePlayback();
      }
    });
    if (reducedMotion.matches) {
      renderStaticFrame();
    } else {
      requestDraw();
    }
  </script>
</body>
</html>
