# Accepted findings for `just vuln-scan-lockfiles`. Each entry expires on its
# ignoreUntil date so the scan fails again until someone re-reviews it.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-05
reason = """
minimatch 10.2.6 is a dev-only dependency of eslint, typescript-eslint, and \
eslint-plugin-import-x. The fix is minimatch 11, which removes makeRe() that \
eslint-plugin-import-x imports, and no released consumer accepts 11 yet. The \
vulnerable path needs optimizationLevel >= 2, which only glob sets, and glob \
uses its own minimatch 11 copy.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
ignoreUntil = 2027-02-05
reason = """
unsafe-libyaml is unmaintained and has no fixed release. ASIC-rs reaches it \
through serde_yaml_ng to parse its trusted plugin configuration. Replacing \
serde_yaml_ng is tracked in \
https://github.com/btc-mining/proto-fleet-internal/issues/397.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2026-12-18
reason = """
RustSec marks chrono as unmaintained and lists no fixed version. ASIC-rs \
pulls it in through the Antminer, Braiins, and WhatsMiner firmware crates. \
ASIC-rs 0.8.10 still depends on it. Recheck for an ASIC-rs release that \
replaces chrono before renewing this exception.
"""
